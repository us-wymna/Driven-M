arret":"follow","bouche-incendie":"hydrant","angle-mort":"blindspot",retroviseurs:"scan",aquaplanage:"skid",derapage:"skid",collision:"hazards","feux-panne":"hazards",cycliste:"cyclist","sortie-manquee":"continue","passage-niveau":"railway",tramway:"tram","move-over":"moveover","demi-tour":"uturn","depassement-droite":"passright",bretelle:"merge",pente:"hillpark",brigadier:"pedestrian","pieton-aveugle":"pedestrian","passage-pietons":"pedestrian","policier-circulation":"stop",acrobatique:"forbidden",telephone:"forbidden","permis-pret":"forbidden",giratoire:"roundabout",travaux:"speedlimit","entree-privee":"driveway",depasse:"passed",documents:"drive",points:"drive","permis-16":"drive",calendrier:"drive"};function $w(e){if(e.sign)return Zw[e.sign]??"drive";let t=es[e.id];if(!t)return null;return Jw[t]??null}var eS={stop:{fr:["Avance jusqu'à la ligne d'arrêt, juste avant le passage piétons.","Arrête complètement — les roues ne tournent plus, même si la voie semble libre.","Regarde à gauche, à droite, puis encore à gauche.","Avance seulement quand la voie est libre."],en:["Roll up to the stop line, just before the crosswalk.","Stop completely — wheels fully stopped, even if the way looks clear.","Look left, right, then left again.","Proceed only when the way is clear."]},yield:{fr:["Ralentis en approchant du triangle « Cédez le passage ».","Arrête au besoin : les véhicules et les piétons déjà engagés passent d'abord.","Repars seulement quand l'espace devant toi est libre."],en:["Slow down as you approach the yield sign.","Stop if needed: vehicles and pedestrians already in the intersection go first.","Proceed only when the space ahead is clear."]},stoplight:{fr:["Feu rouge : arrête complètement à la ligne d'arrêt.","Attends le feu vert — ne brûle jamais un feu rouge.","Au vert, vérifie que l'intersection est libre, puis avance."],en:["Red light: stop completely at the stop line.","Wait for the green light — never run a red light.","On green, check that the intersection is clear, then go."]},redright:{fr:["Arrête complètement au feu rouge, à la ligne d'arrêt.","Cède le passage aux piétons et aux véhicules qui ont le feu vert.","Tourne à droite lentement, seulement si aucun panneau ne l'interdit et si la voie est libre."],en:["Stop completely at the red light, at the stop line.","Yield to pedestrians and to traffic that has the green light.","Turn right slowly, only if no sign prohibits it and the way is clear."]},leftturn:{fr:["Avance au centre de l'intersection, roues droites, et attends.","Cède le passage aux véhicules en sens inverse et aux piétons qui traversent.","Quand la voie est libre, tourne à gauche en un seul mouvement fluide."],en:["Move into the centre of the intersection, wheels straight, and wait.","Yield to oncoming vehicles and to crossing pedestrians.","When the way is clear, turn left in one smooth movement."]},fourstop:{fr:["À un arrêt toutes directions, le premier véhicule complètement arrêté passe en premier.","Arrête complètement à ton tour et retiens l'ordre d'arrivée.","En cas d'égalité, cède au véhicule à ta droite, puis avance à ton tour."],en:["At an all-way stop, the first vehicle to stop completely goes first.","Stop completely yourself and remember the arrival order.","If you arrive at the same time, yield to the vehicle on your right, then take your turn."]},roundabout:{fr:["En approchant, ralentis et cède aux véhicules déjà dans le carrefour.","Entre quand un espace libre se présente, puis circule dans le sens antihoraire — l'îlot reste à ta gauche.","Signale ta sortie et quitte le carrefour sans t'arrêter dedans."],en:["Approaching, slow down and yield to vehicles already in the roundabout.","Enter when a gap opens, then travel counterclockwise — the island stays on your left.","Signal your exit and leave without stopping inside."]},follow:{fr:["Garde au moins 2 secondes d'écart avec le véhicule devant toi.","Choisis un repère fixe : quand il le passe, compte « mille et un, mille et deux ».","Si tu atteins le repère avant la fin du compte, tu es trop près : ralentis."],en:["Keep at least a 2-second gap behind the vehicle ahead.","Pick a fixed marker: when it passes it, count “one thousand one, one thousand two.”","If you reach the marker before finishing the count, you are too close: slow down."]},pedestrian:{fr:["Ralentis en approchant du passage piétons et prépare-toi à arrêter.","Arrête avant la ligne et laisse le piéton traverser au complet.","Repars seulement quand le piéton a quitté ta voie."],en:["Slow down approaching the crosswalk and be ready to stop.","Stop before the line and let the pedestrian cross completely.","Proceed only once the pedestrian has left your lane."]},schoolbus:{fr:["Feux rouges clignotants et bras d'arrêt déployé : arrête à au moins 20 m de l'autobus, dans les deux sens (sauf autoroute divisée par un terre-plein).","Attends, même si aucun enfant n'est visible.","Repars seulement quand les feux sont éteints et le bras d'arrêt rentré."],en:["Flashing red lights and stop arm out: stop at least 20 m from the bus, in both directions (except on a divided highway).","Wait, even if you cannot see any children.","Proceed only when the lights are off and the stop arm is retracted."]},emergency:{fr:["Un véhicule d'urgence approche, gyrophares allumés : signale et range-toi à droite.","Arrête complètement et laisse-le passer.","Reprends la route seulement quand la voie est libre."],en:["An emergency vehicle approaches with lights flashing: signal and pull to the right.","Stop completely and let it pass.","Re-enter the road only when the way is clear."]},moveover:{fr:["Un véhicule est arrêté sur l'accotement, gyrophares ou feux de détresse allumés.","Change de voie pour lui laisser un corridor de sécurité, si tu peux le faire sans danger.","Si c'est impossible, ralentis et passe avec une grande prudence."],en:["A vehicle is stopped on the shoulder with lights flashing.","Move over one lane to give it a safety corridor, if you can do so safely.","If you cannot, slow down and pass with great care."]},passed:{fr:["Un conducteur te dépasse : déplace-toi légèrement vers la droite.","Maintiens ta vitesse — n'accélère surtout pas.","Laisse-le terminer sa manœuvre et se rabattre devant toi."],en:["A driver is passing you: move slightly to the right.","Maintain your speed — never speed up.","Let them finish the pass and merge back in front of you."]},passright:{fr:["Le véhicule devant signale à gauche et se prépare à tourner.","S'il y a assez d'espace pavé à sa droite, tu peux le dépasser par la droite, lentement.","Ne roule jamais sur l'accotement non pavé pour dépasser."],en:["The vehicle ahead is signalling left and preparing to turn.","If there is enough paved space on its right, you may pass on the right, slowly.","Never use the unpaved shoulder to pass."]},cyclist:{fr:["En approchant d'un cycliste, ralentis et prépare ton dépassement.","Laisse au moins 1 m d'espace latéral entre ton véhicule et le cycliste.","Reviens dans ta voie seulement quand le cycliste est bien derrière toi."],en:["Approaching a cyclist, slow down and prepare to pass.","Leave at least 1 m of space between your vehicle and the cyclist.","Move back only when the cyclist is well behind you."]},merge:{fr:["Sur la bretelle, accélère pour atteindre la vitesse de l'autoroute.","Signale, vérifie ton angle mort et vise un espace libre entre les véhicules.","Insère-toi sans forcer les autres à freiner, puis ajuste ta vitesse."],en:["On the ramp, accelerate to highway speed.","Signal, check your blind spot, and aim for a gap between vehicles.","Merge without forcing others to brake, then match the flow."]},railway:{fr:["Feux clignotants ou barrière baissée : arrête à au moins 5 m du rail le plus proche.","Attends le passage complet du train — ne zigzague jamais entre les barrières.","Traverse seulement quand les feux sont éteints et la voie est libre des deux côtés."],en:["Flashing lights or a lowered gate: stop at least 5 m from the nearest rail.","Wait for the train to pass completely — never zigzag around the gates.","Cross only when the lights are off and the way is clear both ways."]},uturn:{fr:["Vérifie d'abord que le demi-tour est permis ici : interdit dans une courbe, au sommet d'une côte, près d'un pont, d'un tunnel ou d'un passage à niveau.","Tu dois voir clairement à au moins 150 m dans les deux directions.","Signale, cède le passage à tout le monde, puis tourne en un seul arc continu."],en:["First check that a U-turn is allowed here: never on a curve, a hill crest, or near a bridge, tunnel or railway crossing.","You must see clearly at least 150 m in both directions.","Signal, yield to everyone, then turn in one continuous arc."]},skid:{fr:["L'arrière glisse : lève le pied de l'accélérateur, sans freiner brusquement.","Tourne le volant dans la direction où tu veux aller.","Quand l'adhérence revient, redresse doucement le volant."],en:["The rear is sliding: ease off the accelerator, without braking hard.","Steer in the direction you want to go.","When grip returns, straighten the wheel gently."]},blindspot:{fr:["Avant de changer de voie, signale et vérifie tes rétroviseurs.","Tourne la tête pour vérifier ton angle mort : un véhicule peut s'y cacher.","Change de voie seulement quand l'espace est vraiment libre."],en:["Before changing lanes, signal and check your mirrors.","Turn your head to check your blind spot: a vehicle can hide there.","Change lanes only when the space is truly clear."]},hazards:{fr:["En panne ou après une collision : range-toi complètement sur l'accotement.","Allume tes feux de détresse et place le triangle de signalisation derrière le véhicule.","Reste loin de la circulation pendant que tu attends de l'aide."],en:["Broken down or after a collision: pull completely onto the shoulder.","Turn on your hazard lights and place the warning triangle behind the vehicle.","Stay well away from traffic while you wait for help."]},tram:{fr:["Derrière un tramway arrêté, arrête à au moins 2 m : les passagers montent et descendent.","Attends que les passagers aient traversé et que le tramway reparte.","Ne dépasse jamais un tramway arrêté du côté des portes."],en:["Behind a stopped streetcar, stop at least 2 m back: passengers are boarding and exiting.","Wait until passengers have crossed and the streetcar moves again.","Never pass a stopped streetcar on the door side."]},night:{fr:["La nuit, tes phares doivent éclairer la route devant toi.","Un véhicule arrive en sens inverse : passe en feux de croisement à au moins 150 m.","Ne regarde pas directement ses phares : vise le bord droit de la route."],en:["At night, your headlights must light the road ahead.","A vehicle approaches: dim to low beams at least 150 m away.","Do not look directly at its lights: aim for the right edge of the road."]},speedlimit:{fr:["Le panneau « Maximum » fixe la limite légale à partir de ce point.","Lève le pied et ajuste ta vitesse dès le panneau.","Par mauvais temps ou faible visibilité, roule encore plus lentement que la limite."],en:["The “Maximum” sign sets the legal limit from that point on.","Ease off and adjust your speed right at the sign.","In bad weather or poor visibility, drive slower than the limit."]},forbidden:{fr:["Ce panneau interdit l'accès ou la manœuvre — sans exception.","N'entre pas et ne tente pas la manœuvre : choisis un autre itinéraire.","L'interdiction s'applique même si la rue semble complètement libre."],en:["This sign prohibits entry or the manoeuvre — no exceptions.","Do not enter and do not attempt it: choose another route.","The prohibition applies even if the road looks completely empty."]},driveway:{fr:["En sortant d'une entrée privée, avance lentement jusqu'au trottoir.","Arrête et cède le passage aux piétons, puis aux véhicules sur la rue.","Engage-toi seulement quand la voie est libre des deux côtés."],en:["Leaving a private driveway, creep forward slowly to the sidewalk.","Stop and yield to pedestrians, then to traffic on the street.","Enter only when the way is clear in both directions."]},hillpark:{fr:["En descente le long d'un trottoir : tourne les roues vers le trottoir.","Si les freins lâchent, le véhicule roulera vers le trottoir et s'y bloquera au lieu de descendre la pente.","Serre toujours le frein de stationnement dans une pente."],en:["Facing downhill at a curb: turn the wheels toward the curb.","If the brakes fail, the vehicle rolls into the curb and stops instead of rolling down the hill.","Always set the parking brake on a hill."]},animal:{fr:["Un animal s'engage : freine fermement en gardant ta ligne droite.","Ne fais pas d'écart brusque : tu risquerais de perdre le contrôle ou de frapper un autre véhicule.","Repars seulement quand l'animal a complètement quitté la route."],en:["An animal steps out: brake firmly while keeping a straight line.","Never swerve suddenly: you could lose control or hit another vehicle.","Proceed only when the animal has completely left the road."]},curve:{fr:["Ralentis avant le virage, jamais dedans.","Regarde loin, vers la sortie du virage, et garde ta voie.","Réaccélère doucement une fois la route droite revenue."],en:["Slow down before the curve, never inside it.","Look far ahead, toward the exit of the curve, and stay in your lane.","Accelerate gently once the road straightens."]},scan:{fr:["Vérifie tes rétroviseurs toutes les cinq secondes environ.","Ce coup d'œil régulier te montre ce qui se prépare autour de toi.","Avant tout changement de direction, ajoute le contrôle de l'angle mort."],en:["Check your mirrors about every five seconds.","This regular scan shows you what is developing around you.","Before any change of direction, add a blind-spot check."]},belt:{fr:["La ceinture se boucle avant de démarrer, pour le conducteur et chaque passager.","Les enfants voyagent dans un siège d'enfant adapté, installé à l'arrière.","Un passager non attaché met tout le monde en danger en cas de choc."],en:["Seatbelts are buckled before moving off, for the dr sed without a full stop."},{at:0.6,fr:"3. Faute notée : arrêt incomplet.",en:"3. Fault recorded: incomplete stop."},{at:0.85,fr:"4. Il faut arrêter les roues complètement, compter une seconde, puis repartir.",en:"4. Stop the wheels completely, count one second, then go."}],script:{stop:{x:458,y:150},actors:[{k:"player",p:[[0,330,400],[0.35,330,235,0,!0],[0.5,330,195],[1,330,60]]}]}},"follow-ok":{duration:10,fr:{title:"Distance de suivi — réussi"},en:{title:"Following distance — done right"},steps:[{at:0,fr:"1. La voiture devant roule : reste derrière, sans la coller.",en:"1. The car ahead is moving: stay behind, without tailgating."},{at:0.3,fr:"2. La zone verte de 2 secondes reste entre vous deux.",en:"2. The green 2-second zone stays between you."},{at:0.6,fr:"3. Elle ralentit ? Tu ralentis aussi, à distance constante.",en:"3. It slows down? You slow down too, at a steady distance."},{at:0.85,fr:"4. Deux secondes, c'est le temps de réagir si elle freine d'un coup.",en:"4. Two seconds is the time to react if it brakes suddenly."}],script:{gap:!0,actors:[{k:"car",p:[[0,330,300],[1,330,110]]},{k:"player",p:[[0,330,400],[1,330,225]]}]}},"follow-bad":{duration:10,fr:{title:"Suivi trop près — à éviter"},en:{title:"Tailgating — avoid this"},steps:[{at:0,fr:"1. La voiture colle celle de devant : la zone verte a disparu.",en:"1. The car is glued to the one ahead: the green zone is gone."},{at:0.3,fr:"2. À cette distance, si elle freine, tu n'as aucune marge.",en:"2. At this distance, if it brakes, you have no margin."},{at:0.6,fr:"3. Faute notée : distance de suivi trop courte.",en:"3. Fault recorded: following too closely."},{at:0.85,fr:"4. Lève le pied et laisse revenir les 2 secondes.",en:"4. Ease off and let the 2 seconds come back."}],script:{actors:[{k:"car",p:[[0,330,300],[0.5,330,220],[1,330,150]]},{k:"player",p:[[0,330,400],[0.5,330,245],[1,330,172]]}]}},"cyclist-bad":{duration:10,fr:{title:"Cycliste frôlé — à éviter"},en:{title:"Cyclist passed too closely — avoid this"},steps:[{at:0,fr:"1. Le cycliste est à droite, la voiture le dépasse sans se déporter.",en:"1. The cyclist is on the right; the car passes without moving over."},{at:0.35,fr:"2. Moins d'1 m d'espace : le moindre écart du cycliste, et c'est l'accrochage.",en:"2. Under 1 m of space: the slightest wobble from the cyclist means a collision."},{at:0.6,fr:"3. Faute notée : cycliste dépassé de trop près.",en:"3. Fault recorded: cyclist passed too closely."},{at:0.85,fr:"4. Clignotant, angle mort, déport franc avec au moins 1 m.",en:"4. Signal, blind spot, a clear move over with at least 1 m."}],script:{bikeLane:!0,actors:[{k:"bike",p:[[0,375,390],[1,375,120]]},{k:"player",p:[[0,330,400],[0.3,330,340],[0.5,352,260],[1,352,90]]}]}},"pedestrian-bad":{duration:10,fr:{title:"Piéton non priorisé — à éviter"},en:{title:"Pedestrian not yielded to — avoid this"},steps:[{at:0,fr:"1. Le piéton est encore sur le passage : la voiture repart quand même.",en:"1. The pedestrian is still on the crosswalk: the car moves off anyway."},{at:0.35,fr:"2. Il n'a pas fini de traverser : il faut attendre qu'il soit sur le trottoir.",en:"2. They have not finished crossing: wait until they reach the sidewalk."},{at:0.6,fr:"3. Faute notée : piéton non priorisé.",en:"3. Fault recorded: pedestrian not yielded to."},{at:0.85,fr:"4. Arrête-toi avant le passage et laisse traverser AU COMPLET.",en:"4. Stop before the crosswalk and let them cross COMPLETELY."}],script:{crosswalk:170,actors:[{k:"ped",p:[[0.05,190,178],[1,430,178]]},{k:"player",p:[[0,330,400],[0.4,330,300,0,!0],[0.7,330,240],[1,330,90]]}]}},"emergency-bad":{duration:10,fr:{title:"Camion bloqué — à éviter"},en:{title:"Blocking the truck — avoid this"},steps:[{at:0,fr:"1. La sirène retentit derrière : la voiture reste dans sa voie, sans se ranger.",en:"1. The siren sounds behind: the car stays in its lane, without pulling over."},{at:0.35,fr:"2. Le camion reste coincé derrière, gyrophares allumés : chaque seconde compte.",en:"2. The truck stays stuck behind, lights flashing: every second counts."},{at:0.6,fr:"3. Faute notée : véhicule d'urgence non laissé passer.",en:"3. Fault recorded: emergency vehicle not let through."},{at:0.85,fr:"4. Sirène = ralentis, serre à droite, laisse passer.",en:"4. Siren = slow down, pull right, let it through."}],script:{actors:[{k:"truck",p:[[0,285,430],[1,285,190]]},{k:"player",p:[[0,285,330],[1,285,150]]}]}},"roundabout-bad":{duration:11,fr:{title:"Rond-point forcé — à éviter"},en:{title:"Forcing the roundabout — avoid this"},steps:[{at:0,fr:"1. La voiture entre vite, sans ralentir ni regarder à gauche.",en:"1. The car enters fast, without slowing down or looking left."},{at:0.3,fr:"2. Un véhicule est déjà engagé : il a la priorité, il faut céder à la ligne.",en:"2. A vehicle is already circulating: it has priority, yield at the line."},{at:0.55,fr:"3. Faute notée : entrée trop vite, sans céder le passage.",en:"3. Fault recorded: entered too fast, without yielding."},{at:0.85,fr:"4. Ralentis, regarde, entre seulement quand c'est libre.",en:"4. Slow down, look, enter only when it is clear."}],script:{ra:{cx:330,cy:210},actors:[{k:"car",p:[[0,425,210],[0.5,330,115],[1,235,210]]},{k:"player",p:[[0,330,400],[0.3,330,305],[0.6,390,220],[1,425,120]]}]}},"roundabout-exit":{duration:11,fr:{title:"Sortir du rond-point — réussi"},en:{title:"Exiting the roundabout — done right"},steps:[{at:0,fr:"1. Tu es dans le rond-point : contourne l'îlot sans t'arrêter.",en:"1. You are in the roundabout: circle the island without stopping."},{at:0.35,fr:"2. Ta sortie arrive : clignotant à droite.",en:"2. Your exit is coming: signal right."},{at:0.6,fr:"3. Sors en douceur, sans couper la voie de sortie.",en:"3. Exit smoothly, without cutting across the exit lane."},{at:0.85,fr:"4. Reprends ta route, vitesse régulière.",en:"4. Carry on, steady speed."}],script:{ra:{cx:330,cy:210},actors:[{k:"car",p:[[0,235,210],[1,330,115]]},{k:"player",p:[[0,330,400],[0.3,330,305],[0.55,410,230],[0.8,470,210],[1,560,210]]}]}},"lane-ok":{duration:10,fr:{title:"Maintien de voie — réussi"},en:{title:"Lane keeping — done right"},steps:[{at:0,fr:"1. La voiture reste au centre de sa voie, regard loin devant.",en:"1. The car stays centred in its lane, eyes far ahead."},{at:0.35,fr:"2. Une petite dérive ? Correction douce, sans braquer d'un coup.",en:"2. A small drift? A gentle correction, no sudden swerve."},{at:0.6,fr:"3. Les lignes restent de chaque côté, la trajectoire est régulière.",en:"3. The lines stay on each side, the path stays smooth."},{at:0.85,fr:"4. Voie tenue du début à la fin : critère réussi.",en:"4. Lane held from start to finish: criterion passed."}],script:{actors:[{k:"player",p:[[0,330,400],[0.3,322,300],[0.6,338,200],[1,330,90]]}]}},"lane-bad":{duration:10,fr:{title:"Sortie de voie — à éviter"},en:{title:"Leaving the lane — avoid this"},steps:[{at:0,fr:"1. La voiture dérive à droite, sans correction.",en:"1. The car drifts right, with no correction."},{at:0.35,fr:"2. Les roues quittent la chaussée : accotement, gravier, danger.",en:"2. The wheels leave the road: shoulder, gravel, danger."},{at:0.6,fr:"3. Faute notée : sortie de voie prolongée.",en:"3. Fault recorded: extended road departure."},{at:0.85,fr:"4. Regarde loin, corrige tôt et doucement.",en:"4. Look far ahead, correct early and gently."}],script:{actors:[{k:"player",p:[[0,330,400],[0.4,360,300],[0.7,410,200],[1,430,110]]}]}},"crash-avoid":{duration:10,fr:{title:"Éviter l'accrochage — réussi"},en:{title:"Avoiding the crash — done right"},steps:[{at:0,fr:"1. La voiture devant freine d'un coup : ses feux rouges s'allument.",en:"1. The car ahead brakes hard: its brake lights come on."},{at:0.3,fr:"2. Tu freines fort aussi, tout de suite — les 2 secondes te sauvent.",en:"2. You brake hard too, right away — the 2 seconds save you."},{at:0.6,fr:"3. Arrêt derrière elle, avec de la marge. Pas de contact.",en:"3. Stopped behind it, with room to spare. No contact."},{at:0.85,fr:"4. Anticiper, c'est freiner avant d'être collé.",en:"4. Anticipating means braking before you are right behind."}],script:{gap:!0,actors:[{k:"car",p:[[0,330,300],[0.35,330,215,0,!0],[1,330,215]]},{k:"player",p:[[0,330,400],[0.3,330,320,0,!0],[1,330,300]]}]}},"crash-bad":{duration:10,fr:{title:"Accrochage — à éviter"},en:{title:"Collision — avoid this"},steps:[{at:0,fr:"1. La voiture devant freine, mais tu ne freines pas : trop près, trop vite.",en:"1. The car ahead brakes, but you do not: too close, too fast."},{at:0.45,fr:"2. Plus le temps de t'arrêter : l'impact est inévitable.",en:"2. No time left to stop: the impact is unavoidable."},{at:0.7,fr:"3. Accrochage : au vrai examen, le parcours s'arrête là.",en:"3. Collision: on the real test, the drive ends here."},{at:0.9,fr:"4. Garde tes 2 secondes et lève le pied dès que ça freine devant.",en:"4. Keep your 2 seconds and ease off as soon as anything brakes ahead."}],script:{impact:{x:330,y:250,at:0.85},actors:[{k:"car",p:[[0,330,300],[0.4,330,240,0,!0],[1,330,240]]},{k:"player",p:[[0,330,400],[1,330,245]]}]}},"redlight-bad":{duration:10,fr:{title:"Feu rouge grillé — à éviter"},en:{title:"Running the red light — avoid this"},steps:[{at:0,fr:"1. Le feu est rouge depuis plusieurs secondes, bien visible sur le portique.",en:"1. The light has been red for several seconds, clearly visible on the gantry."},{at:0.35,fr:"2. La voiture ne ralentit pas et franchit la ligne au rouge.",en:"2. The car does not slow down and crosses the line on red."},{at:0.6,fr:"3. Faute grave notée : feu rouge franchi sans arrêter.",en:"3. Serious fault recorded: ran the red light."},{at:0.85,fr:"4. Rouge = arrêt obligatoire à la ligne, comme la file devant toi.",en:"4. Red means a mandatory stop at the line, like the queue ahead."}],script:{light:{x:452,y:120,g:0,y2:0},actors:[{k:"player",p:[[0,330,400],[1,330,60]]}]}},"yellow-light":{duration:11,fr:{title:"Le feu jaune"},en:{title:"The yellow light"},steps:[{at:0,fr:"1. Le feu est vert, puis passe au jaune : 5 secondes pour décider.",en:"1. The light is green, then turns yellow: 5 seconds to decide."},{at:0.3,fr:"2. Tu peux t'arrêter en sécurité : freine et arrête-toi à la ligne.",en:"2. You can stop safely: brake and stop at the line."},{at:0.55,fr:"3. Le rouge arrive : attends, roues immobiles.",en:"3. Red arrives: wait, wheels fully stopped."},{at:0.8,fr:"4. Si l'arrêt n'est plus possible en sécurité, traverse prudemment : ce n'est pas un feu grillé.",en:"4. If stopping is no longer safe, cross carefully: that is not running a red."}],script:{light:{x:452,y:120,g:0.25,y2:0.55},actors:[{k:"player",p:[[0,330,400],[0.35,330,240,0,!0],[0.7,330,225],[1,330,225]]}]}},"green-light":{duration:10,fr:{title:"Le feu vert"},en:{title:"The green light"},steps:[{at:0,fr:"1. Le feu est vert : avance, mais regarde quand même les côtés.",en:"1. The light is green: go, but still check the sides."},{at:0.3,fr:"2. La file devant redémarre : suis-la en gardant tes distances.",en:"2. The queue ahead restarts: follow it, keeping your distance."},{at:0.6,fr:"3. Ne bloque pas l'intersection : traverse sans t'arrêter dedans.",en:"3. Do not block the intersection: cross without stopping inside it."},{at:0.85,fr:"4. Vert ne veut pas dire foncer : reste prêt à freiner.",en:"4. Green does not mean rushing: stay ready to brake."}],script:{light:{x:452,y:120,g:1,y2:1},actors:[{k:"car",p:[[0,330,300],[1,330,80]]},{k:"player",p:[[0,330,400],[1,330,190]]}]}},"left-turn":{duration:11,fr:{title:"Virage à gauche"},en:{title:"Turning left"},steps:[{at:0,fr:"1. Clignotant à gauche, avance jusqu'au centre de l'intersection.",en:"1. Signal left, move up to the middle of the intersection."},{at:0.3,fr:"2. Un véhicule arrive en sens inverse : laisse-le passer, il est prioritaire.",en:"2. A vehicle is coming the other way: let it pass, it has priority."},{at:0.55,fr:"3. La voie est libre : tourne à gauche en douceur, sans couper le coin.",en:"3. The way is clear: turn left smoothly, without cutting the corner."},{at:0.85,fr:"4. Termine dans la bonne voie, à droite de la rue transversale.",en:"4. Finish in the correct lane, on the right side of the side street."}],script:{cross:250,actors:[{k:"car",c:"#33526e",p:[[0,375,40,180],[0.55,375,330,180]]},{k:"player",p:[[0,285,400],[0.35,285,300],[0.55,285,272],[0.75,240,250,90],[1,120,250,90]]}]}},"right-red":{duration:11,fr:{title:"Virage à droite au feu rouge"},en:{title:"Right turn on red"},steps:[{at:0,fr:"1. Feu rouge, mais le virage à droite est permis : arrête-toi COMPLÈTEMENT d'abord.",en:"1. Red light, but turning right is allowed: stop COMPLETELY first."},{at:0.3,fr:"2. Regarde à gauche, à droite, puis à gauche : piétons et véhicules d'abord.",en:"2. Look left, right, then left: pedestrians and vehicles first."},{at:0.55,fr:"3. C'est libre : tourne à droite en douceur, sans gêner.",en:"3. It is clear: turn right smoothly, without getting in the way."},{at:0.85,fr:"4. Sans arrêt complet, ce serait un feu rouge grillé.",en:"4. Without a full stop, it would count as running the red."}],script:{cross:250,light:{x:452,y:270,g:0,y2:0},actors:[{k:"player",p:[[0,375,400],[0.35,375,290,0,!0],[0.55,375,270],[0.75,410,250,90],[1,540,250,90]]}]}},"school-bus":{duration:12,fr:{title:"Autobus scolaire"},en:{title:"School bus"},steps:[{at:0,fr:"1. L'autobus s'arrête, feux rouges clignotants, panneau ARRÊT déployé.",en:"1. The bus stops, red lights flashing, STOP paddle out."},{at:0.28,fr:"2. Arrête-toi à au moins 20 m derrière, dans les deux sens.",en:"2. Stop at least 20 m behind, in both directions."},{at:0.5,fr:"3. Des enfants traversent : attends qu'ils soient tous sur le trottoir.",en:"3. Children are crossing: wait until they are all on the sidewalk."},{at:0.8,fr:"4. Feux éteints, panneau rentré : repars doucement.",en:"4. Lights off, paddle in: move off gently."}],script:{bus:{x:375,y:200},actors:[{k:"ped",p:[[0.1,190,210],[0.85,430,210]]},{k:"ped",p:[[0.2,200,232],[0.95,440,232]]},{k:"player",p:[[0,375,400],[0.35,375,300,0,!0],[1,375,300]]}]}},"wrong-way":{duration:11,fr:{title:"Sens inverse — à éviter"},en:{title:"Wrong way — avoid this"},steps:[{at:0,fr:"1. La voiture dérive à gauche de la double ligne jaune : elle est en sens inverse.",en:"1. The car drifts left of the double yellow line: it is going the wrong way."},{at:0.3,fr:"2. Un véhicule arrive en face, phares allumés : danger frontal.",en:"2. A vehicle is coming head-on, headlights on: head-on danger."},{at:0.55,fr:"3. Reviens à droite tout de suite, doucement, sans freiner brusquement.",en:"3. Get back right immediately, gently, without braking hard."},{at:0.85,fr:"4. La double ligne jaune ne se franchit jamais : reste de ton côté.",en:"4. The double yellow line is never crossed: stay on your side."}],script:{line:"double",actors:[{k:"car",c:"#33526e",p:[[0,292,60,180],[1,292,330,180]]},{k:"player",p:[[0,330,400],[0.3,300,300],[0.45,272,240],[0.7,330,200],[1,330,90]]}]}},"overtake-ok":{duration:11,fr:{title:"Dépassement permis — réussi"},en:{title:"Passing where allowed — done right"},steps:[{at:0,fr:"1. Ligne centrale pointillée : le dépassement est permis ici.",en:"1. Dashed centre line: passing is allowed here."},{at:0.28,fr:"2. Clignotant, rétroviseur, angle mort : personne à gauche.",en:"2. Signal, mirror, blind spot: nobody on the left."},{at:0.5,fr:"3. Dépasse franchement, sans traîner à côté.",en:"3. Pass decisively, without lingering alongside."},{at:0.8,fr:"4. Reviens à droite quand tu vois la voiture dans ton rétroviseur.",en:"4. Move back right once you see the car in your mirror."}],script:{line:"dashed",actors:[{k:"car",p:[[0,375,320],[1,375,140]]},{k:"player",p:[[0,375,400],[0.3,375,340],[0.5,285,280],[0.75,285,160],[1,375,90]]}]}},"overtake-bad":{duration:11,fr:{title:"Dépassement interdit — à éviter"},en:{title:"Passing where banned — avoid this"},steps:[{at:0,fr:"1. Double ligne jaune continue : le dépassement est INTERDIT ici.",en:"1. Solid double yellow line: passing is FORBIDDEN here."},{at:0.3,fr:"2. La voiture dépasse quand même, à l'aveugle, face au sens inverse.",en:"2. The car passes anyway, blindly, facing oncoming traffic."},{at:0.6,fr:"3. Infraction grave : la ligne ne se franchit pas, même si la voie semble libre.",en:"3. Serious offence: the line is never crossed, even if the way looks clear."},{at:0.85,fr:"4. Attends la zone pointillée pour dépasser.",en:"4. Wait for the dashed zone to pass."}],script:{line:"double",actors:[{k:"car",p:[[0,375,320],[1,375,140]]},{k:"player",p:[[0,375,400],[0.3,375,340],[0.5,285,280],[0.75,285,160],[1,375,90]]}]}},"blindspot-left":{duration:11,fr:{title:"Angle mort à gauche"},en:{title:"Left blind spot"},steps:[{at:0,fr:"1. Tu veux aller à gauche : d'abord le rétroviseur, puis un coup d'œil à gauche.",en:"1. You want to move left: mirror first, then a glance left."},{at:0.3,fr:"2. Une voiture est dans ton angle mort : invisible dans le rétroviseur, bien là à côté.",en:"2. A car is in your blind spot: invisible in the mirror, right there beside you."},{at:0.55,fr:"3. Attends qu'elle passe : ne change pas de voie tant qu'elle est là.",en:"3. Wait for it to pass: do not change lanes while it is there."},{at:0.8,fr:"4. Angle mort libre : clignotant, puis changement de voie en douceur.",en:"4. Blind spot clear: signal, then change lanes smoothly."}],script:{actors:[{k:"car",c:"#33526e",p:[[0,285,330],[1,285,150]]},{k:"player",p:[[0,375,400],[0.4,375,300],[0.7,285,220],[1,285,100]]}]}},"blindspot-right":{duration:11,fr:{title:"Angle mort à droite"},en:{title:"Right blind spot"},steps:[{at:0,fr:"1. Tu veux aller à droite : rétroviseur, puis coup d'œil à droite.",en:"1. You want to move right: mirror, then a glance right."},{at:0.3,fr:"2. Une voiture est dans ton angle mort droit : attends.",en:"2. A car is in your right blind spot: wait."},{at:0.55,fr:"3. Elle te dépasse et s'éloigne : l'angle mort se libère.",en:"3. It passes you and pulls away: the blind spot clears."},{at:0.8,fr:"4. Clignotant, puis changement de voie en douceur.",en:"4. Signal, then change lanes smoothly."}],script:{actors:[{k:"car",c:"#33526e",p:[[0,375,340],[1,375,160]]},{k:"player",p:[[0,285,400],[0.4,285,300],[0.7,375,220],[1,375,100]]}]}},"mirror-check":{duration:10,fr:{title:"Le rétroviseur"},en:{title:"The rearview mirror"},steps:[{at:0,fr:"1. Avant de ralentir ou de tourner, un coup d'œil au rétroviseur.",en:"1. Before slowing down or turning, a glance in the mirror."},{at:0.3,fr:"2. Une voiture te suit de près : freine progressivement, ne pile pas.",en:"2. A car is close behind you: brake progressively, do not slam on."},{at:0.6,fr:"3. Elle garde sa distance : tu peux manœuvrer sereinement.",en:"3. It keeps its distance: you can manoeuvre calmly."},{at:0.85,fr:"4. Rétroviseur, clignotant, angle mort : l'ordre à ne jamais oublier.",en:"4. Mirror, signal, blind spot: the order never to forget."}],script:{mirrorCar:!0,actors:[{k:"player",p:[[0,330,400],[0.35,330,320,0,!0],[1,330,150]]}]}},"lane-change":{duration:11,fr:{title:"Changement de voie — réussi"},en:{title:"Changing lanes — done right"},steps:[{at:0,fr:"1. Rétroviseur : la voie de gauche est libre derrière.",en:"1. Mirror: the left lane is clear behind."},{at:0.28,fr:"2. Clignotant à gauche, coup d'œil à l'angle mort.",en:"2. Signal left, glance at the blind spot."},{at:0.5,fr:"3. Déplacement doux, sans couper la route à personne.",en:"3. A smooth move, without cutting anyone off."},{at:0.8,fr:"4. Clignotant éteint, vitesse régulière, voie tenue.",en:"4. Signal off, steady speed, lane held."}],script:{actors:[{k:"car",c:"#33526e",p:[[0,285,420],[1,285,300]]},{k:"player",p:[[0,375,400],[0.35,375,300],[0.6,285,240],[1,285,110]]}]}},uturn:{duration:11,fr:{title:"Le demi-tour"},en:{title:"The U-turn"},steps:[{at:0,fr:"1. Demi-tour permis ici : clignotant à gauche, arrête-toi et vérifie.",en:"1. U-turn allowed here: signal left, stop and check."},{at:0.3,fr:"2. Aucun véhicule en face ni derrière : engage le demi-tour lentement.",en:"2. No vehicle ahead or behind: st hicule en panne sur la voie, rond-point à négocier en cédant le passage et véhicule d'urgence à laisser passer. Ta manette ACEGAMER est détectée automatiquement — stick gauche pour diriger, gâchettes R2/L2 analogiques pour accélérer et freiner. Le mode guidé t'annonce chaque situation à l'avance avec ce qu'il faut faire, et le limiteur de vitesse (activé par défaut) t'empêche de dépasser la limite de la zone.",evalTab:"Parcours d'évaluation",freeTab:"Conduite libre",padConnected:"Manette connectée",padNone:"Aucune manette détectée — branche-la et appuie sur un bouton",helpTitle:"Comment connecter ta manette ACEGAMER",helpSteps:["Option 1 — Câble : branche le câble USB-C sur le dessus de la manette et l'autre bout sur ton portable Windows.","Option 2 — Récepteur USB : branche le petit récepteur USB (dans la boîte) sur ton portable, puis allume la manette.","Option 3 — Bluetooth : sur Windows, ouvre Paramètres → Bluetooth et appareils → Ajouter un appareil, puis appaire la manette.","Ouvre cette page dans Chrome ou Edge, puis appuie sur un bouton de la manette : le navigateur la détecte et le bandeau devient vert."],mappingTitle:"Les commandes",mapping:["Direction : stick gauche (analogique) ou croix directionnelle","Accélérer : gâchette R2 analogique — appui doux = accélération douce, comme une vraie pédale ; le bouton ✕ accélère aussi progressivement, jamais d'un coup","Freiner : gâchette L2 analogique ou bouton ○ (progressif aussi)","Clignotants : touches Q / E ou boutons du tableau de bord","Regarder à GAUCHE (angle mort) : L1 maintenu — clavier : J","Regarder à DROITE (angle mort) : R1 maintenu — clavier : L","Regarder DERRIÈRE (rétroviseur) : △ maintenu — clavier : K","Rétroviseur permanent : en haut de l'écran, il reflète la circulation derrière toi"],testTitle:"Teste ta manette en direct",steerLabel:"Direction",gasLabel:"Accélérateur (R2)",brakeLabel:"Frein (L2)",start:"Commencer l'évaluation",startFree:"Commencer la conduite libre",restart:"Refaire le parcour e, mais seulement avec des conditions strictes, parce que tu es encore en apprentissage.","La condition la plus importante : tu dois toujours être accompagné d'un conducteur pleinement qualifié (permis G depuis au moins 4 ans) assis sur le siège avant, prêt à prendre le relais. Sans accompagnateur, tu n'as pas le droit de conduire du tout."],bodyEn:["G1 is the first step of Ontario's graduated licensing system. You earn it by passing the knowledge test (the one you are preparing here) and an eye test. It lets you drive, but only under strict conditions, because you are still learning.","The most important condition: you must always be accompanied by a fully licensed driver (a G licence held for at least 4 years) sitting in the front seat, ready to take over. Without that accompanying driver, you may not drive at all."],points:["Accompagnateur obligatoire : permis G depuis 4 ans ou plus, sur le siège avant","Taux d'alcool dans le sang : zéro, en tout temps","Interdit sur les autoroutes de la série 400 et les voies rapides, sauf avec un moniteur agréé","Toutes les ceintures doivent être bouclées, pour tous les passagers"],pointsEn:["Accompanying driver required: G licence for 4+ years, in the front seat","Blood alcohol level: zero, at all times","No driving on 400-series highways or high-speed expressways, except with a licensed instructor","Every seat belt must be fastened, for every passenger"]},{h:"Avant de partir : la routine du conducteur",hEn:"Before leaving: the driver's routine",body:["Avant même de démarrer, le Guide recommande une routine simple : règle ton siège pour atteindre les pédales confortablement, règle les rétroviseurs (intérieur, puis extérieurs), boucle ta ceinture, et assure-toi que tes passagers font de même. Un conducteur G1 est responsable de ses passagers de moins de 16 ans.","Une fois en route, tiens le volant à « 9 h et 3 h » — une main de chaque côté, à hauteur du milieu. C'est la position qui donne le meilleur contrôle et qui protège en cas de déploiement du coussin gonflable. Et jette un coup d'œil aux rétroviseurs toutes les cinq secondes environ : savoir ce qui se passe derrière fait partie de la conduite."],bodyEn:["Before even starting, the Handbook recommends a simple routine: adjust your seat so you reach the pedals comfortably, adjust the mirrors (inside first, then outside), fasten your seat belt, and make sure your passengers do the same. A G1 driver is responsible for passengers under 16.","Once moving, hold the wheel at “9 and 3” — one hand on each side, at mid-height. That position gives the best control and protects you if the airbag deploys. And check your mirrors about every five seconds: knowing what is happening behind you is part of driving."],points:["Siège, rétroviseurs, ceinture — dans cet ordre, avant de démarrer","Mains à 9 h et 3 h sur le volant","Rétroviseurs vérifiés toutes les cinq secondes environ","Le conducteur répond des passagers de moins de 16 ans"],pointsEn:["Seat, mirrors, seat belt — in that order, before starting","Hands at 9 and 3 on the steering wheel","Mirrors checked about every five seconds","The driver is responsible for passengers under 16"]},{h:"Ton permis n'est pas un jouet",hEn:"Your licence is not a toy",body:["Le permis de conduire est un document officiel qui t'appartient à toi seul. Le prêter à quelqu'un d'autre est une infraction, même « juste pour quelques minutes ». De la même façon, tu ne dois jamais utiliser le permis d'une autre personne comme s'il était le tien.","Retiens aussi que conduire est un privilège qui peut être suspendu : accumulation de points d'inaptitude, alcool, ou conduite dangereuse peuvent te le retirer. Le chapitre 7 revient sur les risques en détail."],bodyEn:["A driver's licence is an official document that belongs to you alone. Lending it to someone else is an offence, even “just for a few minutes”. Likewise, you must never use someone else's licence as if it were yours.","Remember too that driving is a privilege that can be suspended: demerit points, alcohol, or dangerous driving can take it away. Chapter 7 covers the risks in detail."],points:["Ne prête jamais ton permis, n'utilise jamais celui d'un autre","Le permis peut être suspendu : points, alcool, conduite dangereuse"],pointsEn:["Never lend your licence, never use someone else's","A licence can be suspended: points, alcohol, dangerous driving"]}]},{id:"panneaux",title:"Lire les panneaux",titleEn:"Reading road signs",desc:"Formes, couleurs et familles de panneaux : reconnaître un panneau avant même de le lire.",descEn:"Shapes, colours and sign families: recognize a sign before you can even read it.",minutes:5,mode:"panneaux",questionPrefixes:["p"],sections:[{h:"La forme parle avant les mots",hEn:"The shape speaks before the words",body:["En Ontario, chaque famille de panneaux a une forme qui ne change jamais. Même de loin, même sous la neige ou dans le brouillard, la forme te dit déjà quoi faire. C'est pour ça que l'examen insiste autant sur les panneaux : sur la route, tu n'auras pas le temps de lire, tu devras reconnaître.","L'octogone (8 côtés) ne sert qu'à une chose : l'arrêt complet obligatoire. Le triangle inversé (pointe en bas) signifie « cédez le passage ». Le losange (diamant jaune) annonce un avertissement : un danger ou un changement devant. Le rectangle donne des règlements ou des informations, selon sa couleur."],bodyEn:["In Ontario, every sign family has a shape that never changes. Even from far away, even in snow or fog, the shape already tells you what to do. That is why the test leans so hard on signs: on the road you will not have time to read, you will have to recognize.","The octagon (8 sides) means one thing only: a mandatory full stop. The upside-down triangle means “yield”. The diamond (yellow) is a warning: a hazard or a change ahead. Rectangles carry regulations or information, depending on their colour."],points:["Octogone rouge = arrêt complet, toujours","Triangle inversé = cédez le passage","Losange jaune = avertissement, danger devant","Croix en X = passage à niveau (train)"],pointsEn:["Red octagon = full stop, always","Upside-down triangle = yield the right of way","Yellow diamond = warning, hazard ahead","X crossbuck = railway crossing"]},{h:"Les couleurs ont un sens",hEn:"Colours carry meaning",body:["Le rouge annonce une interdiction ou un arrêt : arrêt, sens interdit, interdiction de tourner. Le vert guide : directions, distances, sorties d'autoroute. Le bleu indique des services (essence, hôpital, hébergement). L'orange signale une zone de travaux — là, ralentis toujours, des travailleurs sont près de la route.","Les panneaux de limite de vitesse sont des rectangles blancs avec le mot « MAXIMUM » et un nombre noir. C'est un maximum, pas une cible : si la route est glissante ou la visibilité mauvaise, la bonne vitesse est plus basse que le nombre affiché (le chapitre 3 y revient)."],bodyEn:["Red means a prohibition or a stop: stop, do not enter, no turns. Green guides: directions, distances, highway exits. Blue points to services (fuel, hospital, lodging). Orange means a work zone — always slow down there, workers are close to the road.","Speed limit signs are white rectangles with the word “MAXIMUM” and a black number. It is a maximum, not a target: if the road is slippery or visibility is poor, the right speed is lower than the posted number (Chapter 3 comes back to this)."],points:["Rouge = interdiction ou arrêt","Vert = directions et distances","Bleu = services","Orange = travaux, ralentir","« MAXIMUM » = une limite, jamais un objectif"],pointsEn:["Red = prohibition or stop","Green = directions and distances","Blue = services","Orange = road work, slow down","“MAXIMUM” = a limit, never a target"]},{h:"Les panneaux que les candidats ratent",hEn:"The signs candidates miss",body:["Trois panneaux reviennent souvent dans les erreurs. Le panneau de zone scolaire (pentagone — forme de maison — avec des enfants) annonce une zone où la limite tombe souvent à 40 km/h et où il faut s'attendre à des enfants qui traversent sans regarder. Le panneau « voie réservée » (losange blanc sur le panneau) réserve la voie aux autobus, taxis ou véhicules avec plusieurs passagers selon les heures indiquées. Et le panneau de fin de voie ou de rétrécissement demande de se rabattre tôt, pas au dernier moment.","Dernier réflexe : un panneau que tu ne comprends pas n'est jamais une raison d'ignorer la prudence. Ralentis, observe, et laisse passer les autres en cas de doute."],bodyEn:["Three signs show up often in mistakes. The school zone sign (a pentagon — house-shaped — with children) marks a zone where the limit often drops to 40 km/h and where children may cross without looking. The “reserved lane” sign (a white diamond on the sign) reserves the lane for buses, taxis or multi-passenger vehicles during the posted hours. And lane-ends or narrowing signs ask you to merge early, not at the last moment.","Last reflex: a sign you do not understand is never a reason to drop your guard. Slow down, look, and let others go first when in doubt."],points:["Pentagone = zone scolaire, enfants possibles, souvent 40 km/h","Losange blanc sur panneau = voie réservée","En cas de doute : ralentir et laisser passer"],pointsEn:["Pentagon = school zone, children possible, often 40 km/h","White diamond on a sign = reserved lane","When in doubt: slow down and let others go"]}]},{id:"vitesse",title:"Vitesse et distances",titleEn:"Speed and distances",desc:"Les limites par défaut, la règle des deux secondes et pourquoi la distance d'arrêt explose avec la vitesse.",descEn:"Default limits, the two-second rule, and why stopping distance explodes with speed.",minutes:5,mode:"regles",questionPrefixes:["r01","r02","r13","r42","r49","r55"],sections:[{h:"Quand il n'y a pas de panneau",hEn:"When there is no sign",body:["Toutes les routes n'ont pas de panneau de vitesse. Le Guide donne alors des limites par défaut à connaître par cœur : 50 km/h en agglomération (là où il y a des bâtiments, en ville ou en village) et 80 km/h hors agglomération. Dès qu'un panneau « MAXIMUM » est affiché, c'est lui qui s'applique.","Ces nombres sont des maximums pour des conditions parfaites. Pluie, neige, brouillard ou noirceur exigent de rouler en dessous — parfois beaucoup en dessous. L'examen appelle ça la « vitesse sécuritaire » : celle qui te permet de t'arrêter à temps pour ce que tu vois devant toi."],bodyEn:["Not every road has a speed sign. The Handbook then gives default limits to know by heart: 50 km/h in a built-up area (where there are buildings, in a town or city) and 80 km/h outside one. As soon as a “MAXIMUM” sign is posted, that number applies.","These numbers are maximums for perfect conditions. Rain, snow, fog or darkness require driving below them — sometimes well below. The test calls this the “safe speed”: the one that lets you stop in time for what you can see ahead."],points:["Sans panneau : 50 km/h en agglomération, 80 km/h ailleurs","La limite affichée remplace toujours la limite par défaut","Mauvaises conditions = vitesse plus basse que la limite"],pointsEn:["No sign: 50 km/h in built-up areas, 80 km/h elsewhere","A posted limit always replaces the default","Bad conditions = speed below the limit"]},{h:"La règle des deux secondes",hEn:"The two-second rule",body:["Suivre de trop près est une des causes d'accident les plus fréquentes — et une des fautes que l'examen surveille. La méthode du Guide : choisis un point fixe au bord de la route (un poteau, un panneau). Quand le véhicule devant le passe, compte « mille et un, mille et deux ». Si tu passes le même point avant la fin du compte, tu es trop près : recule.","Par mauvais temps ou derrière un gros véhicule qui cache la vue, passe à trois ou quatre secondes. Un camion devant toi cache les panneaux, les piétons et les freinages des autres : la distance, c'est ta visibilité."],bodyEn:["Following too closely is one of the most common causes of collisions — and one of the faults the test watches for. The Handbook's method: pick a fixed point at the roadside (a pole, a sign). When the vehicle ahead passes it, count “one thousand one, one thousand two”. If you pass the same point before finishing, you are too close: back off.","In bad weather, or behind a large vehicle blocking your view, use three or four seconds. A truck ahead hides signs, pedestrians and other drivers' braking: distance is your visibility."],points:["Deux secondes minimum derrière le véhicule devant","Trois à quatre secondes par mauvais temps","Trop près = pas le temps de réagir"],pointsEn:["At least two seconds behind the vehicle ahead","Three to four seconds in bad weather","Too close = no time to react"]},{h:"La distance d'arrêt grandit vite",hEn:"Stopping distance grows fast",body:["Ton arrêt total, c'est la distance de réaction (ce que tu parcours pendant que ton cerveau décide et que ton pied bouge — environ une seconde) plus la distance de freinage. La partie freinage grandit avec le carré de la vitesse : à 80 km/h, elle est environ quatre fois plus longue qu'à 40 km/h. Doubler la vitesse ne double pas l'arrêt, il le multiplie.","C'est pour ça que les zones scolaires sont à 40 et que les excès de vitesse coûtent si cher en points : à haute vitesse, l'erreur ne pardonne plus, ni pour toi ni pour les autres."],bodyEn:["Your total stop is the reaction distance (what you cover while your brain decides and your foot moves — about one second) plus the braking distance. The braking part grows with the square of speed: at 80 km/h it is roughly four times longer than at 40 km/h. Doubling speed does not double the stop, it multiplies it.","That is why school zones are 40 and speeding costs so many points: at high speed, a mistake no longer forgives — for you or for anyone else."],points:["Arrêt total = réaction + freinage","À 80 km/h, le freinage est ~4× celui de 40 km/h","Plus tu vas vite, plus l'erreur coûte cher"],pointsEn:["Total stop = reaction + braking","At 80 km/h, braking is ~4× that at 40 km/h","The faster you go, the more a mistake costs"]}]},{id:"priorites",title:"Priorités et intersections",titleEn:"Right of way and intersections",desc:"Qui passe en premier : arrêts, céder le passage, piétons, autobus scolaires et véhicules d'urgence.",descEn:"Who goes first: stops, yielding, pedestrians, school buses and emergency vehicles.",minutes:6,mode:"regles",questionPrefixes:["r08","r09","r10","r11","r12","r23","r27","r28","r29","r41","r43","r44","r45","r52"],sections:[{h:"Céder le passage, ça veut dire quoi ?",hEn:"What does yielding actually mean?",body:["La priorité n'est jamais un droit qu'on prend : c'est quelque chose que les autres te donnent. « Céder le passage » signifie ralentir, et arrêter au besoin, pour laisser passer les véhicules et les piétons qui sont déjà engagés ou qui ont la priorité. Si tu forces les autres à freiner ou à changer de direction à cause de toi, tu n'as pas cédé.","Aux intersections sans feux ni panneaux, le premier arrivé repart en premier. Si deux véhicules arrivent en même temps, celui de gauche cède à celui de droite. Et dans tous les cas, les piétons qui traversent ont la priorité sur les voitures qui tournent."],bodyEn:["Right of way is never a right you take: it is something others give you. “Yielding” means slowing down, and stopping if needed, to let vehicles and pedestrians who are already there, or who have priority, go through. If you force others to brake or swerve because of you, you did not yield.","At intersections with no lights or signs, the first to arrive goes first. If two vehicles arrive at the same time, the one on the left yields to the one on the right. And in all cases, pedestrians crossing have priority over turning cars."],points:["La priorité se reçoit, elle ne se prend pas","Intersection sans contrôle : premier arrivé, premier parti","Arrivée en même temps : la gauche cède à la droite","Les piétons ont priorité sur les véhicules qui tournent"],pointsEn:["Right of way is given, never taken","Uncontrolled intersection: first to arrive, first to go","Arriving together: the left yields to the right","Pedestrians have priority over turning vehicles"]},{h:"L'arrêt complet, sans exception",hEn:"The full stop, no exceptions",body:["Au panneau ARRÊT, l'arrêt doit être complet — les roues immobiles — à la ligne d'arrêt, ou juste avant le passage pour piétons s'il y en a un. « Ralentir très fort » n'est pas un arrêt, et c'est exactement l'erreur que les examinateurs et l'examen théorique traquent. Après l'arrêt seulement, tu regardes des deux côtés et tu avances quand c'est libre.","Le même réflexe vaut pour les passages à niveau et les autobus scolaires : quand les feux rouges de l'autobus clignotent et que son panneau d'arrêt est sorti, tu arrêtes à au moins 20 mètres, dans les deux sens (sauf si une bande médiane sépare les directions), et tu attends que les feux s'éteignent."],bodyEn:["At a STOP sign, the stop must be complete — wheels fully still — at the stop line, or just before the crosswalk if there is one. “Slowing down a lot” is not a stop, and it is exactly the mistake examiners and the knowledge test hunt for. Only after stopping do you look both ways and proceed when clear.","The same reflex applies at railway crossings and school buses: when the bus's red lights flash and its stop sign is out, stop at least 20 metres away, in both directions (unless a median divides the road), and wait until the lights go off."],points:["Arrêt = roues complètement immobiles, à la ligne d'arrêt","Autobus scolaire, feux rouges clignotants : arrêt à 20 m, deux sens","Après l'arrêt : regarder des deux côtés avant d'avancer"],pointsEn:["A stop = wheels completely still, at the stop line","School bus with flashing red lights: stop 20 m away, both directions","After stopping: look both ways before proceeding"]},{h:"Véhicules d'urgence : dégage la voie",hEn:"Emergency vehicles: clear the way",body:["Sirène et gyrophares derrière toi ? Le Guide est clair : range-toi à droite le plus près possible du bord, arrête-toi, et reste arrêté jusqu'à ce que le véhicule d'urgence soit passé. Ne bloque jamais une intersection : si tu es dedans, traverse-la puis range-toi. Suivre un véhicule d'urgence de près est aussi interdit — garde au moins 150 mètres.","Même logique pour un véhicule immobilisé au bord de la route avec gyrophares (police, dépanneuse, véhicule du ministère) : ralentis et, si c'est possible, change de voie pour lui laisser l'espace d'une voie complète."],bodyEn:["Siren and flashing lights behind you? The Handbook is clear: pull over to the right as close to the edge as possible, stop, and stay stopped until the emergency vehicle has passed. Never block an intersection: if you are in one, clear it, then pull over. Following an emergency vehicle closely is also forbidden — keep at least 150 metres.","Same logic for a stopped vehicle at the roadside with flashing lights (police, tow truck, ministry vehicle): slow down and, if possible, change lanes to give it a full lane of space."],points:["Urgence derrière toi : à droite, arrêt complet, attendre","Ne jamais bloquer une intersection","Au moins 150 m derrière un véhicule d'urgence en mouvement","Véhicule arrêté avec gyrophares : ralentir et changer de voie si possible"],pointsEn:["Emergency behind you: pull right, stop fully, wait","Never block an intersection","At least 150 m behind a moving emergency vehicle","Stopped vehicle with flashing lights: slow down and move over if possible"]},{h:"Entrées privées et stationnement",hEn:"Driveways and parking",body:["En sortant d'une entrée privée, d'une ruelle ou d'un stationnement, c'est toi qui rejoins la route : tu dois donc t'arrêter et céder le passage à tout ce qui s'y trouve déjà — voitures, cyclistes et piétons sur le trottoir. Le trottoir se traverse comme un passage piétonnier : lentement, après avoir regardé des deux côtés.","Et à l'inverse, quand tu tournes dans une entrée, surveille les piétons qui continuent tout droit sur le trottoir : eux ne changent pas de direction, toi oui."],bodyEn:["When leaving a driveway, alley or parking lot, you are the one joining the road: you must stop and yield to everything already on it — cars, cyclists, and pedestrians on the sidewalk. Cross the sidewalk like a crosswalk: slowly, after looking both ways.","Conversely, when you turn into a driveway, watch for pedestrians walking straight along the sidewalk: they are not changing direction, you are."],points:["Sortie d'entrée privée : arrêt, puis céder à tous","Le trottoir se traverse lentement, piétons prioritaires"],pointsEn:["Leaving a driveway: stop, then yield to everyone","Cross sidewalks slowly, pedestrians have priority"]}]},{id:"depassements",title:"Dépassements et changements de voie",titleEn:"Passing and lane changes",desc:"La méthode en quatre temps, l'angle mort, dépasser et être dépassé sans danger.",descEn:"The four-step method, the blind spot, passing and being passed safely.",minutes:5,mode:"regles",questionPrefixes:["r15","r22","r34","r35","r36","r53","r56"],sections:[{h:"Changer de voie : la méthode",hEn:"Changing lanes: the method",body:["Chaque changement de voie suit la même méthode, dans le même ordre : rétroviseurs, clignotant, angle mort, manœuvre. D'abord regarder les rétroviseurs pour voir la circulation, puis signaler ton intention, puis tourner la tête pour vérifier l'angle mort — cette zone à côté et derrière que les rétroviseurs ne montrent jamais — et seulement ensuite bouger, doucement.","L'angle mort est la cause cachée de beaucoup d'accidents de changement de voie : une moto ou une petite voiture peut y être entièrement invisible dans les rétroviseurs. Le coup d'œil par-dessus l'épaule n'est pas optionnel, c'est lui qui rend la manœuvre sûre."],bodyEn:["Every lane change follows the same method, in the same order: mirrors, signal, blind spot, move. First check the mirrors to see the traffic, then signal your intention, then turn your head to check the blind spot — the area beside and behind you that mirrors never show — and only then move, smoothly.","The blind spot is the hidden cause of many lane-change collisions: a motorcycle or small car can be completely invisible in the mirrors there. The shoulder check is not optional; it is what makes the manoeuvre safe."],points:["Rétroviseurs → clignotant → angle mort → manœuvre","Le coup d'œil par-dessus l'épaule est obligatoire","Signaler avant de bouger, jamais en même temps"],pointsEn:["Mirrors → signal → blind spot → move","The shoulder check is mandatory","Signal before moving, never at the same time"]},{h:"Dépasser, et être dépassé",hEn:"Passing, and being passed",body:["On dépasse par la gauche, sur une route où la visibilité est bonne et la manœuvre permise : jamais dans une intersection, près d'un passage à niveau, sur une pente ou dans un virage où tu ne vois pas assez loin, ni quand la ligne est continue de ton côté. Avant de revenir dans ta voie, assure-toi de voir le véhicule dépassé en entier dans ton rétroviseur intérieur : c'est le signe que l'espace est suffisant.","Et quand c'est toi qu'on dépasse ? Reste à droite, garde ta vitesse stable et n'accélère surtout pas. Accélérer pendant qu'on te dépasse transforme une manœuvre normale en situation dangereuse, et l'examen le considère comme une faute claire."],bodyEn:["Pass on the left, on a road where visibility is good and the manoeuvre is allowed: never in an intersection, near a railway crossing, on a hill or in a curve where you cannot see far enough, nor where the line is solid on your side. Before returning to your lane, make sure you can see the whole passed vehicle in your inside mirror: that is the sign the space is sufficient.","And when you are the one being passed? Stay right, keep your speed steady, and above all do not speed up. Accelerating while being passed turns a normal manoeuvre into a dangerous one, and the test treats it as a clear fault."],points:["Dépasser par la gauche, seulement avec une bonne visibilité","Interdit : intersections, passages à niveau, pentes, virages, ligne continue","Revenir quand le véhicule dépassé est visible au complet dans le rétroviseur","Être dépassé : rester à droite, ne pas accélérer"],pointsEn:["Pass on the left, only with good visibility","Forbidden: intersections, railway crossings, hills, curves, solid line","Return when the passed vehicle is fully visible in your mirror","Being passed: stay right, do not speed up"]},{h:"Cyclistes, motos et camions",hEn:"Cyclists, motorcycles and trucks",body:["Les cyclistes ont droit à leur place sur la route. En les dépassant, la loi ontarienne exige de laisser au moins un mètre d'espace latéral — si tu ne peux pas laisser un mètre, attends. Un coup de vent, un nid-de-poule, et le cycliste bouge de côté : le mètre, c'est sa marge de survie.","Les camions, eux, ont d'énormes angles morts sur les côtés et derrière (la « zone interdite ») : si tu ne vois pas les rétroviseurs du camionneur, il ne te voit pas. Ils ont aussi besoin de beaucoup d'espace pour tourner à droite — ne te glisse jamais entre un camion qui tourne et le trottoir."],bodyEn:["Cyclists have a right to their place on the road. When passing them, Ontario law requires at least one metre of side space — if you cannot leave a metre, wait. A gust of wind, a pothole, and the cyclist moves sideways: the metre is their margin of survival.","Trucks have huge blind spots on the sides and behind (the “no-zone”): if you cannot see the truck driver's mirrors, they cannot see you. They also need a lot of room to turn right — never squeeze between a turning truck and the curb."],points:["Cycliste : au moins 1 m d'espace pour dépasser, sinon attendre","Camion : si tu ne vois pas ses rétroviseurs, il ne te voit pas","Ne jamais se glisser à droite d'un camion qui tourne"],pointsEn:["Cyclist: at least 1 m of space to pass, otherwise wait","Truck: if you can't see its mirrors, it can't see you","Never squeeze right of a turning truck"]},{h:"Le demi-tour : rarement une bonne idée",hEn:"The U-turn: rarely a good idea",body:["Le demi-tour est interdit là où tu ne peux pas être vu à au moins 150 mètres dans les deux directions : dans un virage, sur une pente, près d'un passage à niveau, d'un pont ou d'un tunnel. Même là où il est permis, il reste risqué, parce que les autres conducteurs ne s'y attendent pas.","L'alternative sûre : continue jusqu'à une intersection large, ou fais le tour du pâté de maisons. Quelques secondes de plus valent mieux qu'une manœuvre que personne n'a vue venir."],bodyEn:["U-turns are forbidden where you cannot be seen from at least 150 metres in both directions: in a curve, on a hill, near a railway crossing, a bridge or a tunnel. Even where allowed, they stay risky, because other drivers do not expect them.","The safe alternative: continue to a wide intersection, or drive around the block. A few extra seconds beat a manoeuvre nobody saw coming."],points:["Demi-tour interdit sans 150 m de visibilité des deux côtés","Interdit : virages, pentes, passages à niveau, ponts, tunnels","Alternative : intersection large ou tour du pâté de maisons"],pointsEn:["U-turn forbidden without 150 m of visibility both ways","Forbidden: curves, hills, railway crossings, bridges, tunnels","Alternative: a wide intersection or around the block"]}]},{id:"rond-point",title:"Le rond-point (carrefour giratoire)",titleEn:"The roundabout",desc:"Entrer, circuler et sortir d'un rond-point ontarien — aussi pratiqué dans le simulateur.",descEn:"Entering, circulating and exiting an Ontario roundabout — also practised in the simulator.",minutes:4,mode:"regles",questionPrefixes:["r48"],sections:[{h:"Le principe : céder en entrant",hEn:"The principle: yield on entry",body:["Un rond-point n'est pas un arrêt à quatre coins : c'est une circulation qui tourne en sens antihoraire, et ceux qui sont déjà dedans ont la priorité. En approchant, tu ralentis, tu regardes à gauche, et tu entres seulement quand l'espace est libre. Si un véhicule circule vers toi dans le rond-point, tu attends à la ligne de céder le passage — c'est exactement ce que le simulateur de conduite de cette plateforme t'entraîne à faire.","À l'intérieur, ne t'arrête pas : la circulation doit rester fluide. Si tu manques ta sortie, continue simplement ton tour et sors au passage suivant."],bodyEn:["A roundabout is not a four-way stop: traffic circulates counter-clockwise, and those already inside have priority. Approaching, you slow down, look left, and enter only when the gap is clear. If a vehicle is circulating toward you inside, you wait at the yield line — exactly what this platform's driving simulator trains you to do.","Inside, do not stop: traffic must keep flowing. If you miss your exit, simply continue around and take it on the next pass."],points:["Circulation en sens antihoraire","Ceux qui sont dedans ont la priorité","Entrer seulement quand l'espace est libre","Ne jamais s'arrêter dans le rond-point"],pointsEn:["Traffic circulates counter-clockwise","Those inside have priority","Enter only when the gap is clear","Never stop inside the roundabout"]},{h:"Clignotants et piétons",hEn:"Signals and pedestrians",body:["Pour sortir, mets ton clignotant droit juste après avoir passé la sortie qui précède la tienne : c'est le signal que les autres attendent pour entrer. Si tu tournes à gauche dans le rond-point (troisième sortie), le clignotant gauche à l'entrée aide les autres à comprendre ton trajet, puis le droit avant ta sortie.","Les passages pour piétons sont placés juste avant l'entrée et juste après la sortie. En sortant, ton attention est sur la circulation à gauche — c'est là que les piétons se font surprendre. Ralentis en sortant et vérifie le passage avant de le traverser."],bodyEn:["To exit, use your right signal just after passing the exit before yours: that is the signal others are waiting for to enter. If you are turning left in the roundabout (third exit), a left signal on entry helps others understand your path, then right before your exit.","Crosswalks sit just before the entry and just after the exit. When exiting, your attention is on traffic to the left — that is where pedestrians get surprised. Slow down on exit and check the crosswalk before crossing it."],points:["Clignotant droit avant ta sortie","Piétons : passages à l'entrée ET à la sortie","Sortie manquée : refaire le tour, jamais reculer"],pointsEn:["Right signal before your exit","Pedestrians: crosswalks at the entry AND the exit","Missed exit: go around again, never reverse"]}]},{id:"risques",title:"Alertes et risques",titleEn:"Hazards and risks",desc:"Nuit, pluie, dérapage, fatigue, distractions, alcool : ce qui transforme un trajet ordinaire en accident.",descEn:"Night, rain, skids, fatigue, distractions, alcohol: what turns an ordinary trip into a collision.",minutes:6,mode:"regles",questionPrefixes:["r18","r19","r25","r26","r32","r33","r40","r47","r50","r54"],sections:[{h:"Conduire la nuit",hEn:"Driving at night",body:["La nuit, tes phares sont ta seule fenêtre. Les feux de route (les « hautes ») éclairent loin, mais tu dois passer aux feux de croisement dès qu'un véhicule vient en sens inverse à moins de 150 mètres, ou quand tu suis quelqu'un à moins de 60 mètres : éblouir l'autre conducteur, c'est créer le danger que tu voulais éviter.","La règle d'or de nuit : ne roule jamais plus vite que ce que tes phares te montrent. Si tu ne peux pas t'arrêter dans la zone éclairée devant toi, tu roules trop vite pour tes yeux, même sous la limite."],bodyEn:["At night, your headlights are your only window. High beams light up far ahead, but you must switch to low beams when an oncoming vehicle is within 150 metres, or when following someone within 60 metres: dazzling the other driver creates the very danger you wanted to avoid.","The golden rule at night: never drive faster than your headlights show you. If you cannot stop within the lit area ahead of you, you are driving too fast for your eyes, even under the limit."],points:["Feux de croisement : véhicule en face à moins de 150 m","Feux de croisement : suivi à moins de 60 m","Jamais plus vite que la portée de tes phares"],pointsEn:["Low beams: oncoming vehicle within 150 m","Low beams: following within 60 m","Never faster than your headlights reach"]},{h:"Pluie, dérapage et aquaplanage",hEn:"Rain, skids and hydroplaning",body:["Si l'arrière de la voiture part de côté (dérapage), le réflexe qui sauve : lève le pied de l'accélérateur et dirige le volant dans la direction où tu veux aller — là où tu regardes, pas vers l'obstacle. Freiner fort en plein dérapage aggrave presque toujours la perte de contrôle.","Sous la pluie forte, à vitesse élevée, les pneus peuvent « flotter » sur l'eau : c'est l'aquaplanage, et tu perds alors direction et freinage d'un coup. La prévention est simple : ralentir quand l'eau s'accumule, et garder des pneus en bon état avec une bonne profondeur de rainures."],bodyEn:["If the rear of the car slides sideways (a skid), the reflex that saves you: ease off the accelerator and steer in the direction you want to go — where you are looking, not toward the obstacle. Braking hard mid-skid almost always makes the loss of control worse.","In heavy rain at high speed, tires can “float” on the water: that is hydroplaning, and you lose steering and braking at once. Prevention is simple: slow down when water pools, and keep tires in good condition with deep tread."],points:["Dérapage : pied levé, volant vers où tu veux aller","Ne pas freiner fort en plein dérapage","Aquaplanage : ralentir dès que l'eau s'accumule"],pointsEn:["Skid: foot off, steer where you want to go","Do not brake hard mid-skid","Hydroplaning: slow down when water pools"]},{h:"Fatigue et distractions",hEn:"Fatigue and distractions",body:["Un conducteur fatigué réagit aussi lentement qu'un conducteur qui a bu. Les signes : bâillements, paupières lourdes, difficulté à garder ta voie ou ta vitesse. La seule vraie solution est de s'arrêter dans un endroit sûr et de dormir — le café et la fenêtre ouverte ne font que retarder le problème de quelques minutes.","Pour les distractions, la règle ontarienne est nette : un appareil tenu en main (téléphone, textos, vidéos) est interdit en conduisant, même arrêté à un feu rouge. Le G1 ne change rien à cette règle. Le téléphone attend l'arrivée — ou un arrêt complet hors de la route."],bodyEn:["A tired driver reacts as slowly as a driver who has been drinking. The signs: yawning, heavy eyelids, trouble keeping your lane or your speed. The only real solution is to stop somewhere safe and sleep — coffee and an open window only delay the problem by a few minutes.","For distractions, Ontario's rule is clear: a hand-held device (phone, texting, videos) is forbidden while driving, even stopped at a red light. G1 changes nothing about this rule. The phone waits until you arrive — or until a full stop off the road."],points:["Fatigue = réactions d'un conducteur ivre","Seule solution : s'arrêter et dormir","Téléphone en main : interdit, même au feu rouge"],pointsEn:["Fatigue = the reactions of a drunk driver","Only solution: stop and sleep","Hand-held phone: forbidden, even at a red light"]},{h:"Alcool, drogues et points d'inaptitude",hEn:"Alcohol, drugs and demerit points",body:["Pour un conducteur G1, c'est tolérance zéro : ton taux d'alcool doit être de 0,00, point. L'alcool et le cannabis ralentissent les réflexes, rétrécissent l'attention et donnent une fausse confiance — le trio exact des accidents graves chez les jeunes conducteurs. La sanction peut tomber dès le premier contrôle : suspension immédiate et retour aux étapes du permis.","Le système de points d'inaptitude compte tes infractions : excès de vitesse, suivre de trop près, ne pas céder… Chaque infraction ajoute des points qui restent deux ans à ton dossier. Pour un nouveau conducteur, les conséquences arrivent vite : lettre d'avertissement, entrevue obligatoire, puis suspension de 60 jours si les points continuent de monter."],bodyEn:["For a G1 driver it is zero tolerance: your blood alcohol must be 0.00, full stop. Alcohol and cannabis slow reflexes, narrow attention and give false confidence — the exact trio behind serious collisions for young drivers. Sanctions can land at the very first stop: immediate suspension and a return to earlier licensing steps.","The demerit point system counts your offences: speeding, following too closely, failing to yield… Each offence adds points that stay on your record for two years. For a new driver the consequences come fast: a warning letter, a mandatory interview, then a 60-day suspension if points keep climbing."],points:["G1 : alcool 0,00, sans aucune exception","Les points restent 2 ans au dossier","Nouveau conducteur : avertissement → entrevue → suspension de 60 jours"],pointsEn:["G1: alcohol 0.00, no exceptions at all","Points stay on your record for 2 years","New driver: warning → interview → 60-day suspension"]}]},{id:"jour-test",title:"Le jour du test",titleEn:"Test day",desc:"Le format exact du vrai examen, ce qu'il faut apporter, et comment utiliser tout ce que tu as appris ici.",descEn:"The exact format of the real test, what to bring, and how to use everything you learned here.",minutes:3,mode:"examen",questionPrefixes:[],sections:[{h:"Le format, sans surprise",hEn:"The format, no surprises",body:["Le vrai examen théorique G1 compte 40 questions à choix multiples : 20 sur les panneaux et 20 sur les règles de la route. Les deux sections sont corrigées séparément, et il faut au moins 16 bonnes réponses sur 20 dans CHAQUE section. Un total de 33 ou 34 sur 40 ne suffit pas si une section est à 14 : c'est la règle qui fait échouer le plus de candidats, et c'est pour ça que cette plateforme note toujours les deux sections à part.","Il n'y a pas de limite de temps (la plupart des candidats finissent en 20 à 30 minutes) et le résultat est connu sur place, immédiatement. Si tu rates une seule section, tu peux la reprendre seule pour 16 $ — et un résultat réussi reste valide un an."],bodyEn:["The real G1 knowledge test has 40 multiple-choice questions: 20 on signs and 20 on rules of the road. The two sections are marked separately, and you need at least 16 out of 20 in EACH section. A total of 33 or 34 out of 40 is not enough if one section is at 14: it is the rule that fails the most candidates, and it is why this platform always scores the two sections separately.","There is no time limit (most candidates finish in 20 to 30 minutes) and the result is known on site, immediately. If you fail only one section, you can retake that section alone for $16 — and a passed result stays valid for one year."],points:["40 questions : 20 panneaux + 20 règles, corrigées séparément","Réussite : 16/20 dans CHAQUE section","Aucune limite de temps, résultat immédiat","Reprise d'une section seule : 16 $"],pointsEn:["40 questions: 20 signs + 20 rules, marked separately","Pass: 16/20 in EACH section","No time limit, immediate result","Retaking one section only: $16"]},{h:"Ce qu'il faut apporter, et la stratégie",hEn:"What to bring, and the strategy",body:["L'examen se passe dans un Centre Test au Volant, sans rendez-vous : arrive au moins une heure avant la fermeture, avec une pièce d'identité acceptée et de quoi payer le forfait (environ 159,75 $). Tu passeras aussi un examen de la vue sur place.","Stratégie de réponse : lis chaque question au complet avant de regarder les choix, élimine les réponses absurdes, et méfie-toi des mots absolus (« toujours », « jamais ») qui rendent souvent un choix faux. Si une question te bloque, choisis ta meilleure réponse et continue : tu as tout ton temps pour y revenir. Et surtout, réponds à partir de ce que tu as appris dans le Guide et ici — pas à partir de ce que « tout le monde fait » sur la route."],bodyEn:["The test is taken at a DriveTest Centre, no appointment: arrive at least one hour before closing, with accepted identification and payment for the package (about $159.75). You will also take an eye test on site.","Answering strategy: read each question fully before looking at the choices, eliminate absurd answers, and beware of absolute words (“always”, “never”) that often make a choice false. If a question blocks you, pick your best answer and move on: you have all your time to come back to it. And above all, answer from what you learned in the Handbook and here — not from what “everybody does” on the road."],points:["Centre Test au Volant, sans rendez-vous, 1 h avant la fermeture","Pièce d'identité acceptée + forfait d'environ 159,75 $","Lire la question au complet, éliminer l'absurde","Mots absolus (« toujours », « jamais ») : souvent faux"],pointsEn:["DriveTest Centre, no appointment, 1 hour before closing","Accepted ID + package of about $159.75","Read the whole question, eliminate the absurd","Absolute words (“always”, “never”): often false"]}]}];function zr(e){let t=null,a=0;for(let r of oa)for(let s of r.questionPrefixes)if(e.startsWith(s)&&s.length>a)t=r,a=s.length;return t}var Wv={bases:qa,panneaux:Ka,vitesse:an,priorites:mo,depassements:en,"rond-point":tn,risques:Yo,"jour-test":Tr},DS={fr:{title:"Théorie — apprendre avant de répondre",subtitle:"Tu ne peux pas deviner ce que tu n'as jamais appris. Lis les chapitres dans l'ordre : chacun explique la règle, donne les chiffres à retenir, puis t'envoie t'entraîner dessus. Tout vient du Guide officiel de l'automobiliste (MTO).",chapter:"Chapitre",minutes:"min de lecture",read:"Lu",toRead:"À lire",readAll:"chapitres lus",keyPoints:"À retenir",doneTitle:"Chapitre terminé",doneBody:"La règle est fraîche dans ta tête : c'est le meilleur moment pour la transformer en réflexe avec des questions.",trainNow:"M'entraîner sur ce chapitre",nextChapter:"Chapitre suivant",backToChapters:"Tous les chapitres",home:"Accueil",markRead:"Marquer comme lu",restartHint:"Conseil : commence par la théorie, puis enchaîne avec l'entraînement du chapitre. Les
