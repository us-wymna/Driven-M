attend avec la feuille d'évaluation. Il va noter chaque manœuvre, comme au vrai test."},{title:"« On prend un véhicule »",body:"« Je vais vous indiquer les directions, virage par virage, et je note votre conduite en direct. Conduisez comme si j'étais à côté de vous. Si vous faites une faute, je vous l'explique tout de suite — pas seulement à la fin. »"},{title:"Monte dans le véhicule",body:"Les panneaux sont grands et annoncés à l'avance. Le feu rouge, le rond-point et la file d'attente se voient de loin. En cas de doute, regarde la démo avant de conduire la situation."}],reportSigned:"Rapport signé par l'examinateur",reportExaminerNote:"Chaque faute a été expliquée sur le moment. Refais les démos des manœuvres ratées, puis recommence le parcours.",pausedLabel:"Pause — la conduite est arrêtée",freeEmergencyOk:"Bien réagi : tu t'es rangé à droite pour le camion de pompiers.",freeEmergencyBad:"Le camion a dû te contourner : la prochaine fois, serre à droite dès la sirène.",mirrorLabel:"Rétroviseur",lookLeftBadge:"TU REGARDES À GAUCHE",lookRightBadge:"TU REGARDES À DROITE",lookRearBadge:"TU REGARDES DERRIÈRE",lookFreeNote:"Angle mort libre — tu peux changer de voie en sécurité.",lookBusyNote:"VÉHICULE DANS L'ANGLE MORT — ne change pas de voie !",promptOncoming:"Sens inverse ! Un véhicule arrive en face — reviens vite à droite, ne franchis pas la double ligne jaune.",promptFallerWarn:"Piéton au bord de la route devant — attention, il pourrait tomber ! Lève le pied et couvre le frein.",promptFallerFall:"PIÉTON QUI TOMBE — FREINE FORT, TOUT DE SUITE !",promptFallerSaved:"Bon freinage d'urgence : tu t'es arrêté avant le piéton. Attends qu'il se relève.",redLightLabel:"FEU ROUGE",yellowLightLabel:"FEU JAUNE",lightLeft:(e)=>`encore ${e} s`,gDirection:(e)=>`Panneau de direction dans ${e} m : suis la voie de ta destination.`,gOncoming:(e)=>`Véhicule en sens inverse dans ${e} m, phares allumés : reste bien à droite.`,gFaller:(e)=>`Piéton au bord de la route dans ${e} m : il marche près de la chaussée, lève le pied et couvre le frein.`,directionLabel:"Panneau de direction",blindChecksLabel:"Vérifications d'angle mort avant changement de voie",blindCount:(e)=>`${e} vérification${e>1?"s":""} avant de changer de voie`,fallerSavedLabel:"Piéton tombé : évité par un freinage d'urgence",fallerHitLabel:"Piéton tombé : renversé",fallerNoneLabel:"Piéton tombé : scénario non rencontré",wheelLabel:"Volant",lookTouchLeft:"◀ Regard",lookTouchRight:"Regard ▶",lookTouchRear:"Regard arrière"},en:{title:"Driving simulator",subtitle:"A full assessed drive, scored like a DriveTest examiner would: changing speed limits, a 40 school zone, a complete stop at the STOP sign, a cyclist to pass with a metre of space, a pedestrian crossing, a red light with a queue, a broken-down vehicle in the lane, a roundabout to negotiate by yielding and an emergency vehicle to let through. Your ACEGAMER gamepad is detected automatically — left stick to steer, analogue R2/L2 triggers to accelerate and brake. Guided mode announces every situation in advance with what to do, and the speed limiter (on by default) keeps you from exceeding the zone limit.",evalTab:"Assessed drive",freeTab:"Free drive",padConnected:"Gamepad connected",padNone:"No gamepad detected — plug it in and press a button",helpTitle:"How to connect your ACEGAMER gamepad",helpSteps:["Option 1 — Cable: plug the USB-C cable into the top of the gamepad and the other end into your Windows laptop.","Option 2 — USB receiver: plug the small USB receiver (from the box) into your laptop, then switch the gamepad on.","Option 3 — Bluetooth: in Windows, open Settings → Bluetooth & devices → Add device, then pair the gamepad.","Open this page in Chrome or Edge, then press any button on the gamepad: the browser detects it and the banner turns green."],mappingTitle:"Controls",mapping:["Steering: left stick (analogue) or D-pad","Accelerate: analogue R2 trigger — a soft press means a gentle start, like a real pedal; the ✕ button also builds power progressively, never all at once","Brake: analogue L2 trigger or ○ button (progressive too)","Indicators: Q / E keys or dashboard buttons","Look LEFT (blind spot): hold L1 — keyboard: J","Look RIGHT (blind spot): hold R1 — keyboard: L","Look BEHIND (mirror): hold △ — keyboard: K","Permanent rear-view mirror: at the top of the screen, it reflects traffic behind you"],testTitle:"Test your gamepad live",steerLabel:"Steering",gasLabel:"Accelerator (R2)",brakeLabel:"Brake (L2)",start:"Start the assessed drive",startFree:"Start free driving",restart:"Redo the drive",stop:"End",pause:"Pause",resume:"Resume",speed:"km/h",limit:"Limit",distance:"Distance",best:"Free best",faultsLabel:"Faults",promptGo:"Clear road — watch for limit signs.",promptStopAhead:(e)=>`STOP sign in ${e} m — prepare a full stop at the line.`,promptStopNow:"Stop completely at the stop line.",promptStopDone:"Full stop completed. Proceed when the way is clear.",promptFollow:"Slow vehicle ahead — keep at least a 2-second gap.",promptSlow:"Too fast for the limit — slow down.",promptSchool:"School zone — limit 40, flashing beacon: children possible, slow down.",promptPed:"Pedestrian crossing ahead — yield to them, stop if needed.",promptCyclist:"Cyclist ahead — pass only with at least 1 m of space, otherwise wait behind.",promptObstacle:"Obstacle in the lane — signal, check your blind spot and change lanes safely.",promptRoundAhead:"Roundabout ahead — slow down, you will have to yield on entry.",promptRoundYield:"Roundabout: a vehicle is already circulating — yield to it at the line.",promptRoundIn:"In the roundabout: go around the central island, do not stop, exit smoothly.",promptCrash:"Crash. The drive ends here, just like the real test.",promptLightYellow:"Yellow light ahead — prepare to stop, do not rush through.",promptLightRed:"RED LIGHT — stop at the line. The queue ahead stopped for the same reason.",promptLightGo:"Green light — move off when the queue restarts, keeping your distance.",promptQueue:"Queue stopped at the red light — stay behind, keep 2 seconds. Never pass on the left.",promptEmergencyWarn:"EMERGENCY VEHICLE behind you — siren! Slow down and pull over to the RIGHT.",promptEmergencyAct:"Fire truck behind — pull to the right and slow down or stop to let it through.",promptEmergencyOk:"Well done: you pulled right and the truck passed. Carry on.",guided:"Guided mode",guidedHint:"Every situation is announced in advance, with what to do — theory put into practice.",limiter:"Speed limiter",limiterHint:"The car will not exceed the zone limit, even with the accelerator fully pressed.",guideLabel:"Guide — coming up",gHighway:(e)=>`Highway in ${e} m: the limit rises to 80. Accelerate gently with the trigger, stay in your lane and keep a good following gap.`,gLimitDown:(e)=>`The limit drops back to 50 in ${e} m: ease off and slow down smoothly, without braking hard.`,gLimit50:(e)=>`End of the school zone in ${e} m: the limit returns to 50. Stay alert until the sign.`,gSchool:(e)=>`School zone in ${e} m: limit 40 with a flashing beacon. Slow down at the sign and cover the brake — children may cross.`,gCyclist:(e)=>`Cyclist in ${e} m, on the right. To pass: signal left, check your blind spot, move over leaving at least 1 m of space. No room? Wait behind them.`,gDebris:(e)=>`Obstacle in the left lane in ${e} m. Signal right, check your blind spot and change lanes smoothly to go around it.`,gPed:(e)=>`Crosswalk in ${e} m: a pedestrian is about to cross. Slow down and be ready to stop — they have the right of way, let them cross completely.`,gStop:(e)=>`STOP sign in ${e} m: ease off, brake progressively and stop completely at the stop line, wheels fully stopped, before proceeding.`,gParked:(e)=>`Broken-down vehicle in ${e} m, on the right, hazard lights on. Signal left, check your blind spot and move into the left lane to pass it widely.`,gRoundFar:(e)=>`Roundabout in ${e} m: slow down now. On entry you must yield to vehicles already circulating.`,gRoundYield:"Roundabout: at the yield line, watch the traffic already circulating — it has the right of way. Enter only when it is clear, then go around the island without stopping inside.",gRoundIn:"In the roundabout: circle the central island without touching it, keep a slow steady speed, then exit smoothly.",gFollow:"Slow vehicle ahead: keep at least a 2-second gap. Do not tailgate — follow at a steady distance.",gLight:(e)=>`Traffic light in ${e} m: it will turn yellow, then red. Prepare to stop at the line, behind the queue — do not pass.`,gLightRed:"Red light: stop at the line and wait for green. The queue ahead is waiting for the same thing.",gQueue:"The queue is stopped at the red light ahead: stay behind the vehicle, 2 seconds back. Above all, do not pass it.",gEmergency:(e)=>`Fire truck approaching in ${e} m, behind you, siren on. Slow down, pull to the right and let it through.`,gFinish:(e)=>`Finish in ${e} m: keep driving smoothly and cleanly to the end of the course.`,reportTitle:"Assessment report",verdictPass:"Drive passed",verdictFail:"Drive to work on",scoreLabel:"Score",timeLabel:"Time",criteria:{speed:"Speed limits obeyed",stop:"Complete stop at the STOP sign",follow:"Safe following distance",cyclist:"Cyclist passed with at least 1 m of space",pedestrian:"Pedestrian given the crosswalk",roundabout:"Roundabout: slow entry, yielded, island circled",lane:"Lane keeping (no road departure)",crash:"No collision",redlight:"Red light obeyed (stop at the line)",emergency:"Emergency vehicle: pulled over to the right"},faultNames:{speed:"Speeding",stop:"Incomplete stop / rolled through",follow:"Following too closely",lane:"Extended road departure",crash:"Collision",cyclist:"Cyclist passed too closely (under 1 m)",pedestrian:"Failed to yield to a pedestrian at the crosswalk",roundabout:"Roundabout: entered too fast or without yielding",redlight:"Ran the red light",emergency:"Did not let the emergency vehicle through"},faultAdvice:{speed:"Ease off as soon a
