when the way is clear","Slow down and keep going without stopping if nothing is coming","Yield only to pedestrians","Stop only if another vehicle is approaching"],answer:0,expl:"L'octogone rouge signifie un arrêt complet obligatoire à la ligne d'arrêt, même si l'intersection semble libre.",explEn:"The red octagon means a complete stop is mandatory at the stop line, even if the intersection looks clear."},{id:"p02",section:"panneaux",sign:"cedez",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Vous devez céder le passage aux véhicules et piétons déjà engagés","Vous avez la priorité de passage","Arrêt complet obligatoire","Sens interdit"],optionsEn:["You must yield to vehicles and pedestrians already in the intersection","You have the right of way","A complete stop is mandatory","Do not enter"],answer:0,expl:"Le triangle inversé est le panneau « Cédez le passage » : ralentissez, arrêtez au besoin, et laissez passer les autres.",explEn:"The upside-down triangle is the yield sign: slow down, stop if needed, and let others go first."},{id:"p03",section:"panneaux",sign:"sens-interdit",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Sens interdit : n'entrez pas dans cette rue","Stationnement interdit","Rue sans issue","Arrêt interdit"],optionsEn:["Do not enter this road","No parking","Dead end","No stopping"],answer:0,expl:"Le cercle rouge avec une barre blanche horizontale indique un sens interdit : il est défendu d'entrer.",explEn:"The red circle with a white horizontal bar means do not enter."},{id:"p04",section:"panneaux",sign:"vitesse-50",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Vitesse maximale permise : 50 km/h","Vitesse minimale obligatoire : 50 km/h","Vitesse conseillée : 50 km/h","50 mètres avant un arrêt"],optionsEn:["Maximum speed allowed: 50 km/h","Minimum speed required: 50 km/h","Advised speed: 50 km/h","50 metres before a stop"],answer:0,expl:"« Maximum 50 » est la limite de vitesse légale à partir de ce point, sauf si les conditions exigent de rouler plus lentement.",explEn:"'Maximum 50' is the legal speed limit from this point on, unless conditions require driving slower."},{id:"p05",section:"panneaux",sign:"vitesse-40-ecole",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Vitesse maximale de 40 km/h dans une zone scolaire, aux heures indiquées","Vitesse maximale de 40 km/h en tout temps","Zone de jeux, vitesse libre","Fin de la zone scolaire"],optionsEn:["Maximum 40 km/h in a school zone during the posted hours","Maximum 40 km/h at all times","Playground zone, any speed","End of the school zone"],answer:0,expl:"En zone scolaire, la limite est réduite (souvent 40 km/h) pendant les heures affichées ou lorsque les feux clignotent. Redoublez de vigilance.",explEn:"In a school zone the limit is reduced (often 40 km/h) during the posted hours or when lights flash. Be extra alert."},{id:"p06",section:"panneaux",sign:"interdit-gauche",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Virage à gauche interdit","Virage à gauche obligatoire","Demi-tour interdit","Voie de gauche fermée"],optionsEn:["No left turn","Left turn mandatory","No U-turn","Left lane closed"],answer:0,expl:"Le cercle rouge barré sur la flèche vers la gauche interdit le virage à gauche à cette intersection.",explEn:"The red circle and slash over the left arrow prohibits turning left at this intersection."},{id:"p07",section:"panneaux",sign:"interdit-droite",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Virage à droite interdit","Virage à droite obligatoire","Gardez la droite","Route qui tourne à droite"],optionsEn:["No right turn","Right turn mandatory","Keep right","Road curves right"],answer:0,expl:"La flèche vers la droite barrée d'un cercle rouge signifie que le virage à droite est interdit, même au feu rouge.",explEn:"The right arrow with a red slash means no right turn, even on a red light."},{id:"p08",section:"panneaux",sign:"interdit-demi-tour",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Demi-tour interdit","Virage à gauche interdit","Circulation dans les deux sens","Route sinueuse"],optionsEn:["No U-turn","No left turn","Two-way traffic","Winding road"],answer:0,expl:"La flèche en U barrée interdit le demi-tour à cet endroit.",explEn:"The U-shaped arrow with a slash prohibits making a U-turn here."},{id:"p09",section:"panneaux",sign:"stationnement-interdit",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Stationnement interdit","Arrêt interdit en tout temps","Stationnement payant","Zone de chargement seulement"],optionsEn:["No parking","No stopping at any time","Paid parking","Loading zone only"],answer:0,expl:"Le « P » barré interdit le stationnement. Un arrêt très bref pour prendre ou déposer un passager peut rester permis, contrairement au panneau d'arrêt interdit.",explEn:"The slashed 'P' prohibits parking. A very brief stop to pick up or drop off a passenger may still be allowed, unlike a no-stopping sign."},{id:"p10",section:"panneaux",sign:"arret-interdit",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Arrêt interdit : vous ne pouvez pas immobiliser votre véhicule ici","Stationnement interdit, mais arrêt permis","Arrêt d'autobus","Fin de la zone d'arrêt"],optionsEn:["No stopping: you may not halt your vehicle here at all","No parking, but stopping is allowed","Bus stop","End of the no-stopping zone"],answer:0,expl:"« Arrêt interdit » est plus strict que « stationnement interdit » : même un arrêt momentané est défendu.",explEn:"'No stopping' is stricter than 'no parking': even a momentary stop is prohibited."},{id:"p11",section:"panneaux",sign:"sens-unique",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Circulation à sens unique dans la direction de la flèche","Dépassement permis","Voie réservée aux autobus","Continuez tout droit obligatoirement"],optionsEn:["One-way traffic in the direction of the arrow","Passing allowed","Bus-only lane","You must go straight"],answer:0,expl:"La flèche indique le seul sens de circulation permis dans cette rue.",explEn:"The arrow shows the only direction of travel allowed on this road."},{id:"p12",section:"panneaux",sign:"virage-droite",q:"Que vous annonce ce panneau jaune en losange ?",qEn:"What does this yellow diamond sign warn you about?",options:["Un virage à droite devant vous","Virage à droite obligatoire","Une intersection en T","Une voie qui fusionne à droite"],optionsEn:["A curve to the right ahead","You must turn right","A T-intersection","A lane merging from the right"],answer:0,expl:"Les panneaux jaunes en losange sont des avertissements : ici, la route tourne à droite. Ralentissez avant le virage.",explEn:"Yellow diamond signs are warnings: here, the road curves right. Slow down before the curve."},{id:"p13",section:"panneaux",sign:"virage-gauche",q:"Que vous annonce ce panneau ?",qEn:"What does this sign warn you about?",options:["Un virage à gauche devant vous","Virage à gauche interdit","Une intersection proche","Une déviation à gauche"],optionsEn:["A curve to the left ahead","No left turn","An intersection ahead","A detour to the left"],answer:0,expl:"C'est un avertissement de virage à gauche : réduisez votre vitesse avant d'entrer dans le virage.",explEn:"This warns of a curve to the left: reduce your speed before entering the curve."},{id:"p14",section:"panneaux",sign:"route-sinueuse",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Route sinueuse devant : série de virages","Chaussée glissante","Route en mauvais état seulement","Dépassement interdit"],optionsEn:["Winding road ahead: a series of curves","Slippery road","Rough road only","No passing"],answer:0,expl:"La flèche en S annonce une route sinueuse. Ralentissez et restez bien dans votre voie.",explEn:"The S-shaped arrow warns of a winding road. Slow down and stay in your lane."},{id:"p15",section:"panneaux",sign:"fusion",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Des véhicules provenant d'une autre route s'insèrent dans votre voie","Votre voie se termine immédiatement","Circulation dans les deux sens","Une autoroute commence"],optionsEn:["Traffic from another road is merging into your lane","Your lane ends immediately","Two-way traffic","A freeway begins"],answer:0,expl:"Ce panneau avertit d'une fusion : préparez-vous à ajuster votre vitesse ou à changer de voie pour laisser entrer les véhicules.",explEn:"This sign warns of merging traffic: be ready to adjust your speed or change lanes to let vehicles in."},{id:"p16",section:"panneaux",sign:"chaussee-glissante",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Chaussée glissante lorsqu'elle est mouillée","Zone de verglas permanent","Route inondée","Gravier sur la route"],optionsEn:["Slippery when wet","Permanent ice zone","Flooded road","Gravel on the road"],answer:0,expl:"La voiture qui dérape annonce une chaussée glissante quand elle est mouillée : ralentissez et évitez les gestes brusques.",explEn:"The skidding car warns the pavement is slippery when wet: slow down and avoid sudden movements."},{id:"p17",section:"panneaux",sign:"passage-pietons",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Passage pour piétons devant : soyez prêt à céder le passage","Zone piétonne interdite aux piétons","Arrêt d'autobus scolaire","Sentier récréatif"],optionsEn:["Pedestrian crossing ahead: be ready to yield","Pedestrian zone, no pedestrians allowed","School bus stop","Recreational trail"],answer:0,expl:"Ce losange jaune annonce un passage pour piétons. Les piétons qui y sont engagés ont la priorité.",explEn:"This yellow diamond warns of a pedestrian crossing. Pedestrians in the crossing have the right of way."},{id:"p18",section:"panneaux",sign:"passage-ecoliers",q:"Que signifie ce panneau en forme de pentagone ?",qEn:"What does this pentagon-shaped sign mean?",options:["Passage d'écoliers : zone où des enfants traversent","Arrêt d'autobus","Zone de jeux","École fermée"],optionsEn:["School crossing: an area where children cross","Bus stop","Playground zone","School closed"],answer:0,expl:"Le pentagone jaune-vert fluorescent signale un passage d'écoliers. Obéissez au brigadier scolaire et arrêtez lorsqu'il lève son panneau.",explEn:"The fluorescent yellow-green pentagon marks a school crossing. Obey the crossing guard and stop when they raise their sign."},{id:"p19",section:"panneaux",sign:"passage-niveau",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Un passage à niveau (voie ferrée) devant vous","Une intersection en X","Route fermée","Un échangeur autoroutier"],optionsEn:["A railway crossing ahead","An X-shaped intersection","Road closed","A freeway interchange"],answer:0,expl:"Le X annonce un passage à niveau. Ralentissez, regardez des deux côtés et ne vous arrêtez jamais sur les rails.",explEn:"The X warns of a railway crossing. Slow down, look both ways, and never stop on the tracks."},{id:"p20",section:"panneaux",sign:"feux-devant",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Des feux de circulation devant vous","Un poste de contrôle routier","Un tunnel éclairé","Feux de secours en service"],optionsEn:["Traffic lights ahead","A roadside inspection station","A lit tunnel","Emergency lights in use"],answer:0,expl:"Ce panneau avertit de la présence de feux de circulation devant, parfois cachés par une courbe ou une côte. Soyez prêt à arrêter.",explEn:"This sign warns of traffic lights ahead, sometimes hidden by a curve or hill. Be ready to stop."},{id:"p21",section:"panneaux",sign:"arret-devant",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Un panneau d'arrêt se trouve devant vous","Arrêtez-vous immédiatement ici","Zone d'arrêt d'autobus","Fin de la route"],optionsEn:["A stop sign is ahead","Stop immediately right here","Bus stop zone","End of the road"],answer:0,expl:"Le petit octogone rouge dans un losange jaune vous avertit qu'un panneau d'arrêt arrive. Préparez-vous à arrêter.",explEn:"The small red octagon inside a yellow diamond warns that a stop sign is ahead. Be ready to stop."},{id:"p22",section:"panneaux",sign:"construction",q:"Que signifie ce panneau orange ?",qEn:"What does this orange sign mean?",options:["Travaux de construction devant : ralentissez et suivez les indications","Zone de stationnement pour travailleurs","Route réservée aux camions","Dépôt de matériaux"],optionsEn:["Construction work ahead: slow down and follow directions","Workers' parking zone","Trucks-only road","Materials depot"],answer:0,expl:"L'orange signale les conditions temporaires et les travaux. Réduisez votre vitesse; les amendes sont doublées en zone de travaux lorsque des travailleurs sont présents.",explEn:"Orange marks temporary conditions and road work. Slow down; fines are doubled in work zones when workers are present."},{id:"p23",section:"panneaux",sign:"detour",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Détour : suivez l'itinéraire de remplacement indiqué par la flèche","Route fermée définitivement","Sens unique","Retour interdit"],optionsEn:["Detour: follow the alternate route shown by the arrow","Road permanently closed","One way","No turning back"],answer:0,expl:"Le panneau orange « Détour » vous dirige vers un itinéraire temporaire pendant des travaux ou une fermeture.",explEn:"The orange 'Detour' sign directs you onto a temporary route during road work or a closure."},{id:"p24",section:"panneaux",sign:"voie-termine",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["La voie se termine : vous devrez fusionner dans la voie voisine","La route devient à sens unique","Une voie se rajoute","Voie réservée devant"],optionsEn:["The lane ends: you will have to merge into the next lane","The road becomes one-way","A lane is being added","Reserved lane ahead"],answer:0,expl:"Ce panneau annonce la fin d'une voie. Vérifiez votre angle mort et insérez-vous prudemment dans la voie qui continue.",explEn:"This sign warns that a lane is ending. Check your blind spot and merge carefully into the continuing lane."},{id:"p25",section:"panneaux",sign:"circulation-deux-sens",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Circulation dans les deux sens devant : restez dans votre voie","Dépassement permis dans les deux sens","Deux voies dans le même sens","Fin de la route divisée"],optionsEn:["Two-way traffic ahead: stay in your lane","Passing allowed in both directions","Two lanes in the same direction","End of the divided road"],answer:0,expl:"Les deux flèches opposées avertissent que la circulation devient bidirectionnelle. Des véhicules peuvent venir en sens inverse dans la voie voisine.",explEn:"The two opposing arrows warn that traffic becomes two-way. Oncoming vehicles may be in the lane beside you."},{id:"p26",section:"panneaux",sign:"cerfs",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Des animaux sauvages (cerfs) peuvent traverser la route dans ce secteur","Zone de chasse","Parc animalier à proximité","Interdiction de nourrir les animaux"],optionsEn:["Wild animals (deer) may cross the road in this area","Hunting zone","Wildlife park nearby","Do not feed the animals"],answer:0,expl:"Ce panneau avertit d'une traversée fréquente d'animaux. Soyez vigilant, surtout à l'aube et au crépuscule.",explEn:"This sign warns of frequent animal crossings. Be alert, especially at dawn and dusk."},{id:"p27",section:"panneaux",sign:"camions",q:"Que vous annonce ce panneau ?",qEn:"What does this sign warn you about?",options:["Des camions peuvent entrer sur la route ou la traverser devant vous","Voie interdite aux camions","Poste de pesée pour camions","Aire de repos pour camionneurs"],optionsEn:["Trucks may enter or cross the road ahead of you","No trucks allowed","Truck weigh station","Truck rest area"],answer:0,expl:"Ce losange avertit que des camions entrent ou traversent la route, souvent près d'un chantier ou d'une carrière. Ralentissez.",explEn:"This diamond warns that trucks enter or cross the road, often near a worksite or quarry. Slow down."},{id:"p28",section:"panneaux",sign:"velos",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Des cyclistes peuvent traverser ou partager la route devant vous","Piste cyclable fermée","Stationnement de vélos","Voie interdite aux vélos"],optionsEn:["Cyclists may cross or share the road ahead","Bike path closed","Bicycle parking","No bicycles allowed"],answer:0,expl:"Ce panneau annonce une traversée ou une présence fréquente de cyclistes. Laissez au moins 1 mètre d'espace en les dépassant.",explEn:"This sign warns of a bicycle crossing or frequent cyclists. Leave at least 1 metre of space when passing them."},{id:"p29",section:"panneaux",sign:"pente",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Pente raide devant : réduisez votre vitesse et rétrogradez au besoin","Montagne à proximité","Route interdite aux camions lourds","Zone de glissement de terrain"],optionsEn:["Steep hill ahead: slow down and gear down if needed","Mountain nearby","No heavy trucks","Landslide zone"],answer:0,expl:"Ce panneau annonce une pente abrupte. En descente, utilisez le frein moteur pour éviter de surchauffer les freins.",explEn:"This sign warns of a steep grade. When descending, use engine braking to avoid overheating your brakes."},{id:"p30",section:"panneaux",sign:"pont-etroit",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Pont étroit devant : la chaussée se rétrécit","Pont-levis","Pont interdit aux camions","Pont payant"],optionsEn:["Narrow bridge ahead: the roadway narrows","Drawbridge","No trucks on the bridge","Toll bridge"],answer:0,expl:"Ce losange avertit que le pont devant vous est plus étroit que la route. Ralentissez et cédez au besoin.",explEn:"This diamond warns that the bridge ahead is narrower than the road. Slow down and yield if needed."},{id:"p31",section:"panneaux",sign:"sens-giratoire",q:"Que signifie ce panneau ?",qEn:"What does this sign mean?",options:["Carrefour giratoire devant : cédez le passage en entrant","Demi-tour obligatoire","Rond-point interdit aux camions","Circulation alternée"],optionsEn:["Roundabout ahead: yield when entering","Mandatory U-turn","No trucks in the roundabout","Alternating traffic"],answer:0,expl:"Ce panneau annonce un carrefour giratoire. En y entrant, vous devez céder le passage aux véhicules déjà dans le carrefour.",explEn:"This sign warns of a roundabout ahead. When entering, you must yield to traffic already in the roundabout."},{id:"p32",section:"panneaux",q:"Un panneau jaune en forme de losange signifie toujours :",qEn:"A yellow diamond-shaped sign always means:",options:["Un avertissement d'un danger ou d'une condition devant vous","Une obligation","Une interdiction","Une information touristique"],optionsEn:["A warning of a hazard or condition ahead","A requirement","A prohibition","Tourist information"],answer:0,expl:"Forme et couleur ont un sens : le losange jaune = avertissement. L'octogone = arrêt, le triangle inversé = cédez le passage.",explEn:"Shape and colour carry meaning: a yellow diamond = warning. An octagon = stop, an upside-down triangle = yield."},{id:"p33",section:"panneaux",q:"Un panneau en forme d'octogone (8 côtés) signifie toujours :",qEn:"An octagon-shaped (8-sided) sign always means:",options:["Arrêt","Cédez le passage","Sens interdit","Travaux"],optionsEn:["Stop","Yield","Do not enter","Road work"],answer:0,expl:"L'octogone est réservé exclusivement au panneau d'arrêt, reconnaissable même de dos ou sous la neige.",explEn:"The octagon is reserved exclusively for the stop sign, recognizable even from behind or under snow."},{id:"p34",section:"panneaux",q:"Les panneaux verts servent généralement à :",qEn:"Green signs are generally used for:",options:["Donner des directions, des distances et des informations","Interdire une manœuvre","Avertir d'un danger","Indiquer une zone de travaux"],optionsEn:["Giving directions, distances and information","Prohibiting a manoeuvre","Warning of a hazard","Marking a work zone"],answer:0,expl:"Vert = information et direction. Rouge/blanc = réglementation, jaune = avertissement, orange = travaux temporaires.",explEn:"Green = information and direction. Red/white = regulation, yellow = warning, orange = temporary work zones."},{id:"p35",section:"panneaux",q:"Que signifie une ligne jaune continue au centre de la route ?",qEn:"What does a solid yellow line at the centre of the road mean?",options:["La circulation va dans les deux sens; le dépassement est dangereux ou interdit de votre côté","La route est à sens unique","Vous pouvez dépasser librement","Une voie réservée aux autobus"],optionsEn:["Traffic flows in both directions; passing is dangerous or not allowed from your side","The road is one-way","You may pass freely","A bus-only lane"],answer:0,expl:"Le jaune sépare les sens opposés de circulation. Une ligne jaune continue de votre côté signifie de ne pas dépasser.",explEn:"Yellow separates opposing directions of traffic. A solid yellow line on your side means do not pass."},{id:"p36",section:"panneaux",q:"Que signifie une ligne blanche discontinue (pointillée) entre deux voies ?",qEn:"What does a broken white line between two lanes mean?",options:["Les voies vont dans le même sens et vous pouvez changer de voie prudemment","Il est interdit de changer de voie","La route devient à sens unique","Vous approchez d'un arrêt obligatoire"],optionsEn:["The lanes go the same direction and you may change lanes carefully","Changing lanes is prohibited","The road becomes one-way","You are approaching a mandatory stop"],answer:0,expl:"Le blanc sépare les voies allant dans le même sens. Discontinue = changement de voie permis; continue = à éviter ou interdit.",explEn:"White separates lanes going the same direction. Broken = lane changes allowed; solid = avoid or prohibited."},{id:"p37",section:"panneaux",q:"Que signifie une double ligne jaune continue au centre de la route ?",qEn:"What does a double solid yellow line at the centre of the road mean?",options:["Dépassement interdit dans les deux sens","Dépassement permis dans les deux sens","Voie de virage à gauche partagée","Route à quatre voies"],optionsEn:["No passing in either direction","Passing allowed in both directions","Shared left-turn lane","Four-lane road"],answer:0,expl:"Deux lignes jaunes continues interdisent le dépassement des deux côtés. Ne les franchissez pas.",explEn:"Double solid yellow lines prohibit passing from either side. Do not cross them."},{id:"p38",section:"panneaux",q:"Un feu rouge clignotant à une intersection signifie :",qEn:"A flashing red light at an intersection means:",options:["Arrêtez complètement, puis avancez quand la voie est libre (comme un panneau d'arrêt)","Ralentissez seulement","Le feu est en panne, passez librement","Arrêt interdit"],optionsEn:["Stop completely, then proceed when clear (treat it like a stop sign)","Slow down only","The light is broken, proceed freely","No stopping"],answer:0,expl:"Rouge clignotant = même obligation qu'un panneau d'arrêt : arrêt complet, puis on repart quand c'est sécuritaire.",explEn:"A flashing red light carries the same obligation as a stop sign: stop fully, then go when it is safe."},{id:"p39",section:"panneaux",q:"Un feu jaune clignotant à une intersection signifie :",qEn:"A flashing amber (yellow) light at an intersection means:",options:["Avancez avec prudence","Arrêt complet obligatoire","Cédez le passage à tout le monde","Le feu va passer au rouge, accélérez"],optionsEn:["Proceed with caution","A complete stop is mandatory","Yield to everyone","The light is about to turn red, speed up"],answer:0,expl:"Jaune clignotant = prudence, pas d'arrêt obligatoire. C'est différent du rouge clignotant, qui exige un arrêt.",explEn:"A flashing amber means caution, not a mandatory stop. That differs from flashing red, which requires a stop."},{id:"p40",section:"panneaux",q:"À un feu de circulation, une flèche verte affichée en même temps que le feu rouge signifie :",qEn:"At a traffic light, a green arrow shown with a red light means:",options:["Vous pouvez tourner dans le sens de la flèche, prudemment","Vous pouvez aller tout droit","Le feu est défectueux","Vous devez arrêter dans tous les cas"],optionsEn:["You may turn in the direction of the arrow, carefully","You may go straight through","The light is malfunctioning","You must stop in all cases"],answer:0,expl:"La flèche verte autorise le virage dans sa direction malgré le feu rouge pour les autres mouvements. Cédez aux piétons.",explEn:"The green arrow allows turning in its direction despite the red light for other movements. Yield to pedestrians."},{id:"p41",section:"panneaux",q:"Un feu vert clignotant (ou une flèche verte) au-dessus d'une intersection signifie :",qEn:"A flashing green light (or green arrow) over an intersection means:",options:["Vous pouvez tourner à gauche, aller tout droit ou tourner à droite — la circulation inverse est arrêtée","Le feu va bientôt passer au jaune","Priorité aux véhicules d'urgence","Vous devez accélérer pour passer"],optionsEn:["You may turn left, go straight or turn right — opposing traffic is stopped","The light is about to turn amber","Priority for emergency vehicles","You must speed up to get through"],answer:0,expl:"Le vert clignotant (feu de priorité) indique que la circulation en sens inverse a un feu rouge : le virage à gauche est protégé.",explEn:"A flashing green (advance green) means opposing traffic has a red light: the left turn is protected."},{id:"p42",section:"panneaux",q:"Le panneau en forme de X installé à un passage à niveau s'appelle :",qEn:"The X-shaped sign installed at a railway crossing is called:",options:["Une croix de Saint-André (crossbuck), qui a le même sens que « cédez le passage »","Un panneau de route fermée","Un signal de détresse","Un panneau publicitaire"],optionsEn:["A crossbuck, which has the same meaning as a yield sign","A road-closed sign","A distress signal","An advertising board"],answer:0,expl:"La croix blanche en X aux passages à niveau équivaut à un « cédez le passage » : vous devez céder aux trains.",explEn:"The white X crossbuck at railway crossings has the same meaning as a yield sign: you must yield to trains."},{id:"r01",section:"regles",q:"S'il n'y a aucun panneau de limite de vitesse, quelle est la vitesse maximale dans une ville, un village ou une zone bâtie en Ontario ?",qEn:"If there is no speed limit sign, what is the maximum speed in an Ontario city, town or built-up area?",options:["50 km/h","60 km/h","40 km/h","80 km/h"],optionsEn:["50 km/h","60 km/h","40 km/h","80 km/h"],answer:0,expl:"Sans panneau : 50 km/h dans les agglomérations et 80 km/h ailleurs. C'est un fait du Guide officiel du MTO, chapitre « Sur la route ».",explEn:"Without signs: 50 km/h in built-up areas and 80 km/h elsewhere. This is from the Official MTO Handbook, 'On the road' chapter."},{id:"r02",section:"regles",q:"S'il n'y a aucun panneau, quelle est la vitesse maximale hors des villes et villages en Ontario ?",qEn:"If there is no speed limit sign, what is the maximum speed outside cities and towns in Ontario?",options:["80 km/h","90 km/h","100 km/h","70 km/h"],optionsEn:["80 km/h","90 km/h","100 km/h","70 km/h"],answer:0,expl:"Hors agglomération et sans panneau, la limite par défaut est de 80 km/h.",explEn:"Outside built-up areas with no sign, the default limit is 80 km/h."},{id:"r03",section:"regles",q:"En tant que titulaire d'un permis G1, quel taux d'alcool dans le sang est permis lorsque vous conduisez ?",qEn:"As a G1 licence holder, what blood alcohol level is allowed when you drive?",options:["Zéro : aucun alcool","Moins de 0,08","Moins de 0,05","Une consommation seulement"],optionsEn:["Zero: no alcohol at all","Less than 0.08","Less than 0.05","One drink only"],answer:0,expl:"Les conducteurs débutants (G1 et G2) et les conducteurs de 21 ans et moins doivent avoir un taux d'alcool de zéro.",explEn:"Novice drivers (G1 and G2) and drivers aged 21 and under must have a zero blood alcohol level."},{id:"r04",section:"regles",q:"Avec un permis G1, quelles autoroutes vous sont interdites (sauf avec un instructeur certifié) ?",qEn:"With a G1 licence, which highways are you prohibited from driving on (except with a certified instructor)?",options:["Les autoroutes de la série 400 et les voies rapides désignées","Toutes les routes de plus de 80 km/h","Aucune, toutes sont permises","Seulement l'autoroute 401"],optionsEn:["400-series highways and designated expressways","All roads over 80 km/h","None, all are allowed","Only Highway 401"],answer:0,expl:"Le G1 interdit les autoroutes de la série 400 et certaines voies rapides, sauf si un instructeur de conduite certifié vous accompagne.",explEn:"A G1 prohibits 400-series highways and certain expressways, unless a certified driving instructor is with you."},{id:"r05",section:"regles",q:"Avec un permis G1, pendant quelles heures est-il interdit de conduire ?",qEn:"With a G1 licence, during which hours are you not allowed to drive?",options:["Entre minuit et 5 h du matin","Entre 22 h et 6 h du matin","Entre 1 h et 4 h du matin","Aucune restriction d'heure"],optionsEn:["Between midnight and 5 a.m.","Between 10 p.m. and 6 a.m.","Between 1 a.m. and 4 a.m.","No time restriction"],answer:0,expl:"Un conducteur G1 ne peut pas conduire entre minuit et 5 h du matin.",explEn:"A G1 driver may not drive between midnight and 5 a.m."},{id:"r06",section:"regles",q:"Qui doit accompagner un conducteur G1, et où doit-il s'asseoir ?",qEn:"Who must accompany a G1 driver, and where must they sit?",options:["Un conducteur avec permis G complet depuis au moins 4 ans, assis à l'avant","N'importe quel conducteur titulaire d'un permis G2, assis à l'arrière","Un parent, peu importe son permis","Personne : le G1 permet de conduire seul en ville"],optionsEn:["A fully licensed G driver with at least 4 years of experience, seated in the front","Any G2 driver, seated in the back","A parent, regardless of their licence","Nobody: G1 allows driving alone in town"],answer:0,expl:"L'accompagnateur G1 doit détenir un permis G complet depuis au moins 4 ans, s'asseoir à l'avant et avoir un taux d'alcool inférieur à 0,05.",explEn:"The G1 accompanying driver must hold a full G licence for at least 4 years, sit in the front seat, and have a blood alcohol level below 0.05."},{id:"r07",section:"regles",q:"Avec un permis G1, combien de passagers pouvez-vous transporter ?",qEn:"With a G1 licence, how many passengers may you carry?",options:["Autant qu'il y a de ceintures de sécurité qui fonctionnent","Un seul passager","Quatre passagers maximum","Aucun passager"],optionsEn:["Only as many as there are working seatbelts","Only one passenger","Four passengers maximum","No passengers at all"],answer:0,expl:"Chaque passager doit avoir sa propre ceinture fonctionnelle; c'est ce qui limite le nombre de passagers pour un G1.",explEn:"Every passenger must have their own working seatbelt; that is what limits passenger numbers for a G1 driver."},{id:"r08",section:"regles",q:"Un autobus scolaire est arrêté, ses feux rouges clignotent et son bras d'arrêt est déployé. Que devez-vous faire ?",qEn:"A school bus is stopped with its red lights flashing and stop arm out. What must you do?",options:["Arrêter à au moins 20 mètres de l'autobus, dans les deux sens (sauf autoroute divisée par un terre-plein)","Ralentir et dépasser prudemment","Arrêter seulement si des enfants traversent","Continuer si vous êtes dans le sens opposé"],optionsEn:["Stop at least 20 metres from the bus, in both directions (except on a highway divided by a median)","Slow down and pass carefully","Stop only if children are crossing","Keep going if you are travelling in the opposite direction"],answer:0,expl:"Il faut s'arrêter à au moins 20 m d'un autobus scolaire aux feux clignotants, et ne repartir que lorsque les feux sont éteints et le bras d'arrêt rentré.",explEn:"You must stop at least 20 metres from a school bus with flashing lights, and not move until the lights stop and the stop arm is folded in."},{id:"r09",section:"regles",q:"Vous entendez la sirène d'un véhicule d'urgence qui s'approche derrière vous. Que devez-vous faire ?",qEn:"You hear the siren of an emergency vehicle approaching behind you. What must you do?",options:["Vous ranger le plus à droite possible et arrêter","Accélérer pour dégager la voie","Continuer à la même vitesse","Vous arrêter immédiatement où vous êtes, même au milieu de l'intersection"],optionsEn:["Pull over as far to the right as possible and stop","Speed up to clear the way","Continue at the same speed","Stop immediately where you are, even in the middle of the intersection"],answer:0,expl:"À l'approche d'un véhicule d'urgence avec sirène ou gyrophares, rangez-vous à droite et arrêtez. Ne bloquez jamais une intersection.",explEn:"When an emergency vehicle approaches with siren or flashing lights, pull to the right and stop. Never block an intersection."},{id:"r10",section:"regles",q:"À une intersection avec des arrêts dans les quatre directions, qui passe en premier ?",qEn:"At a four-way stop intersection, who goes first?",options:["Le premier véhicule arrivé et complètement arrêté","Le véhicule le plus gros","Le véhicule qui va tout droit, dans tous les cas","Le véhicule à votre gauche"],optionsEn:["The first vehicle to arrive and stop completely","The largest vehicle","The vehicle going straight, in all cases","The vehicle on your left"],answer:0,expl:"À un arrêt toutes directions : premier arrivé, premier parti. En cas d'égalité, on cède au véhicule à sa droite.",explEn:"At an all-way stop: first to arrive, first to go. If you arrive at the same time, yield to the vehicle on your right."},{id:"r11",section:"regles",q:"Vous tournez à gauche à une intersection. À qui devez-vous céder le passage ?",qEn:"You are turning left at an intersection. Who must you yield to?",options:["Aux véhicules venant en sens inverse et aux piétons qui traversent","À personne, vous avez la priorité en tournant","Seulement aux camions","Seulement aux véhicules derrière vous"],optionsEn:["Oncoming vehicles and pedestrians crossing","Nobody, you have priority when turning","Only trucks","Only vehicles behind you"],answer:0,expl:"Le virage à gauche est une des manœuvres les plus risquées : vous cédez aux véhicules en sens inverse et aux piétons.",explEn:"Turning left is one of the riskiest manoeuvres: you must yield to oncoming traffic and pedestrians."},{id:"r12",section:"regles",q:"Au feu rouge, pouvez-vous tourner à droite ?",qEn:"At a red light, may you turn right?",options:["Oui, après un arrêt complet et avoir cédé le passage, sauf si un panneau l'interdit","Non, jamais au feu rouge","Oui, sans arrêter si la voie est libre","Oui, seulement entre 7 h et 19 h"],optionsEn:["Yes, after a complete stop and yielding, unless a sign prohibits it","No, never on a red light","Yes, without stopping if the way is clear","Yes, only between 7 a.m. and 7 p.m."],answer:0,expl:"Le virage à droite au feu rouge est permis après arrêt complet et vérification, sauf panneau contraire. Il est interdit sur l'île de Montréal, mais permis en Ontario.",explEn:"Turning right on red is allowed after a full stop and check, unless a sign says otherwise."},{id:"r13",section:"regles",q:"Quelle est la règle de base pour garder une distance de suivi sécuritaire par temps normal ?",qEn:"What is the basic rule for keeping a safe following distance in normal weather?",options:["La règle des deux secondes derrière le véhicule devant vous","Une longueur de voiture, peu importe la vitesse","Coller le véhicule pour éviter que d'autres s'insèrent","Dix mètres en tout temps"],optionsEn:["The two-second rule behind the vehicle ahead of you","One car length, regardless of speed","Follow closely so others cannot cut in","Ten metres at all times"],answer:0,expl:"Laissez au moins deux secondes d'écart; augmentez cette distance la nuit, par mauvais temps ou derrière un gros véhicule.",explEn:"Leave at least a two-second gap; increase it at night, in bad weather, or behind a large vehicle."},{id:"r14",section:"regles",q:"À quelle distance minimale d'une bouche d'incendie est-il interdit de stationner ?",qEn:"What is the minimum distance from a fire hydrant where parking is prohibited?",options:["3 mètres","1 mètre","6 mètres","10 mètres"],optionsEn:["3 metres","1 metre","6 metres","10 metres"],answer:0,expl:"Il est interdit de stationner à moins de 3 mètres d'une bouche d'incendie en Ontario.",explEn:"Parking within 3 metres of a fire hydrant is prohibited in Ontario."},{id:"r15",section:"regles",q:"Avant de changer de voie, que devez-vous faire en plus de regarder vos rétroviseurs ?",qEn:"Before changing lanes, what must you do in addition to checking your mirrors?",options:["Tourner la tête pour vérifier votre angle mort, et signaler votre intention","Klaxonner pour avertir les autres","Accélérer fortement","Rien d'autre"],optionsEn:["Turn your head to check your blind spot, and signal your intention","Honk to warn others","Accelerate hard","Nothing else"],answer:0,expl:"Signal, rétroviseur, angle mort : tournez la tête par-dessus votre épaule, car les rétroviseurs ne montrent pas tout.",explEn:"Signal, mirror, blind spot: turn your head over your shoulder, because mirrors do not show everything."},{id:"r16",section:"regles",q:"Quelle position des mains sur le volant recommande le Guide officiel du MTO ?",qEn:"What hand position on the steering wheel does the Official MTO Handbook recommend?",options:["9 h et 3 h","10 h et 2 h","Une main à 12 h","Les deux mains en bas du volant"],optionsEn:["9 and 3 o'clock","10 and 2 o'clock","One hand at 12 o'clock","Both hands at the bottom of the wheel"],answer:0,expl:"Le Guide officiel recommande de placer les mains à 9 h et 3 h, comme sur une horloge.",explEn:"The Official Handbook recommends placing your hands at 9 and 3 o'clock, like on a clock face."},{id:"r17",section:"regles",q:"À quelle fréquence devriez-vous vérifier vos rétroviseurs en conduisant ?",qEn:"How often should you check your mirrors while driving?",options:["Toutes les cinq secondes environ, en balayant aussi la route devant vous","Seulement avant de changer de voie","Toutes les minutes","Jamais, il faut regarder seulement devant"],optionsEn:["About every five seconds, while also scanning the road ahead","Only before changing lanes","Every minute","Never, you should only look ahead"],answer:0,expl:"Le Guide officiel conseille de regarder dans les rétroviseurs toutes les cinq secondes et de vérifier les angles morts en tournant la tête.",explEn:"The Official Handbook advises checking your mirrors every five seconds and checking blind spots by turning your head."},{id:"r18",section:"regles",q:"Que devez-vous faire si vos roues commencent à flotter sur l'eau (aquaplanage) ?",qEn:"What should you do if your wheels start to ride on water (hydroplaning)?",options:["Lever doucement le pied de l'accélérateur et garder le volant droit","Freiner brusquement","Accélérer pour traverser la flaque","Tourner le volant rapidement d'un côté à l'autre"],optionsEn:["Ease your foot off the accelerator and keep the steering wheel straight","Brake hard","Accelerate through the puddle","Turn the wheel quickly from side to side"],answer:0,expl:"En aquaplanage, les pneus perdent contact avec la route. Relâchez l'accélérateur doucement; ne freinez pas brusquement.",explEn:"When hydroplaning, the tires lose contact with the road. Ease off the accelerator gently; do not brake suddenly."},{id:"r19",section:"regles",q:"Quel est le taux d'alcool dans le sang qui constitue la limite criminelle fédérale au Canada ?",qEn:"What blood alcohol concentration is the federal criminal limit in Canada?",options:["0,08 (80 mg d'alcool par 100 ml de sang)","0,05","0,10","0,02"],optionsEn:["0.08 (80 mg of alcohol per 100 ml of blood)","0.05","0.10","0.02"],answer:0,expl:"0,08 est la limite criminelle. Entre 0,05 et 0,08 en Ontario, vous êtes dans la « zone d'avertissement » avec suspension immédiate. Pour un G1/G2 : zéro.",explEn:"0.08 is the criminal limit. Between 0.05 and 0.08 in Ontario you are in the 'warn range' with an immediate suspension. For G1/G2 drivers: zero."},{id:"r20",section:"regles",q:"Un policier vous fait signe de vous arrêter. Quels documents devez-vous lui remettre à sa demande ?",qEn:"A police officer signals you to stop. Which documents must you hand over on request?",options:["Votre permis de conduire, le certificat d'immatriculation et une preuve d'assurance","Seulement votre permis de conduire","Votre passeport et votre permis","Aucun document n'est obligatoire"],optionsEn:["Your driver's licence, vehicle registration and proof of insurance","Only your driver's licence","Your passport and your licence","No documents are required"],answer:0,expl:"Selon le Guide officiel : permis de conduire, certificat d'immatriculation (ou copie) et preuve d'assurance, à remettre immédiatement à la demande de l'agent.",explEn:"According to the Official Handbook: driver's licence, registration (or a copy) and proof of insurance, handed over immediately when the officer asks."},{id:"r21",section:"regles",q:"Après une collision, quand devez-vous obligatoirement la signaler à la police en Ontario ?",qEn:"After a collision, when must you report it to the police in Ontario?",options:["S'il y a des blessés, ou si les dommages combinés semblent dépasser 2 000 $","Seulement si votre voiture ne peut plus rouler","Toujours, même pour une égratignure","Jamais, c'est l'affaire des assurances seulement"],optionsEn:["If anyone is injured, or if combined damage appears to exceed $2,000","Only if your car can no longer be driven","Always, even for a scratch","Never, it is only an insurance matter"],answer:0,expl:"Signalez la collision s'il y a des blessés ou si les dommages dépassent 2 000 $. Vous devez toujours vous arrêter et échanger vos renseignements.",explEn:"Report the collision if anyone is hurt or damage exceeds $2,000. You must always stop and exchange information."},{id:"r22",section:"regles",q:"Quel espace minimum devez-vous laisser en dépassant un cycliste en Ontario ?",qEn:"What minimum space must you leave when passing a cyclist in Ontario?",options:["Au moins 1 mètre","Au moins 50 centimètres","Aucun minimum prévu","Au moins 3 mètres"],optionsEn:["At least 1 metre","At least 50 centimetres","No minimum is set","At least 3 metres"],answer:0,expl:"La loi ontarienne exige au moins 1 mètre entre votre véhicule et un cycliste que vous dépassez, lorsque c'est possible.",explEn:"Ontario law requires at least 1 metre between your vehicle and a cyclist you are passing, where possible."},{id:"r23",section:"regles",q:"Les feux de circulation d'une intersection sont complètement en panne (aucun feu allumé). Comment traitez-vous l'intersection ?",qEn:"The traffic lights at an intersection are completely out (no lights at all). How do you treat the intersection?",options:["Comme un arrêt dans toutes les directions : arrêtez, puis passez à tour de rôle","Comme un feu vert : passez sans arrêter","Comme un cédez-le-passage seulement","Faites demi-tour et évitez l'intersection"],optionsEn:["Like an all-way stop: stop, then proceed in turn","Like a green light: go through without stopping","Like a yield sign only","Turn around and avoid the intersection"],answer:0,expl:"Des feux complètement éteints transforment l'intersection en arrêt toutes directions : tout le monde arrête, premier arrivé premier parti.",explEn:"Completely dark lights turn the intersection into an all-way stop: everyone stops, first come first served."},{id:"r24",section:"regles",q:"Vous manquez votre sortie sur l'autoroute. Que faites-vous ?",qEn:"You miss your exit on the freeway. What do you do?",options:["Continuez jusqu'à la prochaine sortie","Reculez sur l'accotement jusqu'à la sortie","Traversez le terre-plein pour faire demi-tour","Arrêtez-vous sur l'accotement et attendez"],optionsEn:["Continue to the next exit","Back up on the shoulder to the exit","Cross the median to turn around","Stop on the shoulder and wait"],answer:0,expl:"Ne reculez jamais et ne traversez jamais le terre-plein sur une autoroute. Prenez la prochaine sortie.",explEn:"Never back up and never cross the median on a freeway. Take the next exit."},{id:"r25",section:"regles",q:"Quand vos phares doivent-ils obligatoirement être allumés en Ontario ?",qEn:"When must your headlights legally be on in Ontario?",options:["Entre une demi-heure avant le coucher du soleil et une demi-heure après le lever, et quand la visibilité est réduite","Seulement après minuit","Seulement sous la pluie","En tout temps, même le jour, sans exception"],optionsEn:["From half an hour before sunset to half an hour after sunrise, and when visibility is reduced","Only after midnight","Only when it rains","At all times, even in daylight, without exception"],answer:0,expl:"Phares obligatoires de 30 minutes avant le coucher du soleil à 30 minutes après le lever du soleil, et dès que vous ne voyez pas clairement à 150 m.",explEn:"Headlights are required from 30 minutes before sunset to 30 minutes after sunrise, and whenever you cannot see clearly for 150 m."},{id:"r26",section:"regles",q:"À quelle distance d'un véhicule venant en sens inverse devez-vous passer des feux de route aux feux de croisement ?",qEn:"Within what distance of an oncoming vehicle must you dim your high beams to low beams?",options:["À moins de 150 mètres","À moins de 50 mètres","À moins de 300 mètres","Seulement quand l'autre clignote ses phares"],optionsEn:["Within 150 metres","Within 50 metres","Within 300 metres","Only when the other driver flashes their lights"],answer:0,expl:"Passez aux feux de croisement à moins de 150 m d'un véhicule en sens inverse, et à moins de 60 m derrière un véhicule que vous suivez.",explEn:"Dim to low beams within 150 m of an oncoming vehicle, and within 60 m behind a vehicle you are following."},{id:"r27",section:"regles",q:"Vous approchez d'un passage à niveau sans barrières. À quelle distance minimale des rails devez-vous arrêter si un train arrive ?",qEn:"You approach a railway crossing without gates. What is the minimum distance from the tracks where you must stop if a train is coming?",options:["Au moins 5 mètres du rail le plus proche","Directement sur les rails","1 mètre suffit","15 mètres exactement"],optionsEn:["At least 5 metres from the nearest rail","Right on the tracks","1 metre is enough","Exactly 15 metres"],answer:0,expl:"Arrêtez à au moins 5 m du rail le plus proche, et ne vous engagez que si vous pouvez traverser complètement.",explEn:"Stop at least 5 metres from the nearest rail, and only proceed if you can clear the crossing completely."},{id:"r28",section:"regles",q:"À Toronto, un tramway est arrêté et ses portes sont ouvertes pour faire monter des passagers. Que devez-vous faire ?",qEn:"In Toronto, a streetcar is stopped with its doors open for passengers. What must you do?",options:["Arrêter au moins 2 mètres derrière les portes arrière du tramway","Dépasser lentement par la droite","Klaxonner et continuer","Dépasser par la gauche en tout temps"],optionsEn:["Stop at least 2 metres behind the rear doors of the streetcar","Pass slowly on the right","Honk and keep going","Pass on the left at all times"],answer:0,expl:"Il faut s'arrêter au moins 2 m derrière les portes d'un tramway arrêté, pour laisser les passagers monter et descendre en sécurité.",explEn:"You must stop at least 2 metres behind the doors of a stopped streetcar so passengers can board and exit safely."},{id:"r29",section:"regles",q:"Un véhicule d'urgence est arrêté sur le bord de la route, gyrophares allumés. Que dit la loi « Move Over » ?",qEn:"An emergency vehicle is stopped at the roadside with its lights flashing. What does the 'Move Over' law require?",options:["Ralentir et, si c'est sécuritaire, changer de voie pour vous éloigner du véhicule arrêté","Continuer à la même vitesse dans votre voie","Vous arrêter complètement derrière le véhicule d'urgence","Accélérer pour passer rapidement"],optionsEn:["Slow down and, if safe, move over a lane away from the stopped vehicle","Continue at the same speed in your lane","Stop completely behind the emergency vehicle","Speed up to pass quickly"],answer:0,expl:"La loi ontarienne « Move Over » : ralentissez et dégagez une voie d'espace devant les véhicules d'urgence et les dépanneuses arrêtés.",explEn:"Ontario's 'Move Over' law: slow down and leave a lane of space for stopped emergency vehicles and tow trucks."},{id:"r30",section:"regles",q:"Jusqu'à quel âge un enfant doit-il utiliser un siège d'appoint en Ontario ?",qEn:"Until what age must a child use a booster seat in Ontario?",options:["Jusqu'à 8 ans (ou 36 kg, ou 145 cm, selon le premier atteint)","Jusqu'à 5 ans","Jusqu'à 12 ans obligatoirement","Le siège d'appoint est optionnel"],optionsEn:["Until age 8 (or 36 kg, or 145 cm, whichever comes first)","Until age 5","Until age 12, always","Booster seats are optional"],answer:0,expl:"Le siège d'appoint est obligatoire jusqu'à ce que l'enfant ait 8 ans, pèse 36 kg ou mesure 145 cm.",explEn:"A booster seat is required until the child turns 8, weighs 36 kg, or is 145 cm tall."},{id:"r31",section:"regles",q:"Qui est responsable de s'assurer qu'un passager de moins de 16 ans porte sa ceinture ?",qEn:"Who is responsible for making sure a passenger under 16 wears a seatbelt?",options:["Le conducteur","Le passager lui-même","Le parent, même absent","Personne"],optionsEn:["The driver","The passenger themself","The parent, even if absent","Nobody"],answer:0,expl:"Le conducteur est responsable des passagers de moins de 16 ans : ceinture ou système de retenue approprié, sinon amende et points d'inaptitude.",explEn:"The driver is responsible for passengers under 16: seatbelt or proper child restraint, or face a fine and demerit points."},{id:"r32",section:"regles",q:"À 15 points d'inaptitude accumulés, que risque un conducteur pleinement titulaire (permis G complet) ?",qEn:"At 15 accumulated demerit points, what does a fully licensed (full G) driver face?",options:["Une suspension de permis de 30 jours","Un simple avertissement écrit","Rien avant 20 points","Une amende de 50 $ seulement"],optionsEn:["A 30-day licence suspension","Just a written warning","Nothing before 20 points","Only a $50 fine"],answer:0,expl:"Pour un conducteur pleinement titulaire, 15 points = suspension de 30 jours. Les conducteurs débutants font face à des sanctions plus tôt et plus sévères.",explEn:"For a fully licensed driver, 15 points means a 30-day suspension. Novice drivers face sanctions sooner and more severely."},{id:"r33",section:"regles",q:"Que se passe-t-il si vous refusez de fournir un échantillon d'haleine à un policier qui le demande légalement ?",qEn:"What happens if you refuse to provide a breath sample when a police officer lawfully demands one?",options:["C'est une infraction criminelle, avec suspension immédiate du permis","Rien, c'est votre droit absolu","Une simple contravention de stationnement","Le policier doit vous laisser partir"],optionsEn:["It is a criminal offence, with an immediate licence suspension","Nothing, it is your absolute right","Just a parking-type ticket","The officer must let you go"],answer:0,expl:"Le refus de fournir un échantillon est une infraction criminelle au même titre que conduire avec un taux élevé, avec suspension immédiate de 90 jours en Ontario.",explEn:"Refusing a breath sample is a criminal offence just like driving over the limit, with an immediate 90-day suspension in Ontario."},{id:"r34",section:"regles",q:"Dans quelles situations le demi-tour est-il interdit ?",qEn:"In which situations are U-turns prohibited?",options:["Dans une courbe, au sommet d'une côte, près d'un passage à niveau ou d'un pont, quand vous ne voyez pas clairement à 150 m","Seulement la nuit","Seulement sur les autoroutes","Le demi-tour est toujours permis"],optionsEn:["On a curve, at the crest of a hill, near a railway crossing or bridge, when you cannot see clearly for 150 m","Only at night","Only on highways","U-turns are always allowed"],answer:0,expl:"Le demi-tour est interdit partout où la visibilité est insuffisante : courbe, côte, pont, tunnel, passage à niveau — il faut voir clairement sur 150 m dans les deux sens.",explEn:"U-turns are prohibited wherever visibility is poor: curves, hills, bridges, tunnels, railway crossings — you need a clear view of 150 m in both directions."},{id:"r35",section:"regles",q:"Quand avez-vous le droit de dépasser par la droite ?",qEn:"When are you allowed to pass on the right?",options:["Quand le véhicule devant vous tourne (ou va tourner) à gauche et qu'il y a assez d'espace, ou sur une route à voies multiples","En tout temps, c'est toujours permis","Jamais, c'est toujours interdit","Seulement sur l'accotement"],optionsEn:["When the vehicle ahead is turning (or about to turn) left and there is enough room, or on a multi-lane road","At any time, it is always allowed","Never, it is always prohibited","Only on the shoulder"],answer:0,expl:"Le dépassement par la droite est permis dans des cas précis, notamment quand le véhicule devant tourne à gauche. Il est interdit de dépasser par l'accotement.",explEn:"Passing on the right is allowed in specific cases, notably when the vehicle ahead is turning left. Passing on the shoulder is not allowed."},{id:"r36",section:"regles",q:"Sur une bretelle d'entrée d'autoroute, comment devez-vous vous insérer dans la circulation ?",qEn:"On a freeway entrance ramp, how should you merge into traffic?",options:["Utiliser la voie d'accélération pour atteindre la vitesse de la circulation, puis vous insérer dans un espace libre","Arrêter au bout de la bretelle et attendre qu'il n'y ait plus personne","Vous insérer lentement, bien en dessous de la vitesse de la circulation","Klaxonner et forcer le passage"],optionsEn:["Use the acceleration lane to reach traffic speed, then merge into a gap","Stop at the end of the ramp and wait until it is empty","Merge slowly, well below traffic speed","Honk and force your way in"],answer:0,expl:"La voie d'accélération sert à égaler la vitesse du flot de circulation. S'arrêter sur une bretelle est dangereux.",explEn:"The acceleration lane is for matching the speed of traffic. Stopping on a ramp is dangerous."},{id:"r37",section:"regles",q:"Vous stationnez dans une pente descendante, le long d'un trottoir. Comment tournez-vous vos roues ?",qEn:"You park facing downhill along a curb. Which way do you turn your wheels?",options:["Vers le trottoir, pour que le véhicule roule vers le trottoir si les freins lâchent","Loin du trottoir","Droites, peu importe","Vers la rue"],optionsEn:["Toward the curb, so the vehicle rolls toward the curb if the brakes fail","Away from the curb","Straight, it does not matter","Toward the road"],answer:0,expl:"En descente : roues vers le trottoir. En montée avec trottoir : roues loin du trottoir. Serrez toujours le frein de stationnement.",explEn:"Downhill: wheels toward the curb. Uphill with a curb: wheels away from the curb. Always set the parking brake."},{id:"r38",section:"regles",q:"Quel est l'âge minimum pour obtenir un permis G1 en Ontario ?",qEn:"What is the minimum age to obtain a G1 licence in Ontario?",options:["16 ans","17 ans","18 ans","15 ans avec un cours"],optionsEn:["16 years old","17 years old","18 years old","15 with a course"],answer:0,expl:"Il faut avoir au moins 16 ans, réussir l'examen de la vue et l'examen théorique pour obtenir le G1.",explEn:"You must be at least 16, and pass a vision test and the knowledge test to get a G1."},{id:"r39",section:"regles",q:"Combien de temps devez-vous normalement garder le permis G1 avant de pouvoir passer l'examen pratique G2 ?",qEn:"How long must you normally hold a G1 licence before you can take the G2 road test?",options:["12 mois, ou 8 mois avec un cours de conduite approuvé","6 mois dans tous les cas","24 mois","Aucun délai"],optionsEn:["12 months, or 8 months with an approved driver education course","6 months in all cases","24 months","No waiting period"],answer:0,expl:"Le niveau G1 dure normalement 12 mois; un cours de conduite approuvé par le gouvernement réduit l'attente à 8 mois.",explEn:"The G1 level normally lasts 12 months; a government-approved driver education course shortens it to 8 months."},{id:"r40",section:"regles",q:"Concernant le cannabis et les autres drogues, quelle règle s'applique aux conducteurs débutants (G1/G2) et aux conducteurs de 21 ans et moins ?",qEn:"Regarding cannabis and other drugs, what rule applies to novice (G1/G2) drivers and drivers aged 21 and under?",options:["Tolérance zéro : aucune présence de drogue détectable","La même limite que l'alcool à 0,08","Le cannabis est permis s'il est médical","Aucune règle particulière"],optionsEn:["Zero tolerance: no detectable presence of drugs","The same limit as alcohol at 0.08","Cannabis is allowed if medical","No special rule"],answer:0,expl:"Tolérance zéro pour les drogues chez les conducteurs débutants et les 21 ans et moins, comme pour l'alcool.",explEn:"Zero tolerance for drugs applies to novice drivers and those 21 and under, just like alcohol."},{id:"r41",section:"regles",q:"Un brigadier scolaire lève son panneau d'arrêt au passage d'écoliers. Que devez-vous faire ?",qEn:"A school crossing guard raises their stop sign at a school crossing. What must you do?",options:["Arrêter et attendre que le brigadier et les enfants aient complètement quitté la chaussée","Ralentir et passer lentement à côté","Continuer si aucun enfant n'est encore dans la rue","Klaxonner pour avertir le brigadier"],optionsEn:["Stop and wait until the guard and children have completely cleared the road","Slow down and pass by slowly","Keep going if no child is in the road yet","Honk to warn the guard"],answer:0,expl:"Obéir au brigadier scolaire est une obligation légale : arrêtez et restez arrêté jusqu'à ce que tout le monde soit hors de la chaussée.",explEn:"Obeying a school crossing guard is a legal requirement: stop and stay stopped until everyone is off the road."},{id:"r42",section:"regles",q:"Que risque un conducteur qui dépasse de 50 km/h ou plus la limite permise (conduite acrobatique / « stunt driving ») ?",qEn:"What does a driver face for going 50 km/h or more over the limit (stunt driving)?",options:["Suspension immédiate du permis et saisie du véhicule, en plus de lourdes sanctions","Un avertissement verbal","Une amende de 85 $ seulement","Rien, si la route était libre"],optionsEn:["Immediate licence suspension and vehicle impoundment, plus heavy penalties","A verbal warning","Only an $85 fine","Nothing, if the road was empty"],answer:0,expl:"Les excès de 50 km/h et plus (40 km/h et plus là où la limite est inférieure à 80 km/h) sont traités comme conduite acrobatique : suspension et saisie immédiates sur place.",explEn:"Going 50 km/h or more over (40 km/h or more where the limit is under 80 km/h) is treated as stunt driving: immediate roadside suspension and impoundment."},{id:"r43",section:"regles",q:"Vous arrivez à une intersection et un piéton aveugle avec une canne blanche s'apprête à traverser. Que devez-vous faire ?",qEn:"You arrive at an intersection and a blind pedestrian with a white cane is about to cross. What must you do?",options:["Céder le passage et attendre qu'il ait traversé en sécurité","Klaxonner pour lui indiquer votre présence","Passer rapidement avant lui","Continuer, car il ne peut pas vous voir"],optionsEn:["Yield and wait until they have crossed safely","Honk to let them know you are there","Pass quickly before them","Keep going, since they cannot see you"],answer:0,expl:"Cédez toujours le passage aux piétons, et en particulier aux personnes aveugles ou malvoyantes identifiées par une canne blanche ou un chien-guide.",explEn:"Always yield to pedestrians, especially blind or visually impaired people identified by a white cane or guide dog."},{id:"r44",section:"regles",q:"Un véhicule est arrêté devant un passage pour piétons. Pouvez-vous le dépasser ?",qEn:"A vehicle is stopped at a pedestrian crossing. May you pass it?",options:["Non : il peut cacher un piéton qui traverse","Oui, en ralentissant un peu","Oui, par la droite seulement","Oui, si vous klaxonnez"],optionsEn:["No: it may be hiding a pedestrian who is crossing","Yes, if you slow down a little","Yes, on the right only","Yes, if you honk"],answer:0,expl:"Ne dépassez jamais un véhicule arrêté à un passage pour piétons : un piéton peut être en train de traverser devant lui.",explEn:"Never pass a vehicle stopped at a pedestrian crossing: a pedestrian may be crossing in front of it."},{id:"r45",section:"regles",q:"Quand un policier dirige la circulation à une intersection, ses instructions ont priorité sur :",qEn:"When a police officer is directing traffic at an intersection, their directions take priority over:",options:["Les panneaux de signalisation et les feux de circulation en place","Rien, les feux ont toujours priorité","Seulement les panneaux d'avertissement","Seulement les autres conducteurs"],optionsEn:["The traffic signs and signals in place","Nothing, lights always take priority","Only warning signs","Only other drivers"],answer:0,expl:"Selon le Guide officiel : suivez les instructions de l'agent de police malgré les panneaux ou les feux en place.",explEn:"According to the Official Handbook: follow the police officer's directions despite the signs or lights in place."},{id:"r46",section:"regles",q:"Pendant vos six premiers mois avec un permis G2, entre minuit et 5 h, combien de passagers de 19 ans et moins pouvez-vous transporter ?",qEn:"During your first six months with a G2 licence, between midnight and 5 a.m., how many passengers aged 19 and under may you carry?",options:["Un seul","Trois","Aucune limite","Aucun"],optionsEn:["Only one","Three","No limit","None"],answer:0,expl:"G2, premiers 6 mois : maximum 1 passager de 19 ans et moins entre minuit et 5 h; ensuite, maximum 3. Les membres de la famille immédiate sont exemptés.",explEn:"G2, first 6 months: a maximum of 1 passenger aged 19 and under between midnight and 5 a.m.; afterwards, a maximum of 3. Immediate family members are exempt."},{id:"r47",section:"regles",q:"Que devez-vous faire lorsque vous conduisez et que votre téléphone sonne ?",qEn:"What must you do if your phone rings while you are driving?",options:["L'ignorer jusqu'à ce que vous soyez arrêté en sécurité; tenir un appareil en conduisant est interdit","Répondre brièvement si c'est important","Le tenir entre les oreilles et l'épaule","Texter seulement aux feux rouges, c'est permis"],optionsEn:["Ignore it until you are safely stopped; holding a device while driving is prohibited","Answer briefly if it is important","Hold it between your ear and shoulder","Text only at red lights, that is allowed"],answer:0,expl:"La conduite distraite est interdite : aucun appareil tenu en main en conduisant, même arrêté à un feu. Les sanctions incluent amende, points et suspension pour les débutants.",explEn:"Distracted driving is prohibited: no hand-held device while driving, even stopped at a light. Penalties include fines, points and suspension for novice drivers."},{id:"r48",section:"regles",q:"À un carrefour giratoire, qui a la priorité ?",qEn:"At a roundabout, who has the right of way?",options:["Les véhicules déjà dans le carrefour; vous cédez en entrant","Le véhicule qui entre, toujours","Le véhicule le plus rapide","Le véhicule à droite, comme à un arrêt"],optionsEn:["Vehicles already in the roundabout; you yield when entering","The entering vehicle, always","The fastest vehicle","The vehicle on the right, like at a stop"],answer:0,expl:"À l'entrée d'un carrefour giratoire, cédez le passage à la circulation déjà engagée, puis insérez-vous dans un espace libre.",explEn:"At a roundabout entrance, yield to traffic already circulating, then merge into a gap."},{id:"r49",section:"regles",q:"Dans une zone de travaux où des travailleurs sont présents, que se passe-t-il avec les amendes pour excès de vitesse ?",qEn:"In a work zone where workers are present, what happens to speeding fines?",options:["Elles sont doublées","Elles sont réduites de moitié","Elles restent les mêmes","Il n'y a pas d'amende, seulement des points"],optionsEn:["They are doubled","They are cut in half","They stay the same","There is no fine, only points"],answer:0,expl:"En Ontario, les amendes pour excès de vitesse sont doublées dans les zones de travaux lorsque des travailleurs sont présents.",explEn:"In Ontario, speeding fines are doubled in work zones when workers are present."},{id:"r50",section:"regles",q:"Si votre véhicule commence à déraper (l'arrière glisse), quelle est la bonne réaction de base ?",qEn:"If your vehicle starts to skid (the rear slides), what is the basic correct reaction?",options:["Lever le pied de l'accélérateur et diriger le volant dans la direction où vous voulez aller","Freiner le plus fort possible","Accélérer pour reprendre le contrôle","Fermer les yeux et lâcher le volant"],optionsEn:["Ease off the accelerator and steer in the direction you want to go","Brake as hard as possible","Accelerate to regain control","Close your eyes and let go of the wheel"],answer:0,expl:"En dérapage : relâchez l'accélérateur et tournez le volant vers la direction visée. Les gestes brusques aggravent la glissade.",explEn:"In a skid: ease off the accelerator and steer toward where you want to go. Sudden movements make the slide worse."},{id:"r51",section:"regles",q:"Dans quelles circonstances pouvez-vous prêter votre permis de conduire ?",qEn:"Under what circumstances may you lend your driver's licence?",options:["En aucun cas","Dans une situation d'urgence","À une personne qui apprend à conduire","Pour servir de pièce d'identité à quelqu'un d'autre"],optionsEn:["Never, under any circumstances","In an emergency","To someone who is learning to drive","So someone else can use it as identification"],answer:0,expl:"Un permis de conduire ne se prête jamais, à personne et en aucune circonstance. C'est l'un des exemples de questions publiés par le MTO.",explEn:"A driver's licence may never be lent, to anyone, under any circumstances. This is one of the sample questions published by the MTO."},{id:"r52",section:"regles",q:"Que devez-vous faire avant de vous engager sur une route à partir d'une entrée privée ou d'un chemin privé ?",qEn:"What must you do before entering a road from a private driveway or private road?",options:["Céder le passage à tous les véhicules qui circulent sur la route","Klaxonner et avancer prudemment","Vous engager le plus rapidement possible","Faire un signal manuel, puis vous engager"],optionsEn:["Yield to all vehicles travelling on the road","Honk and proceed with caution","Enter as quickly as possible","Give a hand signal, then enter"],answer:0,expl:"En sortant d'une entrée ou d'un chemin privé, la priorité appartient toujours aux véhicules déjà sur la route : cédez-leur le passage.",explEn:"When entering from a private driveway or road, vehicles already on the road always have the right of way: yield to them."},{id:"r53",section:"regles",q:"Lorsqu'un conducteur est sur le point de vous dépasser, que devez-vous faire ?",qEn:"When another driver is about to pass you, what should you do?",options:["Vous déplacer vers la droite et le laisser vous dépasser","Accélérer pour qu'il n'ait pas à vous dépasser","Vous déplacer vers la gauche pour l'en empêcher","Lui faire signe de ne pas vous dépasser"],optionsEn:["Move to the right and let the driver pass","Speed up so the driver does not need to pass","Move to the left to block the pass","Signal the driver not to pass"],answer:0,expl:"Quand on vous dépasse, déplacez-vous vers la droite et maintenez votre vitesse : laissez l'autre conducteur compléter sa manœuvre.",explEn:"When being passed, move to the right and keep your speed steady: let the other driver complete the manoeuvre."},{id:"r54",section:"regles",q:"Pourquoi est-il plus dangereux de conduire à la vitesse limite permise la nuit que le jour ?",qEn:"Why is it more dangerous to drive at the speed limit at night than during the day?",options:["Parce qu'on ne peut pas voir aussi loin la nuit","Parce que les réflexes sont plus lents la nuit","Parce que la chaussée est toujours glissante la nuit","Parce que les limites de vitesse changent la nuit"],optionsEn:["Because you cannot see as far at night","Because reflexes are slower at night","Because the road is always slippery at night","Because speed limits change at night"],answer:0,expl:"La nuit, vos phares éclairent une distance limitée : vous voyez moins loin, donc la même vitesse laisse moins de temps pour réagir.",explEn:"At night your headlights light only a limited distance: you cannot see as far, so the same speed leaves less time to react."},{id:"r55",section:"regles",q:"En tout temps, vous devriez rouler à une vitesse qui vous permet de :",qEn:"At all times, you should drive at a speed that allows you to:",options:["Vous arrêter sur une distance sécuritaire","Vous arrêter en moins de 60 mètres","Suivre le flot de circulation sans jamais ralentir","Rouler exactement à la limite affichée"],optionsEn:["Stop within a safe distance","Stop in less than 60 metres","Follow the flow of traffic without ever slowing down","Drive exactly at the posted limit"],answer:0,expl:"La limite affichée est un maximum, pas une cible : adaptez votre vitesse aux conditions pour toujours pouvoir vous arrêter sur une distance sécuritaire.",explEn:"The posted limit is a maximum, not a target: adjust your speed to conditions so you can always stop within a safe distance."},{id:"r56",section:"regles",q:"Lorsque vous envisagez de faire demi-tour, que devez-vous déterminer en premier ?",qEn:"When you are thinking of making a U-turn, what should you determine first?",options:["Si le demi-tour est permis à cet endroit","Le rayon de braquage de votre véhicule","La hauteur du trottoir","S'il y a des arbres près du bord de la route"],optionsEn:["Whether a U-turn is permitted at that spot","Your vehicle's turning radius","The height of the curb","Whether there are trees near the edge of the road"],answer:0,expl:"Avant tout demi-tour, vérifiez d'abord qu'il est permis : il est interdit dans les courbes, les côtes, les ponts, les tunnels et près des passages à niveau, où il faut voir clairement sur 150 m.",explEn:"Before any U-turn, first check that it is permitted: U-turns are banned on curves, hills, bridges, in tunnels and near railway crossings, where you need a clear view for 150 m."}];var g0="g1-autonome-v1",Is=ws.map((e)=>({id:e.id,section:e.section}));function kn(){return{nextId:1,attempts:[],results:[]}}function Zf(){try{let e=localStorage.getItem(g0);if(!e)return kn();let a=JSON.parse(e);if(typeof a.nextId!=="number"||!Array.isArray(a.attempts)||!Array.isArray(a.results))return kn();return a}catch{return kn()}}function h0(e){try{localStorage.setItem(g0,JSON.stringify(e))}catch{}}var Yr=(e)=>{let a=[...e];for(let t=a.length-1;t>0;t--){let l=Math.floor(Math.random()*(t+1)),r=a[t];a[t]=a[l],a[l]=r}return a},x0={async recordAttempt(e){let a=Zf(),t=e.results.filter((u)=>u.section==="panneaux"),l=e.results.filter((u)=>u.section==="regles"),r=t.filter((u)=>u.correct).length,o=l.filter((u)=>u.correct).length,i=null;if(e.mode==="examen")i=t.length>0&&l.length>0&&r/t.length>=0.8&&o/l.length>=0.8;let n={id:a.nextId,mode:e.mode,signsTotal:t.length,signsCorrect:r,rulesTotal:l.length,rulesCorrect:o,passed:i,createdAt:new Date().toISOString()};return a.nextId+=1,a.attempts.push(n),a.results.push(...e.results),h0(a),n},async getStats(){let e=Zf(),a=[...e.attempts].sort((f :"Les exemples de questions officiels du MTO",drivetestCarsLink:"DriveTest — permis de conduire, automobiles",profileTitle:"Ton profil d'entraînement",profileNote:"Profil temporaire gardé sur cet appareil seulement, dans le navigateur. Rien n'est envoyé à un serveur pour le profil. Partage le fichier autonome avec tes amis : chacun crée son profil sur son appareil et progresse de son côté.",profileNameLabel:"Ton prénom ou ton surnom",profileNamePlaceholder:"Ex. : Joseph",profileLangLabel:"Langue du test",profileDateLabel:"Date visée pour le vrai test (facultatif)",profileCreate:"Créer mon profil",profileNameError:"Écris un prénom pour créer ton profil.",profileOnDevice:"Profil sur cet appareil",profileSince:"Créé le",profileTarget:"Test visé le",profileEdit:"Modifier",profileSave:"Enregistrer",profileDelete:"Supprimer le profil",profileDeleteConfirm:"Supprimer ce profil de cet appareil ?",profileDeleteYes:"Oui, supprimer",profileDeleteNote:"Supprimer le profil n'efface pas la progression enregistrée sur cet appareil.",hello:"Bonjour",daysLeft:"jours avant le test visé",testToday:"C'est le jour visé pour ton test — bonne chance !",footerTagline:"Entraînement au test théorique G1 de l'Ontario, en français et en anglais.",footerDisclaimer:"Plateforme d'entraînement indépendante, sans affiliation avec le gouvernement de l'Ontario, le MTO ou DriveTest. Les questions sont des questions d'entraînement rédigées à partir du Guide officiel — ce ne sont pas les questions du vrai examen.",footerSources:"Sources officielles",samplesCovered:"Les 8 exemples officiels publiés par le MTO sont tous couverts par la banque : dérapage (r50), prêt du permis (r51), entrée privée (r52), dépassement (r53), conduite de nuit (r54), vitesse sécuritaire (r55), demi-tour (r56) et changement de voie (r15)."},en:{lastTest:"Last official test — DriveTest",signs:"Road signs",rules:"Rules of the road",passed:"Passed",failed:"To redo",threshold:"Pass mark: 16/20 per section",realRule:"The real pass ma
