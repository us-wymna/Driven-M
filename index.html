ression. Vérifie ta connexion puis réessaie.",retry:"Réessayer",startError:"Impossible de préparer la séance. Vérifie ta connexion puis réessaie.",reset:"Réinitialiser ma progression",resetConfirm:"Tout effacer ?",resetYes:"Oui, tout effacer",cancel:"Annuler",noWeak:"Tu n'as encore aucune erreur enregistrée. Fais un entraînement pour commencer.",quit:"Quitter",streak:"bonnes réponses d'affilée",handbook:"Guide officiel de l'automobiliste (MTO) — la source du vrai test",drivetest:"DriveTest — guides officiels des conducteurs",scoring:"Comment le test G1 est noté (16/20 par section)",officialOnly:"Sources officielles canadiennes uniquement : toutes les questions sont rédigées à partir du Guide officiel de l'automobiliste du ministère des Transports de l'Ontario (MTO) — la même source que le vrai test G1. Aucune question copiée de sites d'entraînement non officiels, et aucun contenu européen ou américain : les règles, les panneaux et les limites sont ceux de l'Ontario.",bankNote:"Banque de 98 questions originales (42 panneaux, 56 règles), chacune avec son visuel : le panneau réel ou la situation illustrée.",langLabel:"Langue des questions",preparing:"Préparation de la séance…",standalone:"Version autonome — hors Muse",standaloneDesc:"La plateforme complète existe aussi en version autonome : un seul fichier HTML, sans serveur, à déposer sur GitHub Pages, Netlify ou Surge — ou à ouvrir directement sur ton PC. Mêmes questions, mêmes visuels, même simulateur de conduite et même logique de sélection ; ta progression y est sauvegardée dans le navigateur.",keepOnPc:"À garder sur ton PC — sans Muse, sans GitHub",keepOnPcDesc:"Télécharge la plateforme complète en un seul fichier, puis ouvre-le directement sur ton PC. Après le téléchargement, tu n'as plus besoin de Muse, ni de GitHub, ni même d'internet : tout est dans le fichier — les 98 questions, les visuels, le simulateur de conduite avec manette et la sélection intelligente. Ta progression y est sauvegardée dans le navigateur.",downloadStandalone:"Télécharger la version complète",standaloneFileMeta:"Un seul fichier HTML · fonctionne hors ligne",downloaded:"Fichier téléchargé. Retrouve-le dans tes Téléchargements, puis double-clique pour l'ouvrir dans Chrome ou Edge.",onlineVersion:"Version en ligne — lien public",onlineDesc:"La plateforme complète est aussi en ligne, ouverte à tous sans Muse : c'est le lien à envoyer à tes amis pour qu'ils testent chez eux. Chacun crée son profil sur son appareil et garde sa propre progression, dans son navigateur.",openOnline:"Ouvrir la version en ligne",stepDownload:"Télécharge le fichier avec le bouton ci-dessus.",stepOpen:"Ouvre le fichier téléchargé dans Chrome ou Edge — aucun compte, aucune installation.",stepDrive:"Branche ta manette pour la conduite : elle est détectée dans le fichier comme ici.",heroKicker:"Ontario · Permis de conduire · Catégorie G1",heroTitle:"L'examen théorique G1, préparé sérieusement.",heroTitleA:"L'examen théorique G1,",heroTitleB:"préparé sérieusement.",heroLead:"Le même contenu que le vrai test passé aux Centres Test au Volant : les panneaux et les règles de la route de l'Ontario, tirés du Guide officiel de l'automobiliste du MTO. Ici, tu t'entraînes à ton rythme, avec un visuel pour chaque question — avant d'aller passer le vrai.",heroFactFormat:"40 questions · 20 panneaux + 20 règles",heroFactPass:"Réussite : 16/20 dans chaque section",heroFactWalkIn:"Au vrai test : sans rendez-vous, résultat sur place",createProfileCta:"Créer mon profil et commencer",continueCta:"Continuer mon entraînement",seeHow:"Voir comment ça marche",signStripCaption:"La signalisation de l'Ontario — celle du vrai test, pas des panneaux d'ailleurs.",realTestTitle:"Le vrai examen, en bref",realTestNote:"Ce que DriveTest et le MTO publient sur l'examen théorique G1, vérifié sur leurs pages officielles.",factByLabel:"Créé par",factBy:"Le ministère des Transports de l'Ontario (MTO)",factFormatLabel:"Format",factFormat:"Choix multiples, sur papier ou sur ordinateur",factTimeLabel:"Temps",factTime:"Aucune limite de temps — la plupart des gens finissent en 20 à 30 minutes",factResultLabel:"Résultat",factResult:"Corrigé sur place, connu immédiatement",factRetakeLabel:"En cas d'échec",factRetake:"Tu refais seulement la section ratée ; un résultat reste valide un an",factFeeLabel:"Droits à payer",factFee:"Forfait d'environ 159,75 $ ; reprise d'une seule section : 16 $",factWhereLabel:"Où et quand",factWhere:"Dans un Centre Test au Volant, sans rendez-vous — arrive au moins une heure avant la fermeture",howTitle:"Comment ça marche",step1Title:"Crée ton profil sur cet appareil",step1:"Un prénom suffit. Aucun compte en ligne, aucun courriel, aucun mot de passe : le profil reste dans ce navigateur, sur cet appareil. Tes amis font pareil chez eux avec le fichier autonome — chacun garde sa propre progression.",step2Title:"Apprends la théorie, puis entraîne-toi",step2:"Si tu pars de zéro, commence par les 8 chapitres de théorie : chaque règle y est expliquée simplement, avec les chiffres à retenir. Ensuite, 98 questions avec visuel, par paliers : le système sert d'abord les questions jamais vues, puis tes erreurs, et mélange l'ordre à chaque séance.",step3Title:"Passe l'examen blanc",step3:"40 questions comme le vrai test, notées séparément : 16/20 en panneaux ET 16/20 en règles. Un bon total ne compense pas une section faible — c'est exactement là que beaucoup de candidats échouent.",step4Title:"Va passer le vrai test",step4:"Quand tes examens blancs réussissent les deux sections, présente-toi à un Centre Test au Volant avec une pièce d'identité acceptée. La marche à suivre complète est sur la page officielle de DriveTest, liée plus bas.",insideTitle:"Ce que contient la plateforme",insideSigns:"Panneaux de signalisation",insideSignsDesc:"42 questions, chacune avec le panneau ontarien dessiné — forme, couleurs et pictogramme comme sur la route.",insideRules:"Règles de la route",insideRulesDesc:"56 questions de lois ontari
