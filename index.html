-y-1",children:g.faults.map((A,b)=>u("li",{className:"flex items-baseline justify-between gap-3 text-sm",children:[l("span",{className:"text-[var(--text)]",children:t.faultNames[A.code]}),l("span",{className:"tnum font-mono text-xs text-[var(--dim)]",children:t.atDist(A.dist)})]},b))})]})]})]})}var yt=[{id:"bases",title:"Les bases avant de conduire",titleEn:"The basics before driving",desc:"Ce que le permis G1 autorise, ce qu'il interdit, et les vérifications avant de partir.",descEn:"What a G1 licence allows, what it forbids, and the checks to do before leaving.",minutes:4,mode:"regles",questionPrefixes:["r03","r04","r05","r06","r07","r16","r17","r31","r38","r39","r46","r51"],sections:[{h:"Le permis G1, c'est quoi ?",hEn:"What is a G1 licence?",body:["Le G1 est la première étape du système de permis progressif de l'Ontario. Tu l'obtiens en réussissant l'examen théorique (celui que tu prépares ici) et un examen de la vue. Il te donne le droit de conduire, mais seulement avec des conditions strictes, parce que tu es encore en apprentissage.","La condition la plus importante : tu dois toujours être accompagné d'un conducteur pleinement qualifié (permis G depuis au moins 4 ans) assis sur le siège avant, prêt à prendre le relais. Sans accompagnateur, tu n'as pas le droit de conduire du tout."],bodyEn:["G1 is the first step of Ontario's graduated licensing system. You earn it by passing the knowledge test (the one you are preparing here) and an eye test. It lets you drive, but only under strict conditions, because you are still learning.","The most important condition: you must always be accompanied by a fully licensed driver (a G licence held for at least 4 years) sitting in the front seat, ready to take over. Without that accompanying driver, you may not drive at all."],points:["Accompagnateur obligatoire : permis G depuis 4 ans ou plus, sur le siège avant","Taux d'alcool dans le sang : zéro, en tout temps","Interdit sur les autoroutes de la série 400 et les voies rapides, sauf avec un moniteur agréé","Toutes les ceintures doivent être bouclées, pour tous les passagers"],pointsEn:["Accompanying driver required: G licence for 4+ years, in the front seat","Blood alcohol level: zero, at all times","No driving on 400-series highways or high-speed expressways, except with a licensed instructor","Every seat belt must be fastened, for every passenger"]},{h:"Avant de partir : la routine du conducteur",hEn:"Before leaving: the driver's routine",body:["Avant même de démarrer, le Guide recommande une routine simple : règle ton siège pour atteindre les pédales confortablement, règle les rétroviseurs (intérieur, puis extérieurs), boucle ta ceinture, et assure-toi que tes passagers font de même. Un conducteur G1 est responsable de ses passagers de moins de 16 ans.","Une fois en route, tiens le volant à « 9 h et 3 h » — une main de chaque côté, à hauteur du milieu. C'est la position qui donne le meilleur contrôle et qui protège en cas de déploiement du coussin gonflable. Et jette un coup d'œil aux rétroviseurs toutes les cinq secondes environ : savoir ce qui se passe derrière fait partie de la conduite."],bodyEn:["Before even starting, the Handbook recommends a simple routine: adjust your seat so you reach the pedals comfortably, adjust the mirrors (inside first, then outside), fasten your seat belt, and make sure your passengers do the same. A G1 driver is responsible for passengers under 16.","Once moving, hold the wheel at “9 and 3” — one hand on each side, at mid-height. That position gives the best control and protects you if the airbag deploys. And check your mirrors about every five seconds: knowing what is happening behind you is part of driving."],points:["Siège, rétroviseurs, ceinture — dans cet ordre, avant de démarrer","Mains à 9 h et 3 h sur le volant","Rétroviseurs vérifiés toutes les cinq secondes environ","Le conducteur répond des passagers de moins de 16 ans"],pointsEn:["Seat, mirrors, seat belt — in that order, before starting","Hands at 9 and 3 on the steering wheel","Mirrors checked about every five seconds","The driver is responsible for passengers under 16"]},{h:"Ton permis n'est pas un jouet",hEn:"Your licence is not a toy",body:["Le permis de conduire est un document officiel qui t'appartient à toi seul. Le prêter à quelqu'un d'autre est une infraction, même « juste pour quelques minutes ». De la même façon, tu ne dois jamais utiliser le permis d'une autre personne comme s'il était le tien.","Retiens aussi que conduire est un privilège qui peut être suspendu : accumulation de points d'inaptitude, alcool, ou conduite dangereuse peuvent te le retirer. Le chapitre 7 revient sur les risques en détail."],bodyEn:["A driver's licence is an official document that belongs to you alone. Lending it to someone else is an offence, even “just for a few minutes”. Likewise, you must never use someone else's licence as if it were yours.","Remember too that driving is a privilege that can be suspended: demerit points, alcohol, or dangerous driving can take it away. Chapter 7 covers the risks in detail."],points:["Ne prête jamais ton permis, n'utilise jamais celui d'un autre","Le permis peut être suspendu : points, alcool, conduite dangereuse"],pointsEn:["Never lend your licence, never use someone else's","A licence can be suspended: points, alcohol, dangerous driving"]}]},{id:"panneaux",title:"Lire les panneaux",titleEn:"Reading road signs",desc:"Formes, couleurs et familles de panneaux : reconnaître un panneau avant même de le lire.",descEn:"Shapes, colours and sign families: recognize a sign before you can even read it.",minutes:5,mode:"panneaux",questionPrefixes:["p"],sections:[{h:"La forme parle avant les mots",hEn:"The shape speaks before the words",body:["En Ontario, chaque famille de panneaux a une forme qui ne change jamais. Même de loin, même sous la neige ou dans le brouillard, la forme te dit déjà quoi faire. C'est pour ça que l'examen insiste autant sur les panneaux : sur la route, tu n'auras pas le temps de lire, tu devras reconnaître.","L'octogone (8 côtés) ne sert qu'à une chose : l'arrêt complet obligatoire. Le triangle inversé (pointe en bas) signifie « cédez le passage ». Le losange (diamant jaune) annonce un avertissement : un danger ou un changement devant. Le rectangle donne des règlements ou des informations, selon sa couleur."],bodyEn:["In Ontario, every sign family has a shape that never changes. Even from far away, even in snow or fog, the shape already tells you what to do. That is why the test leans so hard on signs: on the road you will not have time to read, you will have to recognize.","The octagon (8 sides) means one thing only: a mandatory full stop. The upside-down triangle means “yield”. The diamond (yellow) is a warning: a hazard or a change ahead. Rectangles carry regulations or information, depending on their colour."],points:["Octogone rouge = arrêt complet, toujours","Triangle inversé = cédez le passage","Losange jaune = avertissement, danger devant","Croix en X = passage à niveau (train)"],pointsEn:["Red octagon = full stop, always","Upside-down triangle = yield the right of way","Yellow diamond = warning, hazard ahead","X crossbuck = railway crossing"]},{h:"Les couleurs ont un sens",hEn:"Colours carry meaning",body:["Le rouge annonce une interdiction ou un arrêt : arrêt, sens interdit, interdiction de tourner. Le vert guide : directions, distances, sorties d'autoroute. Le bleu indique des services (essence, hôpital, hébergement). L'orange signale une zone de travaux — là, ralentis toujours, des travailleurs sont près de la route.","Les panneaux de limite de vitesse sont des rectangles blancs avec le mot « MAXIMUM » et un nombre noir. C'est un maximum, pas une cible : si la route est glissante ou la visibilité mauvaise, la bonne vitesse est plus basse que le nombre affiché (le chapitre 3 y revient)."],bodyEn:["Red means a prohibition or a stop: stop, do not enter, no turns. Green guides: directions, distances, highway exits. Blue points to services (fuel, hospital, lodging). Orange means a work zone — always slow down there, workers are close to the road.","Speed limit signs are white rectangles with the word “MAXIMUM” and a black number. It is a maximum, not a target: if the road is slippery or visibility is poor, the right speed is lower than the posted number (Chapter 3 comes back to this)."],points:["Rouge = interdiction ou arrêt","Vert = directions et distances","Bleu = services","Orange = travaux, ralentir","« MAXIMUM » = une limite, jamais un objectif"],pointsEn:["Red = prohibition or stop","Green = directions and distances","Blue = services","Orange = road work, slow down","“MAXIMUM” = a limit, never a target"]},{h:"Les panneaux que les candidats ratent",hEn:"The signs candidates miss",body:["Trois panneaux reviennent souvent dans les erreurs. Le panneau de zone scolaire (pentagone — forme de maison — avec des enfants) annonce une zone où la limite tombe souvent à 40 km/h et où il faut s'attendre à des enfants qui traversent sans regarder. Le panneau « voie réservée » (losange blanc sur le panneau) réserve la voie aux autobus, taxis ou véhicules avec plusieurs passagers selon les heures indiquées. Et le panneau de fin de voie ou de rétrécissement demande de se rabattre tôt, pas au dernier moment.","Dernier réflexe : un panneau que tu ne comprends pas n'est jamais une raison d'ignorer la prudence. Ralentis, observe, et laisse passer les autres en cas de doute."],bodyEn:["Three signs show up often in mistakes. The school zone sign (a pentagon — house-shaped — with children) marks a zone where the limit often drops to 40 km/h and where children may cross without looking. The “reserved lane” sign (a white diamond on the sign) reserves the lane for buses, taxis or multi-passenger vehicles during the posted hours. And lane-ends or narrowing signs ask you to merge early, not at the last moment.","Last reflex: a sign you do not understand is never a reason to drop your guard. Slow down, look, and let others go first when in doubt."],points:["Pentagone = zone scolaire, enfants possibles, souvent 40 km/h","Losange blanc sur panneau = voie réservée","En cas de doute : ralentir et laisser passer"],pointsEn:["Pentagon = school zone, children possible, often 40 km/h","White diamond on a sign = reserved lane","When in doubt: slow down and let others go"]}]},{id:"vitesse",title:"Vitesse et distances",titleEn:"Speed and distances",desc:"Les limites par défaut, la règle des deux secondes et pourquoi la distance d'arrêt explose avec la vitesse.",descEn:"Default limits, the two-second rule, and why stopping distance explodes with speed.",minutes:5,mode:"regles",questionPrefixes:["r01","r02","r13","r42","r49","r55"],sections:[{h:"Quand il n'y a pas de panneau",hEn:"When there is no sign",body:["Toutes les routes n'ont pas de panneau de vitesse. Le Guide donne alors des limites par défaut à connaître par cœur : 50 km/h en agglomération (là où il y a des bâtiments, en ville ou en village) et 80 km/h hors agglomération. Dès qu'un panneau « MAXIMUM » est affiché, c'est lui qui s'applique.","Ces nombres sont des maximums pour des conditions parfaites. Pluie, neige, brouillard ou noirceur exigent de rouler en dessous — parfois beaucoup en dessous. L'examen appelle ça la « vitesse sécuritaire » : celle qui te permet de t'arrêter à temps pour ce que tu vois devant toi."],bodyEn:["Not every road has a speed sign. The Handbook then gives default limits to know by heart: 50 km/h in a built-up area (where there are buildings, in a town or city) and 80 km/h outside one. As soon as a “MAXIMUM” sign is posted, that number applies.","These numbers are maximums for perfect conditions. Rain, snow, fog or darkness require driving below them — sometimes well below. The test calls this the “safe speed”: the one that lets you stop in time for what you can see ahead."],points:["Sans panneau : 50 km/h en agglomération, 80 km/h ailleurs","La limite affichée remplace toujours la limite par défaut","Mauvaises conditions = vitesse plus basse que la limite"],pointsEn:["No sign: 50 km/h in built-up areas, 80 km/h elsewhere","A posted limit always replaces the default","Bad conditions = speed below the limit"]},{h:"La règle des deux secondes",hEn:"The two-second rule",body:["Suivre de trop près est une des causes d'accident les plus fréquentes — et une des fautes que l'examen surveille. La méthode du Guide : choisis un point fixe au bord de la route (un poteau, un panneau). Quand le véhicule devant le passe, compte « mille et un, mille et deux ». Si tu passes le même point avant la fin du compte, tu es trop près : recule.","Par mauvais temps ou derrière un gros véhicule qui cache la vue, passe à trois ou quatre secondes. Un camion devant toi cache les panneaux, les piétons et les freinages des autres : la distance, c'est ta visibilité."],bodyEn:["Following too closely is one of the most common causes of collisions — and one of the faults the test watches for. The Handbook's method: pick a fixed point at the roadside (a pole, a sign). When the vehicle ahead passes it, count “one thousand one, one thousand two”. If you pass the same point before finishing, you are too close: back off.","In bad weather, or behind a large vehicle blocking your view, use three or four seconds. A truck ahead hides signs, pedestrians and other drivers' braking: distance is your visibility."],points:["Deux secondes minimum derrière le véhicule devant","Trois à quatre secondes par mauvais temps","Trop près = pas le temps de réagir"],pointsEn:["At least two seconds behind the vehicle ahead","Three to four seconds in bad weather","Too close = no time to react"]},{h:"La distance d'arrêt grandit vite",hEn:"Stopping distance grows fast",body:["Ton arrêt total, c'est la distance de réaction (ce que tu parcours pendant que ton cerveau décide et que ton pied bouge — environ une seconde) plus la distance de freinage. La partie freinage grandit avec le carré de la vitesse : à 80 km/h, elle est environ quatre fois plus longue qu'à 40 km/h. Doubler la vitesse ne double pas l'arrêt, il le multiplie.","C'est pour ça que les zones scolaires sont à 40 et que les excès de vitesse coûtent si cher en points : à haute vitesse, l'erreur ne pardonne plus, ni pour toi ni pour les autres."],bodyEn:["Your total stop is the reaction distance (what you cover while your brain decides and your foot moves — about one second) plus the braking distance. The braking part grows with the square of speed: at 80 km/h it is roughly four times longer than at 40 km/h. Doubling speed does not double the stop, it multiplies it.","That is why school zones are 40 and speeding costs so many points: at high speed, a mistake no longer forgives — for you or for anyone else."],points:["Arrêt total = réaction + freinage","À 80 km/h, le freinage est ~4× celui de 40 km/h","Plus tu vas vite, plus l'erreur coûte cher"],pointsEn:["Total stop = reaction + braking","At 80 km/h, braking is ~4× that at 40 km/h","The faster you go, the more a mistake costs"]}]},{id:"priorites",title:"Priorités et intersections",titleEn:"Right of way and intersections",desc:"Qui passe en premier : arrêts, céder le passage, piétons, autobus scolaires et véhicules d'urgence.",descEn:"Who goes first: stops, yielding, pedestrians, school buses and emergency vehicles.",minutes:6,mode:"regles",questionPrefixes:["r08","r09","r10","r11","r12","r23","r27","r28","r29","r41","r43","r44","r45","r52"],sections:[{h:"Céder le passage, ça veut dire quoi ?",hEn:"What does yielding actually mean?",body:["La priorité n'est jamais un droit qu'on prend : c'est quelque chose que les autres te donnent. « Céder le passage » signifie ralentir, et arrêter au besoin, pour laisser passer les véhicules et les piétons qui sont déjà engagés ou qui ont la priorité. Si tu forces les autres à freiner ou à changer de direction à cause de toi, tu n'as pas cédé.","Aux intersections sans feux ni panneaux, le premier arrivé repart en premier. Si deux véhicules arrivent en même temps, celui de gauche cède à celui de droite. Et dans tous les cas, les piétons qui traversent ont la priorité sur les voitures qui tournent."],bodyEn:["Right of way is never a right you take: it is something others give you. “Yielding” means slowing down, and stopping if needed, to let vehicles and pedestrians who are already there, or who have priority, go through. If you force others to brake or swerve because of you, you did not yield.","At intersections with no lights or signs, the first to arrive goes first. If two vehicles arrive at the same time, the one on the left yields to the one on the right. And in all cases, pedestrians crossing have priority over turning cars."],points:["La priorité se reçoit, elle ne se prend pas","Intersection sans contrôle : premier arrivé, premier parti","Arrivée en même temps : la gauche cède à la droite","Les piétons ont priorité sur les véhicules qui tournent"],pointsEn:["Right of way is given, never taken","Uncontrolled intersection: first to arrive, first to go","Arriving together: the left yields to the right","Pedestrians have priority over turning vehicles"]},{h:"L'arrêt complet, sans exception",hEn:"The full stop, no exceptions",body:["Au panneau ARRÊT, l'arrêt doit être complet — les roues immobiles — à la ligne d'arrêt, ou juste avant le passage pour piétons s'il y en a un. « Ralentir très fort » n'est pas un arrêt, et c'est exactement l'erreur que les examinateurs et l'examen théorique traquent. Après l'arrêt seulement, tu regardes des deux côtés et tu avances quand c'est libre.","Le même réflexe vaut pour les passages à niveau et les autobus scolaires : quand les feux rouges de l'autobus clignotent et que son panneau d'arrêt est sorti, tu arrêtes à au moins 20 mètres, dans les deux sens (sauf si une bande médiane sépare les directions), et tu attends que les feux s'éteignent."],bodyEn:["At a STOP sign, the stop must be complete — wheels fully still — at the stop line, or just before the crosswalk if there is one. “Slowing down a lot” is not a stop, and it is exactly the mistake examiners and the knowledge test hunt for. Only after stopping do you look both ways and proceed when clear.","The same reflex applies at railway crossings and school buses: when the bus's red lights flash and its stop sign is out, stop at least 20 metres away, in both directions (unless a median divides the road), and wait until the lights go off."],points:["Arrêt = roues complètement immobiles, à la ligne d'arrêt","Autobus scolaire, feux rouges clignotants : arrêt à 20 m, deux sens","Après l'arrêt : regarder des deux côtés avant d'avancer"],pointsEn:["A stop = wheels completely still, at the stop line","School bus with flashing red lights: stop 20 m away, both directions","After stopping: look both ways before proceeding"]},{h:"Véhicules d'urgence : dégage la voie",hEn:"Emergency vehicles: clear the way",body:["Sirène et gyrophares derrière toi ? Le Guide est clair : range-toi à droite le plus près possible du bord, arrête-toi, et reste arrêté jusqu'à ce que le véhicule d'urgence soit passé. Ne bloque jamais une intersection : si tu es dedans, traverse-la puis range-toi. Suivre un véhicule d'urgence de près est aussi interdit — garde au moins 150 mètres.","Même logique pour un véhicule immobilisé au bord de la route avec gyrophares (police, dépanneuse, véhicule du ministère) : ralentis et, si c'est possible, change de voie pour lui laisser l'espace d'une voie complète."],bodyEn:["Siren and flashing lights behind you? The Handbook is clear: pull over to the right as close to the edge as possible, stop, and stay stopped until the emergency vehicle has passed. Never block an intersection: if you are in one, clear it, then pull over. Following an emergency vehicle closely is also forbidden — keep at least 150 metres.","Same logic for a stopped vehicle at the roadside with flashing lights (police, tow truck, ministry vehicle): slow down and, if possible, change lanes to give it a full lane of space."],points:["Urgence derrière toi : à droite, arrêt complet, attendre","Ne jamais bloquer une intersection","Au moins 150 m derrière un véhicule d'urgence en mouvement","Véhicule arrêté avec gyrophares : ralentir et changer de voie si possible"],pointsEn:["Emergency behind you: pull right, stop fully, wait","Never block an intersection","At least 150 m behind a moving emergency vehicle","Stopped vehicle with flashing lights: slow down and move over if possible"]},{h:"Entrées privées et stationnement",hEn:"Driveways and parking",body:["En sortant d'une entrée privée, d'une ruelle ou d'un stationnement, c'est toi qui rejoins la route : tu dois donc t'arrêter et céder le passage à tout ce qui s'y trouve déjà — voitures, cyclistes et piétons sur le trottoir. Le trottoir se traverse comme un passage piétonnier : lentement, après avoir regardé des deux côtés.","Et à l'inverse, quand tu tournes dans une entrée, surveille les piétons qui continuent tout droit sur le trottoir : eux ne changent pas de direction, toi oui."],bodyEn:["When leaving a driveway, alley or parking lot, you are the one joining the road: you must stop and yield to everything already on it — cars, cyclists, and pedestrians on the sidewalk. Cross the sidewalk like a crosswalk: slowly, after looking both ways.","Conversely, when you turn into a driveway, watch for pedestrians walking straight along the sidewalk: they are not changing direction, you are."],points:["Sortie d'entrée privée : arrêt, puis céder à tous","Le trottoir se traverse lentement, piétons prioritaires"],pointsEn:["Leaving a driveway: stop, then yield to everyone","Cross sidewalks slowly, pedestrians have priority"]}]},{id:"depassements",title:"Dépassements et changements de voie",titleEn:"Passing and lane changes",desc:"La méthode en quatre temps, l'angle mort, dépasser et être dépassé sans danger.",descEn:"The four-step method, the blind spot, passing and being passed safely.",minutes:5,mode:"regles",questionPrefixes:["r15","r22","r34","r35","r36","r53","r56"],sections:[{h:"Changer de voie : la méthode",hEn:"Changing lanes: the method",body:["Chaque changement de voie suit la même méthode, dans le même ordre : rétroviseurs, clignotant, angle mort, manœuvre. D'abord regarder les rétroviseurs pour voir la circulation, puis signaler ton intention, puis tourner la tête pour vérifier l'angle mort — cette zone à côté et derrière que les rétroviseurs ne montrent jamais — et seulement ensuite bouger, doucement.","L'angle mort est la cause cachée de beaucoup d'accidents de changement de voie : une moto ou une petite voiture peut y être entièrement invisible dans les rétroviseurs. Le coup d'œil par-dessus l'épaule n'est pas optionnel, c'est lui qui rend la manœuvre sûre."],bodyEn:["Every lane change follows the same method, in the same order: mirrors, signal, blind spot, move. First check the mirrors to see the traffic, then signal your intention, then turn your head to check the blind spot — the area beside and behind you that mirrors never show — and only then move, smoothly.","The blind spot is the hidden cause of many lane-change collisions: a motorcycle or small car can be completely invisible in the mirrors there. The shoulder check is not optional; it is what makes the manoeuvre safe."],points:["Rétroviseurs → clignotant → angle mort → manœuvre","Le coup d'œil par-dessus l'épaule est obligatoire","Signaler avant de bouger, jamais en même temps"],pointsEn:["Mirrors → signal → blind spot → move","The shoulder check is mandatory","Signal before moving, never at the same time"]},{h:"Dépasser, et être dépassé",hEn:"Passing, and being passed",body:["On dépasse par la gauche, sur une route où la visibilité est bonne et la manœuvre permise : jamais dans une intersection, près d'un passage à niveau, sur une pente ou dans un virage où tu ne vois pas assez loin, ni quand la ligne est continue de ton côté. Avant de revenir dans ta voie, assure-toi de voir le véhicule dépassé en entier dans ton rétroviseur intérieur : c'est le signe que l'espace est suffisant.","Et quand c'est toi qu'on dépasse ? Reste à droite, garde ta vitesse stable et n'accélère surtout pas. Accélérer pendant qu'on te dépasse transforme une manœuvre normale en situation dangereuse, et l'examen le considère comme une faute claire."],bodyEn:["Pass on the left, on a road where visibility is good and the manoeuvre is allowed: never in an intersection, near a railway crossing, on a hill or in a curve where you cannot see far enough, nor where the line is solid on your side. Before returning to your lane, make sure you can see the whole passed vehicle in your inside mirror: that is the sign the space is sufficient.","And when you are the one being passed? Stay right, keep your speed steady, and above all do not speed up. Accelerating while being passed turns a normal manoeuvre into a dangerous one, and the test treats it as a clear fault."],points:["Dépasser par la gauche, seulement avec une bonne visibilité","Interdit : intersections, passages à niveau, pentes, virages, ligne continue","Revenir quand le véhicule dépassé est visible au complet dans le rétroviseur","Être dépassé : rester à droite, ne pas accélérer"],pointsEn:["Pass on the left, only with good visibility","Forbidden: intersections, railway crossings, hills, curves, solid line","Return when the passed vehicle is fully visible in your mirror","Being passed: stay right, do not speed up"]},{h:"Cyclistes, motos et camions",hEn:"Cyclists, motorcycles and trucks",body:["Les cyclistes ont droit à leur place sur la route. En les dépassant, la loi ontarienne exige de laisser au moins un mètre d'espace latéral — si tu ne peux pas laisser un mètre, attends. Un coup de vent, un nid-de-poule, et le cycliste bouge de côté : le mètre, c'est sa marge de survie.","Les camions, eux, ont d'énormes angles morts sur les côtés et derrière (la « zone interdite ») : si tu ne vois pas les rétroviseurs du camionneur, il ne te voit pas. Ils ont aussi besoin de beaucoup d'espace pour tourner à droite — ne te glisse jamais entre un camion qui tourne et le trottoir."],bodyEn:["Cyclists have a right to their place on the road. When passing them, Ontario law requires at least one metre of side space — if you cannot leave a metre, wait. A gust of wind, a pothole, and the cyclist moves sideways: the metre is their margin of survival.","Trucks have huge blind spots on the sides and behind (the “no-zone”): if you cannot see the truck driver's mirrors, they cannot see you. They also need a lot of room to turn right — never squeeze between a turning truck and the curb."],points:["Cycliste : au moins 1 m d'espace pour dépasser, sinon attendre","Camion : si tu ne vois pas ses rétroviseurs, il ne te voit pas","Ne jamais se glisser à droite d'un camion qui tourne"],pointsEn:["Cyclist: at least 1 m of space to pass, otherwise wait","Truck: if you can't see its mirrors, it can't see you","Never squeeze right of a turning truck"]},{h:"Le demi-tour : rarement une bonne idée",hEn:"The U-turn: rarely a good idea",body:["Le demi-tour est interdit là où tu ne peux pas être vu à au moins 150 mètres dans les deux directions : dans un virage, sur une pente, près d'un passage à niveau, d'un pont ou d'un tunnel. Même là où il est permis, il reste risqué, parce que les autres conducteurs ne s'y attendent pas.","L'alternative sûre : continue jusqu'à une intersection large, ou fais le tour du pâté de maisons. Quelques secondes de plus valent mieux qu'une manœuvre que personne n'a vue venir."],bodyEn:["U-turns are forbidden where you cannot be seen from at least 150 metres in both directions: in a curve, on a hill, near a railway crossing, a bridge or a tunnel. Even where allowed, they stay risky, because other drivers do not expect them.","The safe alternative: continue to a wide intersection, or drive around the block. A few extra seconds beat a manoeuvre nobody saw coming."],points:["Demi-tour interdit sans 150 m de visibilité des deux côtés","Interdit : virages, pentes, passages à niveau, ponts, tunnels","Alternative : intersection large ou tour du pâté de maisons"],pointsEn:["U-turn forbidden without 150 m of visibility both ways","Forbidden: curves, hills, railway crossings, bridges, tunnels","Alternative: a wide intersection or around the block"]}]},{id:"rond-point",title:"Le rond-point (carrefour giratoire)",titleEn:"The roundabout",desc:"Entrer, circuler et sortir d'un rond-point ontarien — aussi pratiqué dans le simulateur.",descEn:"Entering, circulating and exiting an Ontario roundabout — also practised in the simulator.",minutes:4,mode:"regles",questionPrefixes:["r48"],sections:[{h:"Le principe : céder en entrant",hEn:"The principle: yield on entry",body:["Un rond-point n'est pas un arrêt à quatre coins : c'est une circulation qui tourne en sens antihoraire, et ceux qui sont déjà dedans ont la priorité. En approchant, tu ralentis, tu regardes à gauche, et tu entres seulement quand l'espace est libre. Si un véhicule circule vers toi dans le rond-point, tu attends à la ligne de céder le passage — c'est exactement ce que le simulateur de conduite de cette plateforme t'entraîne à faire.","À l'intérieur, ne t'arrête pas : la circulation doit rester fluide. Si tu manques ta sortie, continue simplement ton tour et sors au passage suivant."],bodyEn:["A roundabout is not a four-way stop: traffic circulates counter-clockwise, and those already inside have priority. Approaching, you slow down, look left, and enter only when the gap is clear. If a vehicle is circulating toward you inside, you wait at the yield line — exactly what this platform's driving simulator trains you to do.","Inside, do not stop: traffic must keep flowing. If you miss your exit, simply continue around and take it on the next pass."],points:["Circulation en sens antihoraire","Ceux qui sont dedans ont la priorité","Entrer seulement quand l'espace est libre","Ne jamais s'arrêter dans le rond-point"],pointsEn:["Traffic circulates counter-clockwise","Those inside have priority","Enter only when the gap is clear","Never stop inside the roundabout"]},{h:"Clignotants et piétons",hEn:"Signals and pedestrians",body:["Pour sortir, mets ton clignotant droit juste après avoir passé la sortie qui précède la tienne : c'est le signal que les autres attendent pour entrer. Si tu tournes à gauche dans le rond-point (troisième sortie), le clignotant gauche à l'entrée aide les autres à comprendre ton trajet, puis le droit avant ta sortie.","Les passages pour piétons sont placés juste avant l'entrée et juste après la sortie. En sortant, ton attention est sur la circulation à gauche — c'est là que les piétons se font surprendre. Ralentis en sortant et vérifie le passage avant de le traverser."],bodyEn:["To exit, use your right signal just after passing the exit before yours: that is the signal others are waiting for to enter. If you are turning left in the roundabout (third exit), a left signal on entry helps others understand your path, then right before your exit.","Crosswalks sit just before the entry and just after the exit. When exiting, your attention is on traffic to the left — that is where pedestrians get surprised. Slow down on exit and check the crosswalk before crossing it."],points:["Clignotant droit avant ta sortie","Piétons : passages à l'entrée ET à la sortie","Sortie manquée : refaire le tour, jamais reculer"],pointsEn:["Right signal before your exit","Pedestrians: crosswalks at the entry AND the exit","Missed exit: go around again, never reverse"]}]},{id:"risques",title:"Alertes et risques",titleEn:"Hazards and risks",desc:"Nuit, pluie, dérapage, fatigue, distractions, alcool : ce qui transforme un trajet ordinaire en accident.",descEn:"Night, rain, skids, fatigue, distractions, alcohol: what turns an ordinary trip into a collision.",minutes:6,mode:"regles",questionPrefixes:["r18","r19","r25","r26","r32","r33","r40","r47","r50","r54"],sections:[{h:"Conduire la nuit",hEn:"Driving at night",body:["La nuit, tes phares sont ta seule fenêtre. Les feux de route (les « hautes ») éclairent loin, mais tu dois passer aux feux de croisement dès qu'un véhicule vient en sens inverse à moins de 150 mètres, ou quand tu suis quelqu'un à moins de 60 mètres : éblouir l'autre conducteur, c'est créer le danger que tu voulais éviter.","La règle d'or de nuit : ne roule jamais plus vite que ce que tes phares te montrent. Si tu ne peux pas t'arrêter dans la zone éclairée devant toi, tu roules trop vite pour tes yeux, même sous la limite."],bodyEn:["At night, your headlights are your only window. High beams light up far ahead, but you must switch to low beams when an oncoming vehicle is within 150 metres, or when following someone within 60 metres: dazzling the other driver creates the very danger you wanted to avoid.","The golden rule at night: never drive faster than your headlights show you. If you cannot stop within the lit area ahead of you, you are driving too fast for your eyes, even under the limit."],points:["Feux de croisement : véhicule en face à moins de 150 m","Feux de croisement : suivi à moins de 60 m","Jamais plus vite que la portée de tes phares"],pointsEn:["Low beams: oncoming vehicle within 150 m","Low beams: following within 60 m","Never faster than your headlights reach"]},{h:"Pluie, dérapage et aquaplanage",hEn:"Rain, skids and hydroplaning",body:["Si l'arrière de la voiture part de côté (dérapage), le réflexe qui sauve : lève le pied de l'accélérateur et dirige le volant dans la direction où tu veux aller — là où tu regardes, pas vers l'obstacle. Freiner fort en plein dérapage aggrave presque toujours la perte de contrôle.","Sous la pluie forte, à vitesse élevée, les pneus peuvent « flotter » sur l'eau : c'est l'aquaplanage, et tu perds alors direction et freinage d'un coup. La prévention est simple : ralentir quand l'eau s'accumule, et garder des pneus en bon état avec une bonne profondeur de rainures."],bodyEn:["If the rear of the car slides sideways (a skid), the reflex that saves you: ease off the accelerator and steer in the direction you want to go — where you are looking, not toward the obstacle. Braking hard mid-skid almost always makes the loss of control worse.","In heavy rain at high speed, tires can “float” on the water: that is hydroplaning, and you lose steering and braking at once. Prevention is simple: slow down when water pools, and keep tires in good condition with deep tread."],points:["Dérapage : pied levé, volant vers où tu veux aller","Ne pas freiner fort en plein dérapage","Aquaplanage : ralentir dès que l'eau s'accumule"],pointsEn:["Skid: foot off, steer where you want to go","Do not brake hard mid-skid","Hydroplaning: slow down when water pools"]},{h:"Fatigue et distractions",hEn:"Fatigue and distractions",body:["Un conducteur fatigué réagit aussi lentement qu'un conducteur qui a bu. Les signes : bâillements, paupières lourdes, difficulté à garder ta voie ou ta vitesse. La seule vraie solution est de s'arrêter dans un endroit sûr et de dormir — le café et la fenêtre ouverte ne font que retarder le problème de quelques minutes.","Pour les distractions, la règle ontarienne est nette : un appareil tenu en main (téléphone, textos, vidéos) est interdit en conduisant, même arrêté à un feu rouge. Le G1 ne change rien à cette règle. Le téléphone attend l'arrivée — ou un arrêt complet hors de la route."],bodyEn:["A tired driver reacts as slowly as a driver who has been drinking. The signs: yawning, heavy eyelids, trouble keeping your lane or your speed. The only real solution is to stop somewhere safe and sleep — coffee and an open window only delay the problem by a few minutes.","For distractions, Ontario's rule is clear: a hand-held device (phone, texting, videos) is forbidden while driving, even stopped at a red light. G1 changes nothing about this rule. The phone waits until you arrive — or until a full stop off the road."],points:["Fatigue = réactions d'un conducteur ivre","Seule solution : s'arrêter et dormir","Téléphone en main : interdit, même au feu rouge"],pointsEn:["Fatigue = the reactions of a drunk driver","Only solution: stop and sleep","Hand-held phone: forbidden, even at a red light"]},{h:"Alcool, drogues et points d'inaptitude",hEn:"Alcohol, drugs and demerit points",body:["Pour un conducteur G1, c'est tolérance zéro : ton taux d'alcool doit être de 0,00, point. L'alcool et le cannabis ralentissent les réflexes, rétrécissent l'attention et donnent une fausse confiance — le trio exact des accidents graves chez les jeunes conducteurs. La sanction peut tomber dès le premier contrôle : suspension immédiate et retour aux étapes du permis.","Le système de points d'inaptitude compte tes infractions : excès de vitesse, suivre de trop près, ne pas céder… Chaque infraction ajoute des points qui restent deux ans à ton dossier. Pour un nouveau conducteur, les conséquences arrivent vite : lettre d'avertissement, entrevue obligatoire, puis suspension de 60 jours si les points continuent de monter."],bodyEn:["For a G1 driver it is zero tolerance: your blood alcohol must be 0.00, full stop. Alcohol and cannabis slow reflexes, narrow attention and give false confidence — the exact trio behind serious collisions for young drivers. Sanctions can land at the very first stop: immediate suspension and a return to earlier licensing steps.","The demerit point system counts your offences: speeding, following too closely, failing to yield… Each offence adds points that stay on your record for two years. For a new driver the consequences come fast: a warning letter, a mandatory interview, then a 60-day suspension if points keep climbing."],points:["G1 : alcool 0,00, sans aucune exception","Les points restent 2 ans au dossier","Nouveau conducteur : avertissement → entrevue → suspension de 60 jours"],pointsEn:["G1: alcohol 0.00, no exceptions at all","Points stay on your record for 2 years","New driver: warning → interview → 60-day suspension"]}]},{id:"jour-test",title:"Le jour du test",titleEn:"Test day",desc:"Le format exact du vrai examen, ce qu'il faut apporter, et comment utiliser tout ce que tu as appris ici.",descEn:"The exact format of the real test, what to bring, and how to use everything you learned here.",minutes:3,mode:"examen",questionPrefixes:[],sections:[{h:"Le format, sans surprise",hEn:"The format, no surprises",body:["Le vrai examen théorique G1 compte 40 questions à choix multiples : 20 sur les panneaux et 20 sur les règles de la route. Les deux sections sont corrigées séparément, et il faut au moins 16 bonnes réponses sur 20 dans CHAQUE section. Un total de 33 ou 34 sur 40 ne suffit pas si une section est à 14 : c'est la règle qui fait échouer le plus de candidats, et c'est pour ça que cette plateforme note toujours les deux sections à part.","Il n'y a pas de limite de temps (la plupart des candidats finissent en 20 à 30 minutes) et le résultat est connu sur place, immédiatement. Si tu rates une seule section, tu peux la reprendre seule pour 16 $ — et un résultat réussi reste valide un an."],bodyEn:["The real G1 knowledge test has 40 multiple-choice questions: 20 on signs and 20 on rules of the road. The two sections are marked separately, and you need at least 16 out of 20 in EACH section. A total of 33 or 34 out of 40 is not enough if one section is at 14: it is the rule that fails the most candidates, and it is why this platform always scores the two sections separately.","There is no time limit (most candidates finish in 20 to 30 minutes) and the result is known on site, immediately. If you fail only one section, you can retake that section alone for $16 — and a passed result stays valid for one year."],points:["40 questions : 20 panneaux + 20 règles, corrigées séparément","Réussite : 16/20 dans CHAQUE section","Aucune limite de temps, résultat immédiat","Reprise d'une section seule : 16 $"],pointsEn:["40 questions: 20 signs + 20 rules, marked separately","Pass: 16/20 in EACH section","No time limit, immediate result","Retaking one section only: $16"]},{h:"Ce qu'il faut apporter, et la stratégie",hEn:"What to bring, and the strategy",body:["L'examen se passe dans un Centre Test au Volant, sans rendez-vous : arrive au moins une heure avant la fermeture, avec une pièce d'identité acceptée et de quoi payer le forfait (environ 159,75 $). Tu passeras aussi un examen de la vue sur place.","Stratégie de réponse : lis chaque question au complet avant de regarder les choix, élimine les réponses absurdes, et méfie-toi des mots absolus (« toujours », « jamais ») qui rendent souvent un choix faux. Si une question te bloque, choisis ta meilleure réponse et continue : tu as tout ton temps pour y revenir. Et surtout, réponds à partir de ce que tu as appris dans le Guide et ici — pas à partir de ce que « tout le monde fait » sur la route."],bodyEn:["The test is taken at a DriveTest Centre, no appointment: arrive at least one hour before closing, with accepted identification and payment for the package (about $159.75). You will also take an eye test on site.","Answering strategy: read each question fully before looking at the choices, eliminate absurd answers, and beware of absolute words (“always”, “never”) that often make a choice false. If a question blocks you, pick your best answer and move on: you have all your time to come back to it. And above all, answer from what you learned in the Handbook and here — not from what “everybody does” on the road."],points:["Centre Test au Volant, sans rendez-vous, 1 h avant la fermeture","Pièce d'identité acceptée + forfait d'environ 159,75 $","Lire la question au complet, éliminer l'absurde","Mots absolus (« toujours », « jamais ») : souvent faux"],pointsEn:["DriveTest Centre, no appointment, 1 hour before closing","Accepted ID + package of about $159.75","Read the whole question, eliminate the absurd","Absolute words (“always”, “never”): often false"]}]}];function Oa(e){let t=null,a=0;for(let r of yt)for(let s of r.questionPrefixes)if(e.startsW  contenu que le vrai test passé aux Centres Test au Volant : les panneaux et les règles de la route de l'Ontario, tirés du Guide officiel de l'automobiliste du MTO. Ici, tu t'entraînes à ton rythme, avec un visuel pour chaque question — avant d'aller passer le vrai.",heroFactFormat:"40 questions · 20 panneaux + 20 règles",heroFactPass:"Réussite : 16/20 dans chaque section",heroFactWalkIn:"Au vrai test : sans rendez-vous, résultat sur place",createProfileCta:"Créer mon profil et commencer",continueCta:"Continuer mon entraînement",seeHow:"Voir comment ça marche",signStripCaption:"La signalisation de l'Ontario — celle du vrai test, pas des panneaux d'ailleurs.",realTestTitle:"Le vrai examen, en bref",realTestNote:"Ce que DriveTest et le MTO publient sur l'examen théorique G1, vérifié sur leurs pages officielles.",factByLabel:"Créé par",factBy:"Le ministère des Transports de l'Ontario (MTO)",factFormatLabel:"Format",factFormat:"Choix multiples, sur papier ou sur ordinateur",factTimeLabel:"Temps",factTime:"Aucune limite de temps — la plupart des gens finissent en 20 à 30 minutes",factResultLabel:"Résultat",factResult:"Corrigé sur place, connu immédiatement",factRetakeLabel:"En cas d'échec",factRetake:"Tu refais seulement la section ratée ; un résultat reste valide un an",factFeeLabel:"Droits à payer",factFee:"Forfait d'environ 159,75 $ ; reprise d'une seule section : 16 $",factWhereLabel:"Où et quand",factWhere:"Dans un Centre Test au Volant, sans rendez-vous — arrive au moins une heure avant la fermeture",howTitle:"Comment ça marche",step1Title:"Crée ton profil sur cet appareil",step1:"Un prénom suffit. Aucun compte en ligne, aucun courriel, aucun mot de passe : le profil reste dans ce navigateur, sur cet appareil. Tes amis font pareil chez eux avec le fichier autonome — chacun garde sa propre progression.",step2Title:"Apprends la théorie, puis entraîne-toi",step2:"Si tu pars de zéro, commence par les 8 chapitres de théorie : chaque règle y est expliquée simplement, avec les chiffres à retenir. Ensuite, 98 questions avec visuel, par paliers : le système sert d'abord les questions jamais vues, puis tes erreurs, et mélange l'ordre à chaque séance.",step3Title:"Passe l'examen blanc",step3:"40 questions comme le vrai test, notées séparément : 16/20 en panneaux ET 16/20 en règles. Un bon total ne compense pas une section faible — c'est exactement là que beaucoup de candidats échouent.",step4Title:"Va passer le vrai test",step4:"Quand tes examens blancs réussissent les deux sections, présente-toi à un Centre Test au Volant avec une pièce d'identité acceptée. La marche à suivre complète est sur la page officielle de DriveTest, liée plus bas.",insideTitle:"Ce que contient la plateforme",insideSigns:"Panneaux de signalisation",insideSignsDesc:"42 questions, chacune avec le panneau ontarien dessiné — forme, couleurs et pictogramme comme sur la route.",insideRules:"Règles de la route",insideRulesDesc:"56 questions de lois ontariennes, chacune avec la situation illustrée : distances, priorités, dépassements, demi-tours, alcool, points d'inaptitude…",insideDrive:"Conduite évaluée",insideDriveDesc:"Un parcours de 2 900 m noté comme par un examinateur : limites qui changent, zone scolaire, arrêt complet, cycliste à dépasser, piéton qui traverse, rond-point à négocier. Manette, clavier ou tactile.",officialBandTitle:"Construit uniquement sur les sources officielles",officialBand:"Chaque question est rédigée à partir du Guide officiel de l'automobiliste (MTO). Les 8 exemples de questions que le MTO publie pour montrer à quoi ressemble le vrai test sont tous couverts ici : dérapage, prêt du permis, entrée privée, dépassement, demi-tour, conduite de nuit… Rien d'européen, rien d'américain, rien copié de sites d'entraînement commerciaux.",samplesLink:"Les exemples de questions officiels du MTO",drivetestCarsLink:"DriveTest — permis de conduire, automobiles",profileTitle:"Ton profil d'entraînement",profileNote:"Profil temporaire gardé sur cet appareil seulement, dans le navigateur. Rien n'est envoyé à un serveur pour le profil. Partage le fichier autonome avec tes amis : chacun crée son profil sur son appareil et progresse de son côté.",profileNameLabel:"Ton prénom ou ton surnom",profileNamePlaceholder:"Ex. : Joseph",profileLangLabel:"Langue du test",profileDateLabel:"Date visée pour le vrai test (facultatif)",profileCreate:"Créer mon profil",profileNameError:"Écris un prénom pour créer ton profil.",profileOnDevice:"Profil sur cet appareil",profileSince:"Créé le",profileTarget:"Test visé le",profileEdit:"Modifier",profileSave:"Enregistrer",profileDelete:"Supprimer le profil",profileDeleteConfirm:"Supprimer ce profil de cet appareil ?",profileDeleteYes:"Oui, supprimer",profileDeleteNote:"Supprimer le profil n'efface pas la progression enregistrée sur cet appareil.",hello:"Bonjour",daysLeft:"jours avant le test visé",testToday:"C'est le jour visé pour ton test — bonne chance !",footerTagline:"Entraînement au test théorique G1 de l'Ontario, en français et en anglais.",footerDisclaimer:"Plateforme d'entraînement indépendante, sans affiliation avec le gouvernement de l'Ontario, le MTO ou DriveTest. Les questions sont des questions d'entraînement rédigées à partir du Guide officiel — ce ne sont pas les questions du vrai examen.",footerSources:"Sources officielles",samplesCovered:"Les 8 exemples officiels publiés par le MTO sont tous couverts par la banque : dérapage (r50), prêt du permis (r51), entrée privée (r52), dépassement (r53), conduite de nuit (r54), vitesse sécuritaire (r55), demi-tour (r56) et changement de voie (r15)."},en:{lastTest:"Last official test — DriveTest",signs:"Road signs",rules:"Rules of the road",passed:"Passed",failed:"To redo",threshold:"Pass mark: 16/20 per section",realRule:"The real pass mark: at least 16/20 in EACH section. A good total does not make up for a weak section — the rules section is the one you still need to pass.",path:"Progress path",pathNote:"The 13 levels cover the whole ba . Excellent.",backHome:"Home",presentation:"Overview",redoErrors:"Redo these mistakes",loading:"Loading your progress…",loadError:"Could not load your progress. Check your connection and try again.",retry:"Retry",startError:"Could not prepare the session. Check your connection and try again.",reset:"Reset my progress",resetConfirm:"Erase everything?",resetYes:"Yes, erase everything",cancel:"Cancel",noWeak:"You have no recorded mistakes yet. Do a practice session to get started.",quit:"Quit",streak:"correct answers in a row",handbook:"Official MTO Driver's Handbook — the source of the real test",drivetest:"DriveTest — official driver handbooks",scoring:"How the G1 test is scored (16/20 per section)",officialOnly:"Official Canadian sources only: every question is written from the Official Driver's Handbook of Ontario's Ministry of Transportation (MTO) — the same source as the real G1 test. No questions copied from unofficial practice sites, and no European or American content: the rules, signs and limits are Ontario's.",bankNote:"A bank of 98 original questions (42 signs, 56 rules), each with its own visual: the real sign or the illustrated situation.",langLabel:"Question language",preparing:"Preparing your session…",standalone:"Standalone version — outside Muse",standaloneDesc:"The full platform also exists as a standalone version: a single HTML file, no server, to drop on GitHub Pages, Netlify or Surge — or to open directly on your PC. Same questions, same visuals, same driving simulator and same selection logic; your progress there is saved in the browser.",keepOnPc:"Keep it on your PC — no Muse, no GitHub",keepOnPcDesc:"Download the full platform as a single file, then open it directly on your PC. After the download you no longer need Muse, GitHub, or even the internet: everything is in the file — all 98 questions, the visuals, the driving simulator with gamepad support and the smart question selection. Your progress there is saved in the browser.",downloadStandal
